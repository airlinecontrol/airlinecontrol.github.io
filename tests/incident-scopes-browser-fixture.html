<!doctype html>
<meta charset="utf-8">
<title>AOC incident scope browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{ if(!condition) throw new Error(message); };
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=incident-scopes&cache='+Date.now();
    await loaded;
    const w=frame.contentWindow;
    w.resetLocalSave?.();
    w.eval('state.ops.automaticDisruptions=false; state.incidents=[]; state.coordinationTasks=[]; state.flights=[]; state.aircraft=[];');
    assert(w.eval('Array.isArray(state.problems)'),'state should expose problems as the canonical problem collection');
    assert(w.eval('state.incidents===state.problems'),'legacy incident collection should be an alias of problems');
    assert(w.eval('state.coordinationTasks===state.problemTasks'),'legacy task collection should be an alias of problemTasks');

    const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const now=w.simNow();
    const first=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure:now+90*60_000,fare:{economy:140,business:360,first:700}});
    const second=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'AMS',departure:first.arrival+75*60_000,fare:{economy:120,business:300,first:600}});
    const otherAircraft=w.assignRequestedAircraft('E190',w.defaultCabin('E190'),'FRA');
    const third=w.createFlightRecord({aircraftId:otherAircraft.id,from:'FRA',to:'CDG',departure:now+120*60_000,fare:{economy:110,business:260,first:500}});

    const mel=w.createIncident('mel_defect',first,{training:true,detectedAt:now,source:'fixture'});
    const duplicateMel=w.createIncident('mel_defect',second,{training:true,detectedAt:now+60_000,source:'fixture'});
    assert(/^PR\d+$/.test(mel.id),'newly created operational problems should use PR ids');
    assert(mel&&duplicateMel&&mel.id===duplicateMel.id,'aircraft-scoped technical cases should dedupe by aircraft');
    assert(mel.entity==='problem'&&mel.problemId===mel.id,'created case did not use the problem model identity');
    assert(mel.scope?.kind==='aircraft'&&mel.scope.subjectId===ac.id,'MEL case did not store aircraft scope');
    assert(w.incidentAffectedFlightIds(mel).includes(first.id),'MEL case missing primary affected flight');

    const stationA=w.createIncident('deicing_capacity_collapse',first,{training:true,detectedAt:now,source:'fixture',context:{airport:'FRA',reason:'fixture deicing shortage',active:true,delayMin:40}});
    const stationB=w.createIncident('deicing_capacity_collapse',third,{training:true,detectedAt:now+2*60_000,source:'fixture',context:{airport:'FRA',reason:'fixture deicing shortage',active:true,delayMin:45}});
    assert(stationA&&stationB&&stationA.id===stationB.id,'airport-scoped station cases should dedupe by airport condition');
    assert(stationA.scope?.kind==='airport'&&stationA.scope.subjectId==='FRA','station case did not store airport scope');
    assert(w.openIncidentsForFlight(third.id).some(incident=>incident.id===stationA.id),'affected flights should see airport-scoped incidents through the operational index');

    const crewA=w.createIncident('crew_sick',first,{training:true,detectedAt:now,source:'fixture'});
    const crewB=w.createIncident('crew_sick',third,{training:true,detectedAt:now+60_000,source:'fixture'});
    assert(crewA&&crewB&&crewA.id!==crewB.id,'flight-scoped crew cases should remain separate per flight');
    assert(crewA.scope?.kind==='flight'&&crewA.scope.subjectId===first.id,'crew case did not store flight scope');

    const melMarkup=w.incidentCaseMarkup(mel);
    const stationMarkup=w.incidentCaseMarkup(stationA);
    const crewMarkup=w.incidentCaseMarkup(crewA);
    assert(melMarkup.includes('Problem · Aircraft'),'aircraft problem card does not show the problem scope');
    assert(melMarkup.includes(`data-case-affected-flight="${first.id}"`),'aircraft problem card does not show its affected flight');
    assert(stationMarkup.includes('Problem · Airport'),'airport problem card does not show the problem scope');
    assert(stationMarkup.includes(`data-case-affected-flight="${third.id}"`),'airport problem card does not show all affected flights');
    assert(crewMarkup.includes('Problem · Flight'),'flight problem card does not show the problem scope');
    assert(crewMarkup.includes(`data-case-affected-flight="${first.id}"`),'flight problem card does not show its affected flight');

    const legacyOne={...crewA,id:'LEG1',status:'open',scope:null,dedupeKey:'',flightId:first.id,type:'crew_report_delayed',detectedAt:now,context:{sourceId:first.id,role:'captains'}};
    const legacyTwo={...legacyOne,id:'LEG2',lastDetectedAt:now+5*60_000};
    w.eval(`state.incidents.push(${JSON.stringify(legacyOne)},${JSON.stringify(legacyTwo)})`);
    assert(w.repairDuplicateOpenIncidents(now+6*60_000),'legacy duplicate repair did not report a change');
    const openLegacyCount=w.eval(`state.incidents.filter(incident=>incident.status==='open'&&incident.type==='crew_report_delayed'&&incident.flightId===${JSON.stringify(first.id)}).length`);
    assert(openLegacyCount===1,'legacy duplicate repair did not merge open duplicates');

    w.save();
    const saved=JSON.parse(w.localStorage.getItem('aerosim_mvp_v6'));
    assert(Array.isArray(saved.problems),'saved state should persist problems');
    assert(Array.isArray(saved.problemTasks),'saved state should persist problemTasks');
    assert(!Object.prototype.hasOwnProperty.call(saved,'incidents'),'saved state should not persist the legacy incidents array');
    assert(!Object.prototype.hasOwnProperty.call(saved,'coordinationTasks'),'saved state should not persist the legacy coordinationTasks array');
    assert(!Object.prototype.hasOwnProperty.call(saved,'incidentTransitions'),'saved state should not persist legacy transition names');
    assert(saved.problems.every(problem=>!Object.prototype.hasOwnProperty.call(problem,'incidentId')),'saved problems should not persist incidentId aliases');
    assert(saved.problems.every(problem=>!Object.prototype.hasOwnProperty.call(problem,'rootIncidentId')),'saved problems should not persist rootIncidentId aliases');
    assert(saved.problems.every(problem=>!Object.prototype.hasOwnProperty.call(problem,'triggeredByIncidentId')),'saved problems should not persist triggeredByIncidentId aliases');
    assert(saved.problemTasks.every(task=>!Object.prototype.hasOwnProperty.call(task,'incidentId')),'saved problem tasks should not persist incidentId aliases');

    result.textContent=`PASS\nmel=${mel.scope.kind}:${mel.scope.subjectId}\nstation=${stationA.scope.kind}:${stationA.scope.subjectId}\nlegacyOpen=${openLegacyCount}`;
    await wait(10);
  }catch(error){
    result.textContent='FAIL\n'+(error.stack||error);
  }
})();
</script>
