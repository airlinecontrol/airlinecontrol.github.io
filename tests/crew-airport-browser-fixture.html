<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AeroSim crew duty and airport catalog fixture</title></head>
<body>
<pre id="result">RUNNING</pre>
<iframe id="app" title="AeroSim test application" style="width:1280px;height:900px"></iframe>
<script>
  const HOUR=60*60*1000;
  const now=Date.now();
  const firstDeparture=now-6*HOUR;
  const returnArrival=now-HOUR;
  localStorage.removeItem('aerosim_occ_ui_v1');
  localStorage.setItem('aerosim_mvp_v6',JSON.stringify({
    version:6,
    clock:{realBase:now,simBase:now,speed:1},
    cash:0,home:'FRA',nextAircraft:2,nextFlight:3,nextService:2,nextSlotRight:1,nextIncident:1,
    aircraft:[{id:'AC1',tail:'D-AS01',model:'A320neo',cabin:{economy:150,business:15,first:0},location:'FRA',condition:100,flightHours:0,cycles:0,fuelGallons:0,acquisitionType:'requested',acquiredAt:now}],
    flights:[
      {id:'AS1',aircraftId:'AC1',from:'FRA',to:'LHR',departure:firstDeparture,arrival:now-4*HOUR,actualDeparture:firstDeparture,actualArrival:now-4*HOUR,serviceId:'SCH1',serviceLeg:'outbound',fare:160,fares:{economy:160,business:420,first:800},load:.8,pax:144,classPax:{economy:132,business:12,first:0},classLoads:{economy:.88,business:.8,first:0},revenue:26160,costs:19000,baseCosts:19000,settled:true,departureLogged:true},
      {id:'AS2',aircraftId:'AC1',from:'LHR',to:'FRA',departure:now-3*HOUR,arrival:returnArrival,actualDeparture:now-3*HOUR,actualArrival:returnArrival,serviceId:'SCH1',serviceLeg:'return',fare:160,fares:{economy:160,business:420,first:800},load:.8,pax:144,classPax:{economy:132,business:12,first:0},classLoads:{economy:.88,business:.8,first:0},revenue:26160,costs:19000,baseCosts:19000,settled:true,departureLogged:true}
    ],
    services:[],incidents:[],slotRights:[],transactions:[],personnelTransfers:[],
    personnel:{assignments:{FRA:{captains:1,firstOfficers:1,cabinCrew:4,groundHandling:20,operations:10,customerService:10}},qualifications:{FRA:{captains:{'Airbus A320 family':1},firstOfficers:{'Airbus A320 family':1}}},lastPayrollAt:now},
    fuelMarket:{pricePerGallon:2.45,updatedAt:now},ops:{automaticDisruptions:true},
    stats:{revenue:0,costs:0,staffCosts:0,leaseCosts:0,transferCosts:0,cancelled:0,pax:0,completed:0}
  }));

  const frame=document.getElementById('app');
  frame.addEventListener('load',()=>setTimeout(()=>{
    try{
      const win=frame.contentWindow;
      const doc=frame.contentDocument;
      const aircraft={id:'AC1',tail:'D-AS01',model:'A320neo',cabin:{economy:150,business:15,first:0},location:'FRA'};
      const nextDeparture=now+HOUR;
      const shortDuty=win.staffingShortagesForFlight(aircraft,nextDeparture,4*HOUR,'FRA');
      const longDuty=win.staffingShortagesForFlight(aircraft,nextDeparture,8*HOUR,'FRA');
      const airportOptions=[...doc.querySelectorAll('#origin option')].map(option=>option.value).filter(Boolean);
      const expectedNew=['IST','MUC','ZRH','BCN','DUB','ATL','ORD','DFW','LAX','MIA','YYZ','ICN','HKG','PVG','DEL','BKK','DOH','JNB','GRU','SYD','EWR','LGW','ORY','NRT','AUH','MXP','DUS','KUL'];
      const checks={
        allAirportsAvailable:airportOptions.length===38&&expectedNew.every(code=>airportOptions.includes(code)),
        shortDutyReusesCockpitCrew:!shortDuty.some(message=>/Captains|First officers/.test(message)),
        longDutyNeedsReliefCockpitCrew:longDuty.some(message=>/Captains/.test(message))&&longDuty.some(message=>/First officers/.test(message))
      };
      const passed=Object.values(checks).every(Boolean);
      document.getElementById('result').textContent=`${passed?'PASS':'FAIL'} ${JSON.stringify(checks)} short=${JSON.stringify(shortDuty)} long=${JSON.stringify(longDuty)}`;
    }catch(error){ document.getElementById('result').textContent=`FAIL ${error.stack||error}`; }
  },1200));
  frame.src='../airline-manager-mvp-v9.2.html?crew-airport-smoke=1';
</script>
</body>
</html>
