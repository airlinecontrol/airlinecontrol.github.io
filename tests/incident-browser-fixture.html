<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AeroSim operational workflow fixture</title></head>
<body>
<pre id="result">RUNNING</pre>
<iframe id="app" title="AeroSim test application" style="width:1440px;height:1000px"></iframe>
<script>
  const MIN=60000,HOUR=3600000,now=Date.now(),departure=now+4*HOUR;
  const incidentTypes=['crew_sick','mel_defect','atc_restriction','gate_conflict','destination_closure'];
  localStorage.removeItem('aerosim_occ_ui_v1');
  localStorage.setItem('aerosim_mvp_v6',JSON.stringify({
    version:6,clock:{realBase:now,simBase:now,speed:1},cash:75000000,home:'FRA',
    nextAircraft:7,nextFlight:7,nextService:1,nextSlotRight:1,nextIncident:7,incidentExerciseIndex:0,
    aircraft:incidentTypes.map((type,index)=>({id:`AC${index+1}`,tail:`D-AS0${index+1}`,model:'A320neo',cabin:{economy:150,business:15,first:0},location:'FRA',condition:86,flightHours:510,cycles:360,fuelGallons:0,melItems:[],acquisitionType:'owned',acquiredAt:now}))
      .concat({id:'AC6',tail:'D-AS06',model:'A320neo',cabin:{economy:150,business:15,first:0},location:'FRA',condition:92,flightHours:220,cycles:130,fuelGallons:0,melItems:[],acquisitionType:'owned',acquiredAt:now}),
    flights:incidentTypes.map((type,index)=>{
      const legDeparture=departure+index*10*MIN;
      return {id:`AS${index+1}`,aircraftId:`AC${index+1}`,from:'FRA',to:'LHR',departure:legDeparture,arrival:legDeparture+2*HOUR,incidentChecks:{operationalGeneration:true},opsChecked:true,weatherChecked:true,fare:160,fares:{economy:160,business:420,first:800},load:.8,pax:144,classPax:{economy:132,business:12,first:0},classLoads:{economy:.88,business:.8,first:0},revenue:26160,costs:19000,baseCosts:19000,settled:false,departureLogged:false};
    }).concat({id:'AS6',aircraftId:'AC6',from:'FRA',to:'AMS',departure:departure+70*MIN,arrival:departure+3*HOUR,incidentChecks:{operationalGeneration:true},opsChecked:true,weatherChecked:true,fare:140,fares:{economy:140,business:380,first:700},load:.75,pax:124,classPax:{economy:114,business:10,first:0},classLoads:{economy:.76,business:.67,first:0},revenue:19760,costs:15000,baseCosts:15000,settled:false,departureLogged:false}),
    incidents:incidentTypes.map((type,index)=>({id:`INC${index+1}`,type,flightId:`AS${index+1}`,aircraftId:`AC${index+1}`,airport:type==='destination_closure'?'LHR':'FRA',detectedAt:now,deadline:now+30*MIN,status:'open',severity:['crew_sick','mel_defect','destination_closure'].includes(type)?'critical':'warning',blocking:true,training:true,selectedAction:'',resolvedAt:0,outcome:'',automaticResolution:false}))
      .concat({id:'INC6',type:'atc_restriction',flightId:'AS6',aircraftId:'AC6',airport:'FRA',detectedAt:now-40*MIN,deadline:now-10*MIN,status:'open',severity:'warning',blocking:true,training:true,selectedAction:'',resolvedAt:0,outcome:'',automaticResolution:false}),
    services:[],slotRights:[],transactions:[],personnelTransfers:[],
    personnel:{assignments:{FRA:{captains:4,firstOfficers:4,cabinCrew:12,groundHandling:12,operations:4,customerService:4},LGW:{groundHandling:8},AMS:{groundHandling:8},CDG:{groundHandling:8}},qualifications:{FRA:{captains:{'Airbus A320 family':4},firstOfficers:{'Airbus A320 family':4}}},lastPayrollAt:now},
    fuelMarket:{pricePerGallon:2.45,updatedAt:now},ops:{automaticDisruptions:true},
    stats:{revenue:0,costs:0,staffCosts:0,leaseCosts:0,transferCosts:0,cancellationCosts:0,scheduledMaintenanceCosts:0,cancelled:0,pax:0,completed:0}
  }));

  const frame=document.getElementById('app');
  frame.addEventListener('load',()=>setTimeout(()=>{
    try{
      const win=frame.contentWindow,doc=frame.contentDocument;
      const widgets=['dispatch-control','crew-control','maintenance-control','station-operations'];
      const departmentWidgets=widgets.every(id=>doc.querySelector(`[data-widget="${id}"]`));
      const incidentsIntegrated=!doc.querySelector('[data-widget="incidents"]')&&Boolean(doc.querySelector('#occAttentionList [data-incident-flight]'));
      const attentionTitles=[...doc.querySelectorAll('#occAttentionList [data-attention-incident]')].map(tile=>tile.textContent.trim().replace(/\s+/g,' '));
      const attentionIncidentTiles=['Crew sick call','MEL technical defect','ATC flow restriction','Gate conflict','Destination closure']
        .every(title=>attentionTitles.some(text=>text.includes(title)));
      doc.querySelector('[data-incident-flight="AS1"]')?.click();
      const pane=doc.getElementById('flightDetailsPane'),caseSection=pane.querySelector('#flight-section-incidents'),overview=pane.querySelector('#flight-section-overview');
      const caseFirst=Boolean(caseSection&&overview&&(caseSection.compareDocumentPosition(overview)&Node.DOCUMENT_POSITION_FOLLOWING));
      const flightIncidentVisible=pane.textContent.includes('Crew sick call')&&pane.textContent.includes('required operating crew member');
      const noDuplicateIncidentSummary=(pane.textContent.match(/required operating crew member/gi)||[]).length===1;
      const noInstantIncidentActions=!doc.querySelector('[data-resolve-incident]')&&!pane.querySelector('[data-operational-task]');
      const taskLinksInCase=Boolean(pane.querySelector('[data-open-department-task="INC1:crew-strategy"]'));
      const attentionOnlyAcknowledges=Boolean(doc.querySelector('#occAttentionList [data-acknowledge-flight="AS1"]'))&&!doc.querySelector('#occAttentionList [data-delay-flight],#occAttentionList [data-priority-fuel],#occAttentionList [data-cancel-flight],#occAttentionList [data-resolve-incident],#occAttentionList [data-operational-task]');

      pane.querySelector('[data-open-department-task="INC1:crew-strategy"]')?.click();
      const crewWidgetOpened=doc.querySelector('[data-widget="crew-control"] .widget-header')?.getAttribute('aria-expanded')==='true'&&doc.getElementById('crewTaskDetail').textContent.includes('Choose crew recovery');
      const taskProgressBars=Boolean(doc.querySelector('.case-progress .workflow-progress-bar'));

      win.performOperationalTask('INC1:crew-strategy','replace');
      win.performOperationalTask('INC1:crew-allocate','',{optionId:'FRA:captains'});
      win.processOperationalWorkflows(Number.MAX_SAFE_INTEGER);
      win.performOperationalTask('INC1:dispatch-release');

      win.performOperationalTask('INC2:mx-inspect');
      win.processOperationalWorkflows(Number.MAX_SAFE_INTEGER);
      win.performOperationalTask('INC2:mx-strategy','defer');
      win.performOperationalTask('INC2:mx-defer','defer');
      win.performOperationalTask('INC2:dispatch-release');

      win.performOperationalTask('INC3:dispatch-flow-strategy','priority');
      win.performOperationalTask('INC3:dispatch-flow-priority');
      win.processOperationalWorkflows(Number.MAX_SAFE_INTEGER);
      win.performOperationalTask('INC3:dispatch-release');

      win.performOperationalTask('INC4:station-stand-strategy','remote');
      win.performOperationalTask('INC4:station-remote');
      win.processOperationalWorkflows(Number.MAX_SAFE_INTEGER);
      win.performOperationalTask('INC4:station-coordinate');

      win.performOperationalTask('INC5:dispatch-diversion-strategy','alternate');
      win.performOperationalTask('INC5:dispatch-alternate','',{airport:'LGW'});
      win.performOperationalTask('INC5:dispatch-flightdeck');
      win.processOperationalWorkflows(Number.MAX_SAFE_INTEGER);
      win.performOperationalTask('INC5:dispatch-atc');
      win.performOperationalTask('INC5:station-alternate');
      win.processOperationalWorkflows(Number.MAX_SAFE_INTEGER);
      win.performOperationalTask('INC5:dispatch-release');

      setTimeout(()=>{
        try{
          const saved=JSON.parse(localStorage.getItem('aerosim_mvp_v6'));
          const flight=id=>saved.flights.find(item=>item.id===id);
          const firstFive=saved.incidents.slice(0,5),overdue=saved.incidents.find(item=>item.id==='INC6');
          const checks={
            incidentsIntegrated,attentionIncidentTiles,departmentWidgets,caseFirst,flightIncidentVisible,
            noDuplicateIncidentSummary,noInstantIncidentActions,taskLinksInCase,attentionOnlyAcknowledges,
            crewWidgetOpened,taskProgressBars,
            persistentTasks:saved.coordinationTasks.filter(task=>firstFive.some(incident=>incident.id===task.incidentId)&&task.required!==false&&task.status!=='cancelled').every(task=>task.status==='completed')
              && saved.coordinationTasks.filter(task=>firstFive.some(incident=>incident.id===task.incidentId)&&task.kind==='flight_cancellation').every(task=>task.status==='cancelled'),
            externalCoordination:saved.externalRequests.length>=4&&saved.externalRequests.every(request=>request.status==='responded'),
            resourceAllocation:Boolean(saved.resourceAssignments.find(item=>item.incidentId==='INC1'&&item.status==='committed')),
            incidentsResolved:firstFive.every(item=>item.status==='resolved'&&item.selectedAction==='workflow_complete'),
            overdueRequiresPlayer:overdue?.status==='open'&&overdue?.overdue===true&&!overdue?.automaticResolution,
            crewResponse:flight('AS1')?.incidentDelayMin>=20,
            melResponse:saved.aircraft.find(item=>item.id==='AC2')?.melItems?.some(item=>item.status==='open'),
            atcResponse:flight('AS3')?.incidentDelayMin>=20,
            gateResponse:flight('AS4')?.incidentDelayMin>=20,
            closureResponse:flight('AS5')?.diversionAirport==='LGW',
            completedCasesLeaveQueues:saved.coordinationTasks.filter(task=>firstFive.some(incident=>incident.id===task.incidentId)).every(task=>!doc.querySelector(`[data-department-task="${task.id}"]`))&&Boolean(doc.querySelector('[data-department-task="INC6:dispatch-flow-strategy"]')),
            problemBadgesVisible:Boolean(doc.querySelector('#occUpcomingFlightList [data-occ-flight="AS1"] .problem-reason-badge')&&doc.querySelector('#aircraftList [data-aircraft-id="AC1"] .problem-reason-badge')),
            noPastIncidentHistory:!doc.querySelector('.incident-history')
          };
          const passed=Object.values(checks).every(Boolean);
          document.getElementById('result').textContent=`${passed?'PASS':'FAIL'} ${JSON.stringify(checks)}`;
        }catch(error){ document.getElementById('result').textContent=`FAIL ${error.stack||error}`; }
      },500);
    }catch(error){ document.getElementById('result').textContent=`FAIL ${error.stack||error}`; }
  },1200));
  frame.src='../airline-manager-mvp-v9.2.html?incident-workflow-smoke=1';
</script>
</body>
</html>
