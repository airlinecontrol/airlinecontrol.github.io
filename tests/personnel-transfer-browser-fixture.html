<!doctype html>
<meta charset="utf-8">
<title>AeroSim personnel transfer fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const loadApp=async()=>{
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=personnel-transfer&cache='+Date.now();
    await loaded;
  };
  await loadApp();
  try{
    let w=frame.contentWindow;
    const assert=(condition,message)=>{if(!condition)throw new Error(message);};
    const setStaff=(airport,role,value,qualification='')=>{
      const current=w.staffAt(airport,role);
      w.changeStaff(airport,role,value-current);
      if(qualification){
        const rated=w.qualificationAt(airport,role,qualification);
        w.changeQualification(airport,role,qualification,value-rated);
      }
    };
    w.resetLocalSave();
    await loadApp();
    w=frame.contentWindow;
    w.changeStaff('FRA','cabinCrew',3);
    const beforeTo=w.staffAt('AMS','cabinCrew');
    w.document.getElementById('transferPersonnelRole').value='cabinCrew';
    w.document.getElementById('transferPersonnelAmount').value='2';
    w.document.getElementById('transferPersonnelFrom').value='FRA';
    w.document.getElementById('transferPersonnelTo').value='AMS';
    w.document.getElementById('transferPersonnelMethod').value='external';
    w.refreshPersonnelTransferOptions();
    assert(/New external booking/.test(w.document.getElementById('personnelTransferPreview').textContent),'external transfer preview does not distinguish a new booking quote');
    w.createPersonnelTransfer();
    let saved=JSON.parse(w.localStorage.getItem('aerosim_mvp_v6'));
    const transfer=saved.personnelTransfers[0];
    assert(transfer&&transfer.status==='scheduled','external transfer was not booked');
    assert(transfer.originDebited===false,'new external transfer should not debit origin before departure');
    assert(w.staffAt('FRA','cabinCrew')===3,'booked external transfer removed staff from origin before departure');
    assert(w.availableStationStaffAt('FRA','cabinCrew')===1,'booked external transfer did not reserve origin availability');
    w.processPersonnelTransfers(transfer.departure+60_000);
    assert(w.eval('state.personnelTransfers[0].status')==='in_transit','external transfer did not enter transit after departure');
    assert(w.staffAt('FRA','cabinCrew')===1,'external transfer did not remove staff from origin at departure');
    assert(w.staffAt('AMS','cabinCrew')===beforeTo,'external transfer added staff at destination before arrival');
    w.eval(`state.clock={realBase:Date.now(),simBase:${transfer.arrival+60_000},speed:1};`);
    w.processEvents();
    saved=JSON.parse(w.localStorage.getItem('aerosim_mvp_v6'));
    const completed=saved.personnelTransfers[0];
    assert(completed.status==='completed','external transfer did not complete after arrival');
    assert(completed.actualTo==='AMS','external transfer arrived at the wrong station');
    assert(w.staffAt('FRA','cabinCrew')===1,'external transfer did not remove staff from origin correctly');
    assert(w.staffAt('AMS','cabinCrew')===beforeTo+2,'external transfer did not add staff at destination');
    w.renderPersonnelTransfers();
    assert(/completed/i.test(w.document.getElementById('personnelTransferList').textContent),'completed transfer is not rendered as completed');
    w.changeStaff('FRA','cabinCrew',4);
    const ownBeforeTo=w.staffAt('LHR','cabinCrew');
    const ferryAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const ferry=w.createFlightRecord({aircraftId:ferryAc.id,from:'FRA',to:'LHR',departure:w.simNow()+2*60*60_000,fare:{economy:0,business:0,first:0},flightType:'ferry'});
    w.document.getElementById('transferPersonnelRole').value='cabinCrew';
    w.document.getElementById('transferPersonnelAmount').value='2';
    w.document.getElementById('transferPersonnelFrom').value='FRA';
    w.document.getElementById('transferPersonnelTo').value='LHR';
    w.document.getElementById('transferPersonnelMethod').value='own';
    w.refreshPersonnelTransferOptions();
    w.document.getElementById('transferPersonnelFlight').value=ferry.id;
    assert(/non-revenue booking/.test(w.document.getElementById('personnelTransferPreview').textContent),'own-flight transfer preview did not offer the ferry flight');
    const ownBeforeFrom=w.staffAt('FRA','cabinCrew');
    w.createPersonnelTransfer();
    const ownTransfer=w.eval('state.personnelTransfers[state.personnelTransfers.length-1]');
    assert(ownTransfer?.status==='scheduled'&&ownTransfer.flightId===ferry.id,'own-flight personnel transfer was not scheduled on the ferry');
    assert(w.staffAt('FRA','cabinCrew')===ownBeforeFrom,'booked own-flight transfer removed staff from origin before flight departure');
    assert(w.availableStationStaffAt('FRA','cabinCrew')===ownBeforeFrom-2,'booked own-flight transfer did not reserve origin availability');
    w.processPersonnelTransfers(ferry.departure+60_000);
    assert(w.eval(`state.personnelTransfers.find(item=>item.id==='${ownTransfer.id}').status`)==='in_transit','own-flight transfer did not enter transit after ferry departure');
    assert(w.staffAt('FRA','cabinCrew')===ownBeforeFrom-2,'own-flight transfer did not debit origin at ferry departure');
    w.processPersonnelTransfers(ferry.arrival+60_000);
    assert(w.eval(`state.personnelTransfers.find(item=>item.id==='${ownTransfer.id}').status`)==='completed','own-flight transfer did not complete after ferry arrival');
    assert(w.staffAt('LHR','cabinCrew')===ownBeforeTo+2,'own-flight transfer did not add staff at ferry destination');
    const family='Airbus A320 family';
    setStaff('CDG','captains',0,'Multi-fleet');
    setStaff('CDG','captains',0,family);
    setStaff('CDG','firstOfficers',2,family);
    setStaff('CDG','cabinCrew',4);
    setStaff('CDG','groundHandling',8);
    setStaff('CDG','operations',4);
    setStaff('CDG','customerService',4);
    setStaff('AMS','captains',2,family);
    const legalAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'CDG');
    const legalFlight=w.createFlightRecord({aircraftId:legalAc.id,from:'CDG',to:'FRA',departure:w.simNow()+4*60*60_000,fare:{economy:120,business:300,first:600}});
    const legalProblem=w.createProblem('no_legal_crew',legalFlight,{training:true,detectedAt:w.simNow(),source:'derived',sourceKey:'fixture:no-legal-after-transfer',context:{role:'captains'}});
    assert(legalProblem?.status==='open','no-legal-crew fixture problem was not open before personnel move');
    assert(/still not legal/.test(w.legalCrewConfirmationBlocker(legalProblem)),'no-legal-crew fixture was already legal before personnel move');
    const legalFerryAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'AMS');
    const legalFerry=w.createFlightRecord({aircraftId:legalFerryAc.id,from:'AMS',to:'CDG',departure:w.simNow()+30*60_000,fare:{economy:0,business:0,first:0},flightType:'ferry'});
    w.document.getElementById('transferPersonnelRole').value='captains';
    w.document.getElementById('transferPersonnelAmount').value='1';
    w.document.getElementById('transferPersonnelFrom').value='AMS';
    w.document.getElementById('transferPersonnelTo').value='CDG';
    w.document.getElementById('transferPersonnelMethod').value='own';
    w.refreshPersonnelTransferOptions();
    w.document.getElementById('transferPersonnelFlight').value=legalFerry.id;
    w.createPersonnelTransfer();
    const legalTransfer=w.eval('state.personnelTransfers[state.personnelTransfers.length-1]');
    assert(legalTransfer?.flightId===legalFerry.id,'legal-crew recovery transfer was not booked on the ferry');
    assert(legalProblem.status==='open','no-legal-crew problem resolved before the ferry arrived');
    w.processPersonnelTransfers(legalFerry.arrival+60_000);
    assert(legalProblem.status==='resolved','no-legal-crew problem did not resolve when moved crew arrived');
    assert(legalProblem.recoveredByResourceUpdate,'no-legal-crew problem did not record resource-update recovery');
    setStaff('LHR','captains',2,family);
    const positionAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const positionFlight=w.createFlightRecord({aircraftId:positionAc.id,from:'FRA',to:'AMS',departure:w.simNow()+5*60*60_000,fare:{economy:120,business:300,first:600}});
    const positionProblem=w.createProblem('crew_misposition_after_diversion',positionFlight,{training:true,detectedAt:w.simNow(),source:'derived',sourceKey:'fixture:manual-crew-move',context:{role:'captains',from:'LHR',crewAirport:'LHR',delayMin:45}});
    assert(positionProblem?.status==='open','crew-positioning fixture problem was not open before manual move');
    w.document.getElementById('transferPersonnelRole').value='captains';
    w.document.getElementById('transferPersonnelAmount').value='1';
    w.document.getElementById('transferPersonnelFrom').value='LHR';
    w.document.getElementById('transferPersonnelTo').value='FRA';
    w.document.getElementById('transferPersonnelMethod').value='external';
    w.refreshPersonnelTransferOptions();
    w.createPersonnelTransfer();
    const positionTransfer=w.eval('state.personnelTransfers[state.personnelTransfers.length-1]');
    assert(positionTransfer?.from==='LHR'&&positionTransfer.to==='FRA','manual crew-positioning transfer was not booked');
    assert(positionProblem.status==='open','crew-positioning problem resolved before the transfer completed');
    w.processPersonnelTransfers(positionTransfer.arrival+60_000);
    assert(positionProblem.status==='resolved','manual crew-positioning problem did not resolve when moved crew arrived');
    assert(positionProblem.recoveredByResourceUpdate,'manual crew-positioning problem did not record resource-update recovery');
    result.textContent='PASS personnel transfer lifecycle validated';
  }catch(error){
    result.textContent='FAIL '+(error.stack||error);
  }
})();
</script>
