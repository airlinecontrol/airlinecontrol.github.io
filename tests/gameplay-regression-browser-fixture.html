<!doctype html>
<meta charset="utf-8">
<title>Airline OCC gameplay regression fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{ if(!condition) throw new Error(message); };
  const loadApp=async()=>{
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=gameplay-regression&cache='+Date.now();
    await loaded;
  };
  const text=node=>node?.textContent?.replace(/\s+/g,' ').trim()||'';
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    await loadApp();
    const w=frame.contentWindow,d=frame.contentDocument;
    w.resetLocalSave?.();
    await wait(150);
    for(let i=0;i<100&&!w.__aeroMapReady;i++) await wait(100);
    assert(w.__aeroMapReady,'map did not finish initializing before the gameplay UI fixture ran');
    w.eval(`
      state.ops.automaticDisruptions=false;
      state.aircraft=[];
      state.flights=[];
      state.incidents=[];
      state.coordinationTasks=[];
      state.resourceRequests=[];
      state.personnelTransfers=[];
      state.services=[];
      state.passengerConnections=[];
      state.passengerRecoveries=[];
      selectedFlightId=null;
      selectedAircraftId=null;
      workspaceUi.operationFilter={airports:[],activeIncidents:false,delayed:false,weatherCell:null};
    `);

    for(const airport of ['FRA','LHR','CDG','AMS']){
      w.changeStaff(airport,'captains',12);
      w.changeStaff(airport,'firstOfficers',12);
      w.changeStaff(airport,'cabinCrew',30);
      w.changeStaff(airport,'groundHandling',30);
      w.changeStaff(airport,'operations',12);
      w.changeStaff(airport,'customerService',12);
      w.changeQualification(airport,'captains','Airbus A320 family',12);
      w.changeQualification(airport,'firstOfficers','Airbus A320 family',12);
    }

    const now=w.simNow();
    const singleAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const singleOut=w.createFlightRecord({
      aircraftId:singleAc.id,
      from:'FRA',
      to:'LHR',
      departure:now+2*60*60_000,
      fare:{economy:140,business:360,first:700},
      serviceId:'TST-SINGLE',
      serviceLeg:'outbound'
    });
    const singleReturn=w.createFlightRecord({
      aircraftId:singleAc.id,
      from:'LHR',
      to:'FRA',
      departure:w.flightActualArrival(singleOut)+75*60_000,
      fare:{economy:140,business:360,first:700},
      serviceId:'TST-SINGLE',
      serviceLeg:'return'
    });

    w.recalculateOperations();
    w.alignScheduleWindowToFlight(singleOut);
    w.settleSelectedFlight(singleOut.id);
    w.refreshAll();
    await wait(150);
    assert(d.querySelector(`#schedule-board .flight-block[data-flight-id="${singleOut.id}"]`),'single outbound flight was not visible before cancellation');
    assert(d.querySelector(`#schedule-board .flight-block[data-flight-id="${singleReturn.id}"]`),'paired return flight was not visible before cancellation');
    assert(d.querySelector(`[data-dispatch-occ-flight="${singleOut.id}"] [data-occ-cancel-single-flight="${singleOut.id}"]`),'single-flight cancel action is missing from Dispatch OCC actions');
    w.confirm=()=>true;
    d.querySelector(`[data-occ-cancel-single-flight="${singleOut.id}"]`).click();
    await wait(180);
    assert(singleOut.cancelled,'single-flight cancellation did not mark the selected leg cancelled');
    assert(!singleReturn.cancelled,'single-flight cancellation incorrectly cancelled the paired return leg');
    assert(d.querySelector(`#schedule-board .flight-block.cancelled[data-flight-id="${singleOut.id}"]`),'cancelled single flight is not retained as a red schedule block');
    assert(d.querySelector(`#schedule-board .flight-block:not(.cancelled)[data-flight-id="${singleReturn.id}"]`),'paired return flight is not retained as an active schedule block');
    assert(!d.querySelector(`#schedule-board [data-slot-flight="${singleOut.id}"]`),'cancelled single flight left a slot/planned marker behind');
    assert(!d.querySelector(`#schedule-board .planned-flight-block[data-flight-id="${singleOut.id}"]`),'cancelled unselected flight should not render a selected-flight ghost box');
    assert(![...d.querySelectorAll('#schedule-board .crew-duty-bar')].some(node=>(node.getAttribute('title')||'').includes(singleOut.id)),'cancelled single flight stayed in a crew-duty bar');
    assert(!d.querySelector(`#schedule-board .night-closure-bar[data-night-flight="${singleOut.id}"]`),'cancelled single flight left a night-closure bar behind');

    const taxiCancelAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const taxiCancel=w.createFlightRecord({
      aircraftId:taxiCancelAc.id,
      from:'FRA',
      to:'AMS',
      departure:now-5*60_000,
      fare:{economy:120,business:300,first:600}
    });
    taxiCancel.departureLogged=true;
    taxiCancel.actualDeparture=taxiCancel.departure;
    taxiCancel.actualArrival=now+90*60_000;
    taxiCancel.fueled=true;
    w.recalculateOperations();
    assert(w.statusOfFlight(taxiCancel,now)==='taxi_out','taxi cancellation fixture did not create a taxi-out flight');
    w.settleSelectedFlight(taxiCancel.id);
    w.refreshAll();
    await wait(120);
    const taxiCancelButton=d.querySelector(`[data-dispatch-occ-flight="${taxiCancel.id}"] [data-occ-cancel-single-flight="${taxiCancel.id}"]`);
    assert(taxiCancelButton&&!taxiCancelButton.disabled,'taxi-out flight should still be cancellable before becoming airborne');
    taxiCancelButton.click();
    await wait(160);
    assert(taxiCancel.cancelled,'taxi-out flight cancellation did not mark the flight cancelled');

    const staleAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const staleFuture=w.createFlightRecord({
      aircraftId:staleAc.id,
      from:'FRA',
      to:'AMS',
      departure:now+7*60*60_000,
      fare:{economy:120,business:300,first:600}
    });
    w.recalculateOperations();
    staleFuture.actualDeparture=now-4*60*60_000;
    staleFuture.actualArrival=now-2*60*60_000;
    staleFuture.departureLogged=true;
    staleFuture.settled=true;
    assert(w.statusOfFlight(staleFuture,now)==='scheduled','future flight with stale lifecycle flags should still read as scheduled');
    assert(w.flightCanBeCancelled(staleFuture,now),'future flight with stale lifecycle flags should still be cancellable');
    assert(!w.flightCancellationUnavailableReason(staleFuture,now),'future flight with stale lifecycle flags should not report a cancellation blocker');
    w.processEvents();
    assert(!staleFuture.departureLogged&&!staleFuture.settled,'event loop did not repair impossible future lifecycle flags');
    w.settleSelectedFlight(staleFuture.id);
    w.refreshAll();
    await wait(120);
    const staleCancelButton=d.querySelector(`[data-dispatch-occ-flight="${staleFuture.id}"] [data-occ-cancel-single-flight="${staleFuture.id}"]`);
    assert(staleCancelButton&&!staleCancelButton.disabled,`future flight with stale lifecycle flags showed a disabled cancel action: ${staleCancelButton?.outerHTML||'missing'}; can=${w.flightCanBeCancelled(staleFuture)}; blocker=${w.flightCancellationUnavailableReason(staleFuture)||'none'}; status=${w.statusOfFlight(staleFuture)}`);
    staleCancelButton.click();
    await wait(160);
    assert(staleFuture.cancelled,'future flight with stale actual timing was not cancelled');

    const turnAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const turnOut=w.createFlightRecord({
      aircraftId:turnAc.id,
      from:'FRA',
      to:'CDG',
      departure:now+6*60*60_000,
      fare:{economy:130,business:340,first:680},
      serviceId:'TST-TURN',
      serviceLeg:'outbound'
    });
    const turnReturn=w.createFlightRecord({
      aircraftId:turnAc.id,
      from:'CDG',
      to:'FRA',
      departure:w.flightActualArrival(turnOut)+80*60_000,
      fare:{economy:130,business:340,first:680},
      serviceId:'TST-TURN',
      serviceLeg:'return'
    });
    const laterOut=w.createFlightRecord({
      aircraftId:turnAc.id,
      from:'FRA',
      to:'CDG',
      departure:w.flightActualArrival(turnReturn)+12*60*60_000,
      fare:{economy:130,business:340,first:680},
      serviceId:'TST-TURN',
      serviceLeg:'outbound'
    });
    w.recalculateOperations();
    w.alignScheduleWindowToFlight(turnOut);
    w.settleSelectedFlight(turnReturn.id);
    w.refreshAll();
    await wait(150);
    assert(d.querySelector(`[data-dispatch-occ-flight="${turnReturn.id}"] [data-occ-cancel-turnaround="${turnReturn.id}"]`),'turnaround cancel action is missing from Dispatch OCC actions');
    d.querySelector(`[data-occ-cancel-turnaround="${turnReturn.id}"]`).click();
    await wait(180);
    assert(turnOut.cancelled&&turnReturn.cancelled,'turnaround cancellation did not cancel both legs in the selected pair');
    assert(!laterOut.cancelled,'turnaround cancellation incorrectly cancelled a later recurring leg');
    assert(d.querySelector(`#schedule-board .flight-block.cancelled[data-flight-id="${turnOut.id}"]`),'cancelled turnaround outbound leg is not retained as a red schedule block');
    assert(d.querySelector(`#schedule-board .flight-block.cancelled[data-flight-id="${turnReturn.id}"]`),'cancelled turnaround return leg is not retained as a red schedule block');
    assert(!d.querySelector(`#schedule-board [data-slot-flight="${turnOut.id}"], #schedule-board [data-slot-flight="${turnReturn.id}"]`),'cancelled turnaround left slot/planned markers behind');
    assert(![...d.querySelectorAll('#schedule-board .crew-duty-bar')].some(node=>{
      const title=node.getAttribute('title')||'';
      return title.includes(turnOut.id)||title.includes(turnReturn.id);
    }),'cancelled turnaround stayed in a crew-duty bar');
    assert(!d.querySelector(`#schedule-board .night-closure-bar[data-night-flight="${turnOut.id}"], #schedule-board .night-closure-bar[data-night-flight="${turnReturn.id}"]`),'cancelled turnaround left night-closure bars behind');

    w.settleSelectedFlight(laterOut.id);
    w.alignScheduleWindowToFlight(laterOut);
    w.refreshAll();
    await wait(120);
    assert(d.querySelector(`[data-dispatch-occ-flight="${laterOut.id}"]`),'later recurring leg cannot be selected after cancelling one turnaround');
    assert(d.querySelector(`#schedule-board .flight-block.selected[data-flight-id="${laterOut.id}"]`),'schedule did not focus the later recurring leg after cancellation');

    d.querySelector(`[data-occ-delay-flight="${laterOut.id}"][data-delay-min="15"]`).click();
    await wait(150);
    assert(laterOut.manualDelayMin>=15,'manual delay from Dispatch did not update flight state');
    w.alignScheduleWindowToFlight(laterOut);
    w.refreshScheduleTimeline(true);
    await wait(80);
    const delayedBlock=d.querySelector(`#schedule-board .flight-block.delayed.shifted[data-flight-id="${laterOut.id}"]`);
    assert(delayedBlock,'manually delayed flight did not repaint as a yellow shifted schedule block');
    assert(text(delayedBlock).includes('S ')&&text(delayedBlock).includes('A '),'shifted schedule block does not expose planned and actual times');
    assert(d.querySelector(`#schedule-board .planned-flight-block[data-flight-id="${laterOut.id}"]`),'selected delayed flight does not show the planned ghost box');
    d.querySelector('#schedule-board').dispatchEvent(new MouseEvent('click',{bubbles:true}));
    await wait(80);
    assert(!d.querySelector(`#schedule-board .planned-flight-block[data-flight-id="${laterOut.id}"]`),'planned ghost box stayed visible after clearing selection');

    const plannerAc=w.assignRequestedAircraft('A220-100',w.defaultCabin('A220-100'),'ATL');
    const earlyOut=w.createFlightRecord({
      aircraftId:plannerAc.id,
      from:'ATL',
      to:'TPA',
      departure:now+60*60_000,
      fare:{economy:110,business:280,first:560},
      serviceId:'TST-PLANNER',
      serviceLeg:'outbound'
    });
    const earlyReturn=w.createFlightRecord({
      aircraftId:plannerAc.id,
      from:'TPA',
      to:'ATL',
      departure:w.flightActualArrival(earlyOut)+90*60_000,
      fare:{economy:110,business:280,first:560},
      serviceId:'TST-PLANNER',
      serviceLeg:'return'
    });
    const proposedDeparture=w.flightActualArrival(earlyReturn)+2*60*60_000;
    const proposedOut=w.estimateFlight('ATL','TPA',plannerAc,{economy:110,business:280,first:560},{departure:proposedDeparture});
    const proposedReturnDeparture=proposedDeparture+proposedOut.duration+90*60_000;
    const proposedReturn=w.estimateFlight('TPA','ATL',plannerAc,{economy:110,business:280,first:560},{departure:proposedReturnDeparture});
    const laterCommitted=w.createFlightRecord({
      aircraftId:plannerAc.id,
      from:'ATL',
      to:'MCO',
      departure:proposedReturnDeparture-20*60_000,
      fare:{economy:110,business:280,first:560}
    });
    const departureCheck=w.aircraftDepartureAvailability(plannerAc,'ATL',proposedDeparture);
    assert(departureCheck.ok,'planner blocked the requested departure even though the aircraft returns before departure: '+departureCheck.reason);
    const rotationCheck=w.validateAircraftItinerary(plannerAc,[
      {from:'ATL',to:'TPA',departure:proposedDeparture,arrival:proposedDeparture+proposedOut.duration,label:'new outbound'},
      {from:'TPA',to:'ATL',departure:proposedReturnDeparture,arrival:proposedReturnDeparture+proposedReturn.duration,label:'new return'}
    ]);
    assert(!rotationCheck.ok&&rotationCheck.code==='position'&&rotationCheck.legLabel===laterCommitted.id,'planner did not identify the later-leg rotation conflict');
    const rotationMessage=w.aircraftItineraryFailureMessage(plannerAc,rotationCheck,'round trip');
    assert(rotationMessage.includes('can make the requested departure'),'rotation conflict message does not distinguish departure availability from downstream conflict');
    assert(rotationMessage.includes(`before ${laterCommitted.id}`),'rotation conflict message does not name the downstream flight');

    const groundFlight=w.createFlightRecord({
      aircraftId:w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA').id,
      from:'FRA',
      to:'AMS',
      departure:now+4*60*60_000,
      fare:{economy:120,business:300,first:600}
    });
    const airborneFlight=w.createFlightRecord({
      aircraftId:w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA').id,
      from:'FRA',
      to:'LHR',
      departure:now-30*60_000,
      fare:{economy:120,business:300,first:600}
    });
    airborneFlight.departureLogged=true;
    airborneFlight.actualDeparture=now-30*60_000;
    airborneFlight.actualArrival=now+75*60_000;
    airborneFlight.fueled=true;
    w.recalculateOperations();
    const incidentTypes=Object.keys(w.eval('AeroIncidentModel.incidentDefinitions()'));
    const missingWorkflows=incidentTypes
      .filter(type=>!w.eval(`AeroIncidentModel.isRetiredType(${JSON.stringify(type)})`))
      .filter(type=>!w.eval(`Boolean(AeroIncidentModel.workflowDefinitions()[${JSON.stringify(type)}])`));
    assert(!missingWorkflows.length,'incident definitions missing workflows: '+missingWorkflows.join(', '));
    const retiredFailures=['slot_miss_risk','aircraft_late_inbound','alternate_unsuitable']
      .filter(type=>w.createIncident(type,groundFlight,{training:true,detectedAt:now}));
    assert(!retiredFailures.length,'retired incident types are still creatable: '+retiredFailures.join(', '));
    const airborneOnlyFailures=incidentTypes.filter(type=>{
      if(w.eval(`AeroIncidentModel.phaseForType(${JSON.stringify(type)})`)!=='airborne') return false;
      if(type==='destination_closure') return false;
      return Boolean(w.createIncident(type,groundFlight,{training:true,detectedAt:now}));
    });
    assert(!airborneOnlyFailures.length,'airborne-only incidents are creatable on a ground flight: '+airborneOnlyFailures.join(', '));
    const groundOnlyFailures=incidentTypes.filter(type=>{
      if(w.eval(`AeroIncidentModel.phaseForType(${JSON.stringify(type)})`)!=='ground'||w.eval(`AeroIncidentModel.isRetiredType(${JSON.stringify(type)})`)) return false;
      return Boolean(w.createIncident(type,airborneFlight,{training:true,detectedAt:now}));
    });
    assert(!groundOnlyFailures.length,'ground-only incidents are creatable on an airborne flight: '+groundOnlyFailures.join(', '));
    const destinationGround=w.createIncident('destination_closure',groundFlight,{training:true,detectedAt:now});
    assert(destinationGround?.type==='destination_closure_ground','destination closure on a ground flight did not route to the ground OCC workflow');
    const destinationAir=w.createIncident('destination_closure',airborneFlight,{training:true,detectedAt:now});
    assert(destinationAir?.type==='destination_closure','destination closure on an airborne flight did not stay in the flight-watch workflow');
    assert(w.incidentTasks(destinationAir.id).some(task=>task.kind==='authority_decision'),'airborne destination closure should wait for the flight-deck decision before OCC support actions');
    assert(w.incidentTasks(destinationGround.id).some(task=>task.kind==='recovery_strategy'),'ground destination closure should present an OCC recovery strategy');

    result.textContent='PASS gameplay regression validated';
  }catch(error){
    console.error(error);
    result.textContent='FAIL\n'+(error?.stack||error);
  }
})();
</script>
