<!doctype html>
<meta charset="utf-8">
<title>AeroSim incident option fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  const loadApp=async()=>{
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=incident-options&cache='+Date.now();
    await loaded;
  };
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    await loadApp();
    frame.contentWindow.resetLocalSave();
    await loadApp();
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    const now=w.simNow();
    w.changeStaff('FRA','captains',30);
    w.changeStaff('FRA','firstOfficers',30);
    w.changeStaff('FRA','cabinCrew',60);
    w.changeStaff('FRA','groundHandling',60);
    w.changeStaff('FRA','operations',20);
    w.changeStaff('FRA','customerService',20);
    w.changeStaff('LGW','groundHandling',12);
    w.changeStaff('LHR','groundHandling',12);
    w.changeStaff('AMS','groundHandling',12);
    w.changeStaff('CDG','groundHandling',12);
    w.changeStaff('MUC','groundHandling',12);
    w.changeStaff('ATL','operations',12);
    w.changeQualification('FRA','captains','Airbus A320 family',30);
    w.changeQualification('FRA','firstOfficers','Airbus A320 family',30);

    let leg=0;
    const makeCase=(type,to='LHR',context=null)=>{
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const departure=now+(4*60+leg*12)*60_000;
      leg++;
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to,departure,fare:{economy:150,business:390,first:750}});
      const incident=w.createIncident(type,flight,{training:true,detectedAt:now,context});
      assert(incident,`${type} incident was not created`);
      return {aircraft,flight,incident};
    };
    const makeAirborneCase=(type,to='LHR',context=null)=>{
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const departure=now-(45+leg)*60_000;
      leg++;
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to,departure,fare:{economy:150,business:390,first:750}});
      flight.departureLogged=true;
      flight.actualDeparture=departure;
      flight.actualArrival=now+90*60_000;
      flight.fueled=true;
      flight.fuelOnboardAtDeparture=Math.max(w.flightFuelPlan('FRA',to,aircraft).requiredGal*1.8,aircraft.fuelGallons||0);
      aircraft.fuelGallons=flight.fuelOnboardAtDeparture;
      const incident=w.createIncident(type,flight,{training:true,detectedAt:now,context});
      assert(incident,`${type} airborne incident was not created`);
      return {aircraft,flight,incident};
    };
    const completeWaits=()=>w.processOperationalWorkflows(Number.MAX_SAFE_INTEGER);
    const resolveCrew=(role)=>{
      const {flight,incident}=makeCase('crew_sick');
      incident.affectedRole=role;
      const strategy=w.incidentTasks(incident.id).find(task=>task.key==='crew-strategy');
      assert(w.operationalOptionConsequence(strategy,incident,'replace').includes('reserve response'),'crew strategy consequence is missing reserve reporting impact');
      assert(w.performOperationalTask(`${incident.id}:crew-strategy`,'replace'),`${role} crew strategy was rejected`);
      assert(w.performOperationalTask(`${incident.id}:crew-allocate`,'',{optionId:`FRA:${role}`}),`${role} crew allocation was rejected`);
      completeWaits();
      assert(incident.status==='resolved',`${role} sick-call incident did not resolve`);
      assert(flight.incidentDelayMin>=20,`${role} sick-call did not apply reporting delay`);
    };
    ['captains','firstOfficers','cabinCrew'].forEach(resolveCrew);

    {
      const fraCaptains=w.staffAt('FRA','captains');
      const fraCaptainRatings=w.qualifiedStaffAt('FRA','captains','Airbus A320 family');
      w.changeStaff('FRA','captains',-fraCaptains);
      w.changeQualification('FRA','captains','Airbus A320 family',-fraCaptainRatings);
      w.changeStaff('AMS','captains',2);
      w.changeQualification('AMS','captains','Airbus A320 family',2);
      const {incident}=makeCase('crew_sick');
      incident.affectedRole='captains';
      assert(w.performOperationalTask(`${incident.id}:crew-strategy`,'replace'),'remote sick-call crew strategy was rejected');
      assert(!w.crewPoolOptions(incident).length,'remote sick-call crew was incorrectly allocatable without moving personnel');
      assert(w.remoteCrewPoolOptions(incident).some(option=>option.airport==='AMS'),'remote sick-call crew pool was not visible for relocation planning');
      assert(!w.performOperationalTask(`${incident.id}:crew-allocate`,'',{optionId:'AMS:captains'}),'remote sick-call crew allocation should require manual relocation first');
      w.changeStaff('AMS','captains',-2);
      w.changeQualification('AMS','captains','Airbus A320 family',-2);
      w.changeStaff('FRA','captains',6);
      w.changeQualification('FRA','captains','Airbus A320 family',6);
      assert(w.performOperationalTask(`${incident.id}:crew-allocate`,'',{optionId:'FRA:captains'}),'moved sick-call crew could not be allocated locally');
      completeWaits();
      assert(incident.status==='resolved','moved sick-call crew incident did not resolve');
      w.changeStaff('FRA','captains',fraCaptains-6);
      w.changeQualification('FRA','captains','Airbus A320 family',fraCaptainRatings-6);
    }

    {
      const {incident}=makeCase('crew_duty_risk');
      const strategy=w.incidentTasks(incident.id).find(task=>task.key==='crew-duty-strategy');
      assert(w.operationalOptionConsequence(strategy,incident,'replace').includes('reserve response'),'crew duty replacement consequence is missing reserve reporting impact');
      assert(strategy.strategyOptions.some(option=>option.id==='cancel'),'pre-departure cancellation should be available as an incident strategy option');
      assert(w.branchStrategyOptionBlocker(strategy,incident,'cancel')==='','pre-departure cancellation should be eligible through strategy metadata');
    }

    for(const action of ['defer','schedule_check']){
      const {aircraft,flight,incident}=makeCase('mel_defect','LHR',{technicalDisposition:action==='defer'?'mel_allowed':'maintenance_required'});
      assert(w.performOperationalTask(`${incident.id}:mx-inspect`),`MEL inspection did not start for ${action}`);
      completeWaits();
      const strategy=w.incidentTasks(incident.id).find(task=>task.key==='mx-strategy');
      assert(w.operationalOptionConsequence(strategy,incident,'schedule_check').includes('repair downtime'),'MEL technical-repair consequence is missing downtime impact');
      if(action==='schedule_check') assert(w.branchStrategyOptionBlocker(strategy,incident,'defer').includes('not deferrable'),'non-MEL finding did not block MEL deferral');
      assert(w.performOperationalTask(`${incident.id}:mx-strategy`,action),`MEL ${action} strategy was rejected`);
      const taskKey=action==='schedule_check'?'mx-schedule-check':`mx-${action}`;
      assert(w.performOperationalTask(`${incident.id}:${taskKey}`,action),`MEL ${action} was rejected`);
      assert(incident.status==='resolved',`MEL ${action} incident did not resolve`);
      if(action==='defer'){
        assert(aircraft.melItems.some(item=>item.status==='open'),'MEL defer did not create an open MEL item');
        w.eval(`{
          const ac=state.aircraft.find(item=>item.id==='${aircraft.id}');
          ac.maintenance={...(ac.maintenance||{}),scheduled:{start:${now+60*60_000},end:${now+2*60*60_000},airport:'FRA',durationHours:1,cost:1000,status:'scheduled',workType:'mel_rectification',label:'MEL rectification',resetsCheck:false}};
          Management.processMaintenance(state,${now+3*60*60_000},()=>{});
          processMelConstraints(${now+3*60*60_000});
        }`);
        assert(aircraft.melItems.every(item=>item.status==='cleared'),'completed maintenance check did not clear deferred MEL items');
      }
      if(action==='schedule_check'){
        assert(aircraft.maintenance.scheduled,'MEL maintenance branch did not create a scheduled check');
        assert(aircraft.maintenance.scheduled.workType==='urgent_repair','technical incident maintenance branch should schedule a repair, not a full check');
        assert(aircraft.defectUntil>=aircraft.maintenance.scheduled.end,'MEL maintenance branch did not hold aircraft until check completion');
        assert(flight.cancelled,'MEL maintenance branch did not cancel the flight affected by the scheduled check');
        assert(flight.cancellationReason.includes('Ground technical defect'),'MEL maintenance cancellation did not keep the technical reason');
        assert(flight.maintenanceDelayMin===0,'MEL maintenance branch should not leave a maintenance delay on a cancelled flight');
        w.alignScheduleWindowToFlight(flight);
        w.refreshScheduleTimeline(true);
        await wait(80);
        assert(d.querySelector(`#schedule-board .maintenance-schedule-block[data-maintenance-job="${aircraft.id}"]`),'technical-incident maintenance check is not visible in the schedule view');
      }
    }

    {
      const spare=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const {flight,incident}=makeCase('mel_defect');
      assert(w.performOperationalTask(`${incident.id}:mx-inspect`),'MEL inspection did not start for local substitute');
      completeWaits();
      assert(w.performOperationalTask(`${incident.id}:mx-strategy`,'substitute'),'MEL substitute strategy was rejected');
      assert(w.performOperationalTask(`${incident.id}:dispatch-substitute`,'',{optionId:`local:${spare.id}`}),`local substitute ${spare.id} was rejected`);
      assert(incident.status==='resolved','MEL local substitute incident did not resolve');
      assert(flight.aircraftId===spare.id,'MEL local substitute did not assign the replacement aircraft');
    }

    {
      const spare=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'MUC');
      const {flight,incident}=makeCase('mel_defect');
      assert(w.performOperationalTask(`${incident.id}:mx-inspect`),'MEL inspection did not start for positioned substitute');
      completeWaits();
      assert(w.performOperationalTask(`${incident.id}:mx-strategy`,'substitute'),'MEL positioned substitute strategy was rejected');
      assert(w.performOperationalTask(`${incident.id}:dispatch-substitute`,'',{optionId:`position:${spare.id}`}),`positioned substitute ${spare.id} was rejected`);
      assert(incident.status==='resolved','MEL positioned substitute incident did not resolve');
      assert(flight.aircraftId===spare.id,'MEL positioned substitute did not assign the replacement aircraft');
      assert(flight.positioningDelayMin>=0,'MEL positioned substitute did not record positioning timing');
      assert(JSON.parse(w.localStorage.getItem('aerosim_mvp_v6')).flights.some(item=>item.aircraftId===spare.id&&item.flightType==='ferry'&&item.to==='FRA'),'MEL positioned substitute did not create a ferry positioning flight');
    }

    {
      const spare=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'MUC');
      const {flight,incident}=makeCase('mel_defect');
      const beforeFerryCount=w.eval(`state.flights.filter(item=>item.aircraftId==='${spare.id}'&&item.flightType==='ferry').length`);
      const ferry=w.createFlightRecord({aircraftId:spare.id,from:'MUC',to:'FRA',departure:now+25*60_000,fare:0,flightType:'ferry'});
      ferry.weatherChecked=true; ferry.constraintChecked=true; ferry.opsChecked=true; ferry.enrouteChecked=true;
      w.recalculateOperations();
      const plannedOption=w.incidentAircraftReplacementOptions(incident).find(option=>option.mode==='planned'&&option.aircraftId===spare.id&&option.ferryId===ferry.id);
      assert(plannedOption,`planned ferry replacement option was not offered: ${JSON.stringify(w.incidentAircraftReplacementOptions(incident))}`);
      assert(/via/.test(plannedOption.label)&&plannedOption.detail.includes(ferry.id),'planned ferry option did not identify the ferry leg');
      assert(w.performOperationalTask(`${incident.id}:mx-inspect`),'MEL inspection did not start for planned-ferry substitute');
      completeWaits();
      assert(w.performOperationalTask(`${incident.id}:mx-strategy`,'substitute'),'MEL planned-ferry substitute strategy was rejected');
      assert(w.performOperationalTask(`${incident.id}:dispatch-substitute`,'',{optionId:plannedOption.id}),`planned ferry substitute ${spare.id} was rejected`);
      assert(incident.status==='resolved','MEL planned-ferry substitute incident did not resolve');
      assert(flight.aircraftId===spare.id,'planned-ferry substitute did not assign the replacement aircraft');
      assert(incident.replacementFerryId===ferry.id,'incident did not record the reused planned ferry');
      assert(w.eval(`state.flights.filter(item=>item.aircraftId==='${spare.id}'&&item.flightType==='ferry').length`)===beforeFerryCount+1,'planned-ferry substitute created a duplicate ferry');
    }

    {
      const borrowed=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const {flight,incident}=makeCase('mel_defect','LHR');
      const later=w.createFlightRecord({aircraftId:borrowed.id,from:'LHR',to:'AMS',departure:flight.arrival+3*60*60_000,fare:{economy:150,business:390,first:750}});
      assert(w.performOperationalTask(`${incident.id}:mx-inspect`),'MEL inspection did not start for borrowed substitute');
      completeWaits();
      const borrowedOption=w.incidentAircraftReplacementOptions(incident).find(option=>option.aircraftId===borrowed.id);
      assert(borrowedOption?.kind==='borrow','scheduled aircraft was not offered as a borrowable replacement');
      assert(/Borrow/.test(borrowedOption.detail),'borrowed replacement option is not labelled as a borrowed aircraft');
      assert(w.performOperationalTask(`${incident.id}:mx-strategy`,'substitute'),'MEL borrowed substitute strategy was rejected');
      assert(w.performOperationalTask(`${incident.id}:dispatch-substitute`,'',{optionId:borrowedOption.id}),'MEL borrowed substitute was rejected');
      assert(incident.status==='resolved','MEL borrowed substitute incident did not resolve');
      assert(flight.aircraftId===borrowed.id,'borrowed substitute did not cover the disrupted flight');
      assert(later.aircraftId===borrowed.id&&!later.cancelled,'borrowed substitute broke the aircraft later schedule');
    }

    {
      const {flight,incident}=makeCase('mel_defect');
      assert(w.performOperationalTask(`${incident.id}:mx-inspect`),'MEL inspection did not start before cancellation');
      completeWaits();
      assert(w.performOperationalTask(`${incident.id}:mx-strategy`,'cancel'),'MEL cancel option was rejected');
      assert(incident.status==='resolved','MEL cancel incident did not resolve');
      assert(flight.cancelled,'MEL cancel branch did not cancel the flight');
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'LHR',departure:now+9*60*60_000,fare:{economy:150,business:390,first:750}});
      for(const retiredType of ['airport_capacity_reduction','gate_conflict','fueling_issue','baggage_loading_issue']){
        assert(!w.createIncident(retiredType,flight,{training:true,detectedAt:now,source:'fixture'}),`${retiredType} should be retired from active incident creation`);
      }
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'MUC');
      const inbound=w.createFlightRecord({aircraftId:aircraft.id,from:'MUC',to:'FRA',departure:now+75*60_000,fare:0,flightType:'ferry'});
      inbound.weatherChecked=true; inbound.constraintChecked=true; inbound.opsChecked=true; inbound.enrouteChecked=true;
      const target=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'LHR',departure:w.flightActualArrival(inbound)+90*60_000,fare:{economy:150,business:390,first:750}});
      const incident=w.createIncident('fuel_supplier_outage',target,{training:true,detectedAt:now,context:{airport:'FRA',reason:'Fuel farm delivery interruption',delayMin:95,active:true}});
      const strategy=w.incidentTasks(incident.id).find(task=>task.key==='station-fuel-outage-strategy');
      assert(w.fuelOutageTankerPlan(incident).available,'tanker fuel should be feasible from the inbound station');
      assert(w.branchStrategyOptionBlocker(strategy,incident,'tanker_inbound')==='','tanker fuel strategy was incorrectly blocked');
      assert(w.operationalOptionConsequence(strategy,incident,'tanker_inbound').includes('avoids disrupted station uplift'),'tanker fuel consequence should explain the avoided station uplift');
      assert(w.performOperationalTask(`${incident.id}:station-fuel-outage-strategy`,'tanker_inbound'),'fuel outage tanker strategy was rejected');
      assert(w.performOperationalTask(`${incident.id}:station-fuel-tanker`),'fuel outage tanker task was rejected');
      completeWaits();
      assert(incident.status==='resolved','fuel outage tanker incident did not resolve');
      assert(target.tankerFuelPlanned&&target.fueled,'target flight was not protected by tanker fuel');
      assert(inbound.tankerFuelForFlightId===target.id,'inbound sector did not record the tanker-fuel link');
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const target=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'LHR',departure:now+8*60*60_000,fare:{economy:150,business:390,first:750}});
      const incident=w.createIncident('fuel_supplier_outage',target,{training:true,detectedAt:now,context:{airport:'FRA',reason:'Fuel truck fleet shortage',delayMin:75,active:true}});
      const unfueledSpare=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      unfueledSpare.fuelGallons=0;
      assert(w.incidentAircraftReplacementOptions(incident).some(option=>option.aircraftId===unfueledSpare.id),'generic replacement options should see the local spare');
      assert(!w.fuelSupplierReplacementOptions(incident).some(option=>option.aircraftId===unfueledSpare.id),'fuel outage replacement should reject unfueled spares');
      const fueledSpare=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      fueledSpare.fuelGallons=w.flightFuelPlan('FRA','LHR',fueledSpare).requiredGal;
      assert(w.fuelSupplierReplacementOptions(incident).some(option=>option.aircraftId===fueledSpare.id),'fuel outage replacement should allow an already fueled spare');
    }

    const {flight:groundClosureFlight,incident:groundClosure}=makeCase('destination_closure','LHR');
    assert(groundClosure.type==='destination_closure_ground','Ground destination closure did not use the OCC ground workflow');
    assert(w.performOperationalTask(`${groundClosure.id}:dispatch-ground-destination-strategy`,'delay_reopen'),'Ground destination closure delay strategy was rejected');
    assert(w.performOperationalTask(`${groundClosure.id}:dispatch-destination-hold`),'Ground destination closure hold task was rejected');
    assert(groundClosure.status==='resolved','Ground destination closure did not resolve after hold');
    assert(groundClosureFlight.incidentDelayMin>=60,'Ground destination closure did not apply a departure delay');

    const {flight:closureFlight,incident:closure}=makeAirborneCase('destination_closure','LHR',{authorityDecision:'alternate'});
    assert(w.performOperationalTask(`${closure.id}:dispatch-diversion-assess`),'Destination closure assessment was rejected');
    completeWaits();
    const closureDecision=w.incidentTasks(closure.id).find(task=>task.key==='dispatch-flightdeck-decision');
    assert(closureDecision.strategyOptions.find(option=>option.id==='alternate')?.label.startsWith('Record '),'Destination closure decision option is not framed as a recorded flight-deck plan');
    assert(!closureDecision.strategyOptions.some(option=>option.id==='cancel'),'Airborne destination closure should not offer cancellation');
    assert(w.operationalOptionConsequence(closureDecision,closure,'alternate').includes('flight deck requested'),'Destination closure consequence is not framed as a flight-deck request');
    assert(w.performOperationalTask(`${closure.id}:dispatch-flightdeck-decision`),'Destination closure flight-deck response was rejected');
    completeWaits();
    const alternate=w.diversionOptionsForIncident(closure,{includeReturnOrigin:false})[0]?.code;
    assert(alternate,'Destination closure offered no suitable alternate');
    assert(w.performOperationalTask(`${closure.id}:dispatch-alternate`,'',{airport:alternate}),'Destination closure alternate selection was rejected');
    assert(closure.status==='resolved','Destination closure incident did not resolve');
    assert(closureFlight.diversionAirport===alternate,'Destination closure did not apply the selected diversion');

    const originalWeatherAt=w.AeroManagement.weatherAt;
    w.AeroManagement.weatherAt=(code,t)=>code==='FRA'
      ? {...originalWeatherAt(code,t),type:'clear',conditions:'Normal operations',level:'normal',capacityFactor:1,delayMin:0}
      : originalWeatherAt(code,t);
    const {flight:returnFlight,incident:returnClosure}=makeAirborneCase('destination_closure','LHR',{authorityDecision:'return_origin'});
    assert(w.performOperationalTask(`${returnClosure.id}:dispatch-diversion-assess`),'Destination closure return-to-origin assessment was rejected');
    completeWaits();
    assert(w.performOperationalTask(`${returnClosure.id}:dispatch-flightdeck-decision`),'Destination closure return-to-origin flight-deck response was rejected');
    completeWaits();
    const returnOption=w.diversionOptionsForIncident(returnClosure,{onlyReturnOrigin:true})[0];
    assert(returnOption,`Destination closure did not offer return to origin: ${w.diversionRejectionSummaryForIncident(returnClosure,{onlyReturnOrigin:true})}`);
    assert(returnOption.fuel&&returnOption.fuel.ok,'Destination closure return-to-origin did not include a valid fuel check');
    assert(w.performOperationalTask(`${returnClosure.id}:dispatch-return-origin`),'Destination closure return-to-origin selection was rejected');
    assert(returnClosure.diversionReturnOrigin,'Destination closure return-to-origin selection was not recorded');
    assert(returnClosure.status==='resolved','Destination closure return-to-origin incident did not resolve');
    assert(returnFlight.diversionAirport===returnFlight.from,'Destination closure did not apply return to origin');

    {
      const aircraft=w.assignRequestedAircraft('A330-900',w.defaultCabin('A330-900'),'ATL');
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'ATL',to:'FRA',departure:now-7*60*60_000,fare:{economy:260,business:900,first:1800}});
      flight.departureLogged=true;
      flight.actualDeparture=now-7*60*60_000;
      flight.actualArrival=now+90*60_000;
      flight.operationalDurationMs=flight.actualArrival-flight.actualDeparture;
      flight.fueled=true;
      const fuel=w.flightFuelPlan('ATL','FRA',aircraft);
      flight.tripFuelGallons=fuel.tripBurnGal;
      flight.fuelReserveGallons=fuel.reserveGal;
      flight.fuelOnboardAtDeparture=Math.ceil(fuel.requiredGal*1.55);
      aircraft.fuelGallons=flight.fuelOnboardAtDeparture;
      const incident=w.createIncident('destination_closure',flight,{training:true,detectedAt:now,context:{authorityDecision:'alternate',airport:'FRA'}});
      assert(incident,'transatlantic destination closure was not created');
      const anchor=w.diversionAnchorForIncident(incident,flight,aircraft);
      assert(anchor.type==='aircraft','airborne diversion options are not anchored to the aircraft position');
      const options=w.diversionOptionsForIncident(incident,{includeReturnOrigin:false});
      assert(options.length,'transatlantic closure offered no airborne alternates');
      assert(options.every(option=>option.anchor?.type==='aircraft'),'airborne alternates did not retain aircraft anchor metadata');
      assert(options.some(option=>['LHR','LGW','AMS','CDG','MUC'].includes(option.code)),`airborne alternates did not include European nearby airports: ${options.map(option=>option.code).join(', ')}`);
      const originArea=new Set(['ATL','MCO','TPA','FLL','MIA','CLT','RDU','BNA','MSY','IAD','DCA','BWI','PHL','JFK','BOS','ORD','DTW','DFW','IAH','AUS']);
      assert(!options.some(option=>originArea.has(option.code)),`airborne alternates still appear origin-centered: ${options.map(option=>option.code).join(', ')}`);
      const option=options[0];
      assert(w.performOperationalTask(`${incident.id}:dispatch-diversion-assess`),'Transatlantic closure assessment was rejected');
      completeWaits();
      assert(w.performOperationalTask(`${incident.id}:dispatch-flightdeck-decision`),'Transatlantic closure flight-deck response was rejected');
      completeWaits();
      const selectionOption=w.diversionOptionsForIncident(incident,{includeReturnOrigin:false}).find(item=>item.code===option.code);
      assert(selectionOption,'selected transatlantic alternate disappeared before selection');
      assert(w.performOperationalTask(`${incident.id}:dispatch-alternate`,'',{airport:selectionOption.code}),'Transatlantic airborne alternate selection was rejected');
      assert(Math.abs(incident.diversionRouteKm-selectionOption.km)<5,'selected airborne alternate did not store aircraft-anchored distance');
      assert(incident.diversionDurationMode==='remaining_from_anchor','selected airborne alternate did not mark duration as remaining from aircraft');
      assert(Math.abs(flight.operationalDurationMs-((now-flight.actualDeparture)+selectionOption.duration))<2*60_000,'selected airborne alternate did not apply elapsed plus aircraft-anchored duration');
    }

    {
      ['EWR','PHL','BOS','IAD','BWI','DCA'].forEach(code=>w.changeStaff(code,'groundHandling',-w.staffAt(code,'groundHandling')));
      const aircraft=w.assignRequestedAircraft('A220-300',w.defaultCabin('A220-300'),'ATL');
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'ATL',to:'JFK',departure:now-105*60_000,fare:{economy:190,business:520,first:0}});
      flight.departureLogged=true;
      flight.actualDeparture=now-105*60_000;
      flight.actualArrival=now+25*60_000;
      flight.operationalDurationMs=flight.actualArrival-flight.actualDeparture;
      flight.fueled=true;
      const fuel=w.flightFuelPlan('ATL','JFK',aircraft);
      flight.tripFuelGallons=fuel.tripBurnGal;
      flight.fuelReserveGallons=fuel.reserveGal;
      flight.fuelOnboardAtDeparture=Math.ceil(fuel.requiredGal*1.45);
      aircraft.fuelGallons=flight.fuelOnboardAtDeparture;
      const incident=w.createIncident('onboard_medical',flight,{training:true,detectedAt:now,context:{authorityDecision:'divert'}});
      assert(incident,'JFK medical diversion fixture did not create an incident');
      const options=w.diversionOptionsForIncident(incident,{includeReturnOrigin:false});
      assert(options.length,`JFK-area diversion offered no contract alternates: ${w.diversionRejectionSummaryForIncident(incident,{includeReturnOrigin:false})}`);
      assert(options.some(option=>['EWR','PHL','BOS','IAD','BWI','DCA'].includes(option.code)),`JFK-area diversion did not include nearby alternates: ${options.map(option=>option.code).join(', ')}`);
      assert(options.some(option=>option.handling?.source==='contract'),'JFK-area diversion still requires own station handling instead of modeled contract handling');
      assert(w.performOperationalTask(`${incident.id}:dispatch-medical-assess`),'JFK-area medical assessment was rejected');
      completeWaits();
      assert(w.performOperationalTask(`${incident.id}:dispatch-medical-decision`),'JFK-area medical diversion decision was rejected');
      completeWaits();
      w.eval(`workspaceUi.incidentFilter='all'; setActiveIncidentCase('${incident.id}')`);
      w.refreshAll();
      await wait(120);
      assert(d.querySelector(`[data-incident-case="${incident.id}"] [data-task-alternate]`),'JFK-area incident dialog still renders without an alternate selector');
      const contractOption=options.find(option=>option.handling?.source==='contract')||options[0];
      assert(w.performOperationalTask(`${incident.id}:dispatch-alternate`,'',{airport:contractOption.code}),'JFK-area contract alternate selection was rejected');
      assert(flight.diversionAirport===contractOption.code,'JFK-area contract alternate did not apply to the flight');
      assert(!w.diversionAirportUnavailableContextForFlight(flight,now+60_000),`Selected contract alternate was immediately marked unavailable: ${w.diversionAirportUnavailableContextForFlight(flight,now+60_000)?.reason}`);
      w.processDerivedOperationalIncidents(now+60_000);
      assert(!w.openIncidentsForFlight(flight.id).some(item=>item.type==='diversion_airport_unavailable'),'Selected contract alternate spawned a diversion-airport-unavailable incident immediately after selection');
    }

    const {flight:fuelReturnFlight,incident:fuelReturn}=makeAirborneCase('fuel_margin_low','LHR',{authorityDecision:'return_origin',projectedLandingFuelGal:1200,reserveGal:1800,marginPct:55});
    assert(w.performOperationalTask(`${fuelReturn.id}:dispatch-fuel-assess`),'Fuel-margin assessment was rejected');
    completeWaits();
    const fuelDecision=w.incidentTasks(fuelReturn.id).find(task=>task.key==='dispatch-fuel-decision');
    assert(fuelDecision.strategyOptions.some(option=>option.id==='return_origin'),'Fuel-margin decision does not offer return to origin');
    assert(w.performOperationalTask(`${fuelReturn.id}:dispatch-fuel-decision`),'Fuel-margin return decision was rejected');
    completeWaits();
    assert(w.performOperationalTask(`${fuelReturn.id}:dispatch-return-origin`),`Fuel-margin return-to-origin selection was rejected: ${w.diversionRejectionSummaryForIncident(fuelReturn,{onlyReturnOrigin:true})}`);
    assert(fuelReturn.status==='resolved','Fuel-margin return-to-origin incident did not resolve');
    assert(fuelReturnFlight.diversionAirport===fuelReturnFlight.from,'Fuel-margin return-to-origin did not apply return to origin');
    w.AeroManagement.weatherAt=originalWeatherAt;

    result.textContent='PASS incident options validated';
  }catch(error){
    result.textContent='FAIL '+(error.stack||error);
  }
})();
</script>
