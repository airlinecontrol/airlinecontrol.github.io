<!doctype html>
<meta charset="utf-8">
<title>Station clearance gameplay</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:1000px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result'),frame=document.getElementById('game');
  const assert=(condition,message)=>{if(!condition) throw new Error(message);};
  const MIN=60000,base=Date.UTC(2026,8,15,18);
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=station-clearance';await loaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    const setTime=t=>{w.state.clock={realBase:Date.now(),simBase:t,speed:0,paused:true,previousSpeed:1};};
    const setup=(departure=base+20*MIN)=>{
      w.resetLocalSave();setTime(base);
      const s=w.state;s.ops.automaticDisruptions=false;s.home='MCO';
      s.personnel.assignments={MCO:{captains:10,firstOfficers:10,cabinCrew:40,groundHandling:20,operations:10,customerService:10}};
      s.personnel.qualifications={MCO:{captains:{'Airbus A320 family':10},firstOfficers:{'Airbus A320 family':10}}};
      const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'MCO');
      const flight=w.createFlightRecord({aircraftId:ac.id,from:'MCO',to:'FLL',departure,fare:{economy:140,business:360,first:700}});
      w.recalculateOperations();return flight;
    };
    w.AeroManagement.weatherAt=()=>({conditions:'Normal operations',level:'normal',capacityFactor:1,delayMin:0});
    const create=(flight,context)=>w.createProblem('security_screening',flight,{training:true,detectedAt:base,context});
    const timedContext={activeFrom:base,activeUntil:base+40*MIN,expectedClearAt:base+40*MIN,timeBasis:'modeled_temporary_event'};

    // New and repeated reports share one fixed estimate rather than moving it every tick.
    let flight=setup();
    let problem=create(flight);
    assert(problem?.context?.expectedClearAt>base,'security work has no estimated clearance');
    const estimate=problem.context.expectedClearAt;
    assert(estimate>=base+15*MIN&&estimate<=base+50*MIN,'generated clearance is outside the modeled work ranges');
    assert(problem.severity==='warning'&&!w.defaultPolicyForProblem(problem),'station work still demands an OCC decision');
    assert(!w.problemDefaultConsequence(problem,base),'station work still has an auto-cancel countdown');
    const repeated=w.createProblem('security_screening',flight,{
      training:true,detectedAt:base+5*MIN,context:w.generatedOperationalEventContext('security_screening',flight,base+5*MIN)
    });
    assert(repeated===problem&&problem.context.expectedClearAt===estimate,'repeated report restarted the clearance window');
    for(let i=0;i<5;i++){w.processProblems(base);w.recalculateOperations();}
    assert(problem.context.expectedClearAt===estimate,'recalculation moved the estimate');

    // An already-open record initializes from detection time and ignores its old cancellation deadline.
    problem.context=null;problem.severity='critical';flight.stationClearanceReadyAt=0;
    problem.unattended={version:1,flights:{[flight.id]:{flightId:flight.id,status:'pending',mode:'cancel_at_departure',deadline:base}}};
    setTime(base+5*MIN);w.processProblems(w.simNow());
    assert(problem.context.expectedClearAt===estimate,'existing work was restarted at reload time');
    assert(!flight.cancelled&&!w.problemDefaultConsequence(problem),'an old cancellation record still affects station work');

    // The same recovery-outlook component appears under warnings, with a clock time and live progress.
    flight=setup();problem=create(flight,timedContext);w.recalculateOperations();w.refreshAll();
    let card=d.querySelector(`[data-warning-incident="${problem.caseId}"]`);
    assert(card?.closest('.warning-feed'),'station-managed work is not in the warnings section');
    assert(!d.querySelector(`[data-critical-incident="${problem.caseId}"]`),'security warning was duplicated as a critical incident');
    assert(card.textContent.includes('Estimated clearance')&&card.textContent.includes(w.formatTime(timedContext.expectedClearAt)),'card does not show estimated clearance time');
    assert(card.querySelector(`[data-case-affected-flight="${flight.id}"]`),'warning lost its affected-flight link');
    assert(!card.querySelector('[data-problem-default-countdown]'),'routine station work displays automatic cancellation');
    assert(!w.problemIsActionable(problem),'station work still triggers the actionable-problem alert');
    setTime(base+20*MIN);w.refreshRequiredResponseProgress();
    assert(Number(card.querySelector('[role="progressbar"]').getAttribute('aria-valuenow'))===50,'clearance progress is not timestamp-derived');
    assert(w.departureBlockingProblemsForFlight(flight).includes(problem),'departure is not protected while security work is pending');
    const projected=w.flightActualDeparture(flight);
    assert(projected>=timedContext.expectedClearAt&&flight.departure===base+20*MIN,'clearance did not delay the projection while preserving planned departure');
    assert(flight.stationClearanceDelayMin>0,'security clearance has no delay attribution');
    w.processFlightLifecycleTransitions(w.simNow());
    assert(!flight.departureLogged&&!flight.cancelled,'the flight departed or cancelled while security checks were unfinished');

    // Save/load preserves the single deadline and the independent timing floor.
    const flightId=flight.id,problemId=problem.id;
    w.save();w.eval('state=loadState();invalidateOperationalIndex();');
    flight=w.state.flights.find(item=>item.id===flightId);problem=w.problemById(problemId);
    w.processProblems(w.simNow());w.recalculateOperations();
    assert(problem.context.expectedClearAt===timedContext.expectedClearAt,'clearance estimate changed across save/load');
    assert(w.flightActualDeparture(flight)===projected,'projected departure changed across save/load');
    setTime(base+39*MIN);w.processProblems(w.simNow());
    assert(problem.status==='open'&&!flight.cancelled,'checks cleared early or automatically cancelled the flight');
    setTime(timedContext.expectedClearAt);w.processProblems(w.simNow());w.recalculateOperations();
    assert(problem.status==='resolved'&&!problem.blocking&&problem.autoCloseReason==='station_clearance','station work did not clear at its modeled completion time');
    assert(w.flightActualDeparture(flight)===projected,'completion moved departure backwards');
    w.refreshAll();
    assert(!d.querySelector(`[data-warning-incident="${problem.caseId}"]`),'completed station warning remains visible');
    setTime(w.flightActualDeparture(flight));w.processFlightLifecycleTransitions(w.simNow());
    assert(flight.departureLogged&&!flight.cancelled,'flight cannot depart after station clearance');

    // Other blockers, manual retiming, and manual cancellation remain independent.
    flight=setup();problem=create(flight,timedContext);
    const crew=w.createProblem('crew_sick',flight,{training:true,detectedAt:base});
    flight.manualDelayMin=60;w.recalculateOperations();
    const manuallyHeld=w.flightActualDeparture(flight);
    assert(flight.stationClearanceDelayMin===0,'clearance time was added on top of a later manual hold');
    setTime(timedContext.expectedClearAt);w.processProblems(w.simNow());w.recalculateOperations();
    assert(problem.status==='resolved'&&crew.status==='open','station clearance incorrectly resolved an unrelated crew problem');
    assert(w.departureBlockingProblemsForFlight(flight).includes(crew),'station clearance bypassed another departure blocker');
    assert(w.flightActualDeparture(flight)===manuallyHeld,'station clearance overwrote the manual hold');

    flight=setup();problem=create(flight,timedContext);
    w.applyFlightCancellation(flight,'Fixture manual cancellation');w.processProblems(base);
    assert(flight.cancelled&&problem.status==='resolved','manual cancellation leaves an orphaned security warning');
    setTime(base+50*MIN);w.processProblems(w.simNow());w.recalculateOperations();
    assert(flight.cancelled&&!flight.departureLogged,'clearance resurrected a cancelled flight');

    // Leave a compact live example for visual inspection of the fixture.
    flight=setup();problem=create(flight,timedContext);w.recalculateOperations();w.refreshAll();
    result.textContent='PASS\nStable clearance estimate, warning UI, delayed departure, completion, persistence, and independent blockers';
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
