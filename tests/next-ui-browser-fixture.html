<!doctype html>
<meta charset="utf-8">
<title>AeroSim Next UI browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=next-ui&cache='+Date.now();
    await loaded;
    if(typeof frame.contentWindow.resetLocalSave==='function') frame.contentWindow.resetLocalSave();
    else{
      frame.contentWindow.localStorage.removeItem('aerosim_mvp_v6');
      frame.contentWindow.localStorage.removeItem('aerosim_occ_ui_v1');
    }
    const cleanLoaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=next-ui&cache='+Date.now();
    await cleanLoaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const departure=w.simNow()+150*60_000;
    const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure,fare:{economy:140,business:360,first:700}});
    flight.weatherChecked=true;
    const spare=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    w.changeStaff('FRA','captains',2);
    w.changeStaff('FRA','firstOfficers',2);
    w.changeQualification('FRA','captains','Airbus A320 family',2);
    w.changeQualification('FRA','firstOfficers','Airbus A320 family',2);
    w.refreshAll(); await wait(80);
    w.eval(`
      window.__incidentDingStarts=0;
      window.__testAudioState='running';
      class TestGain {
        constructor(){ this.gain={setValueAtTime(){},exponentialRampToValueAtTime(){}}; }
        connect(){}
        disconnect(){}
      }
      class TestOscillator {
        constructor(){ this.isDing=false; this.frequency={setValueAtTime:value=>{ if(value>=800) this.isDing=true; }}; }
        connect(){}
        start(){ if(this.isDing) window.__incidentDingStarts++; }
        stop(){}
        addEventListener(type,callback){ if(type==='ended') setTimeout(callback,0); }
      }
      window.AudioContext=class {
        constructor(){ this.currentTime=0; this.destination={}; }
        get state(){ return window.__testAudioState; }
        createGain(){ return new TestGain(); }
        createOscillator(){ return new TestOscillator(); }
        resume(){ return Promise.resolve(); }
      };
    `);
    assert(!d.querySelector('#taskInboxButton'),'Tasks still appears in the top bar');
    assert(!d.querySelector('[data-workspace="management"]'),'Planning & resources still appears in the top bar');
    assert(d.querySelector('[data-training-incident]'),'training incident control is missing');
    const incident=w.createIncident('crew_sick',flight,{training:true});
    incident.affectedRole='captains';
    w.save();
    w.refreshAll(); await wait(100);
    assert(w.__incidentDingStarts===1,'new actionable incident did not play one alert ding');
    const openIncidentTitle=`(${w.openOperationalIncidents().length}) Airline Operations Control Center`;
    assert(d.title===openIncidentTitle,`browser title does not show open incident count badge: ${d.title}`);
    assert(incident?.training,'training scenario was not created');
    assert(d.querySelector('#operationFilterBar'),'global operation filter bar is missing');
    w.applyOperationFilter({airport:'FRA'}); await wait(100);
    assert(d.querySelector('[data-remove-airport-filter="FRA"]'),'airport filter did not create an FRA pill');
    assert(d.querySelector('[data-operation-filter-airport]')?.value==='','airport combobox did not reset after adding a pill');
    assert(d.querySelector(`#schedule-board [data-flight-id="${flight.id}"]`),'airport filter hid a matching flight from schedule');
    w.applyOperationFilter({airport:'LHR'}); await wait(100);
    assert(d.querySelector('[data-remove-airport-filter="LHR"]'),'second airport filter pill was not added');
    d.querySelector('[data-remove-airport-filter="LHR"]').click(); await wait(100);
    assert(!d.querySelector('[data-remove-airport-filter="LHR"]'),'airport filter pill remove did not work');
    w.applyOperationFilter({activeIncidents:true}); await wait(100);
    assert(d.querySelector('[data-operation-filter-incidents]')?.classList.contains('active'),'active-incident filter did not toggle on');
    assert(d.querySelector('#schedule-board')?.textContent.includes(flight.id),'active-incident filter hid matching flight from schedule');
    d.querySelector('[data-desk-panel="corporate:planning"]')?.click();
    await wait(100);
    const focusedDestination=d.querySelector('#destination');
    assert(!focusedDestination.closest('[hidden]'),'planning destination combobox is not in the visible planning form');
    focusedDestination.focus();
    focusedDestination.value='JFK';
    w.refreshAll();
    await wait(120);
    assert(d.activeElement===focusedDestination,'planning destination combobox was replaced during refresh');
    assert(focusedDestination.value==='JFK','planning destination combobox value changed during refresh');
    focusedDestination.blur();
    w.eval(`setDeskPanel('corporate','')`);
    w.refreshCorporateResources(true);
    await wait(80);
    const filterSelect=d.querySelector('[data-operation-filter-airport]');
    filterSelect.focus();
    const filterOption=[...filterSelect.options].find(option=>option.value);
    assert(filterOption,'filter airport combobox has no selectable airport option');
    filterSelect.value=filterOption.value;
    w.renderOperationFilterBar(true);
    await wait(60);
    assert(d.activeElement===filterSelect,'filter airport combobox was replaced during refresh');
    assert(filterSelect.value===filterOption.value,'filter airport combobox value changed during refresh');
    filterSelect.blur();
    w.applyOperationFilter({airports:['AMS']}); await wait(100);
    assert(!d.querySelector(`#schedule-board [data-flight-id="${flight.id}"]`),'airport filter showed a non-matching flight');
    const delayedAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const delayedFlight=w.createFlightRecord({aircraftId:delayedAc.id,from:'FRA',to:'CDG',departure:w.simNow()-45*60_000,fare:{economy:120,business:300,first:600}});
    delayedFlight.departureLogged=true;
    delayedFlight.manualDelayMin=20;
    delayedFlight.actualDeparture=delayedFlight.departure+20*60_000;
    delayedFlight.actualArrival=w.simNow()+50*60_000;
    w.applyOperationFilter({airports:[],activeIncidents:false,delayed:true}); await wait(100);
    assert(d.querySelector('[data-operation-filter-delayed]')?.classList.contains('active'),'delayed filter did not toggle on');
    assert(d.querySelector('#schedule-board')?.textContent.includes(delayedFlight.id),'delayed filter hid a delayed active flight in the schedule');
    delayedFlight.cancelled=true;
    w.applyOperationFilter({airports:[],delayed:false});
    const originalRouteHazards=w.AeroWeatherEngine.routeHazards;
    w.AeroWeatherEngine.routeHazards=(from,to)=>from==='FRA'&&to==='LHR'?[{id:'WXTEST',label:'Test storm cell',type:'storm',severity:'severe',delayMin:30,distanceKm:10,radiusKm:60}]:[];
    w.applyOperationFilter({activeIncidents:false,weatherCell:{id:'WXTEST',label:'Test storm cell',type:'storm',severity:'severe',delayMin:30}}); await wait(100);
    assert(d.querySelector('.filter-chip.weather')?.textContent.includes('WXTEST'),'weather filter chip is missing');
    assert(d.querySelector(`#schedule-board [data-flight-id="${flight.id}"]`),'weather-cell filter hid an affected flight');
    w.AeroWeatherEngine.routeHazards=originalRouteHazards;
    w.clearOperationFilters(); await wait(100);
    const passengerConnectionAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'LHR');
    const passengerConnection=w.createFlightRecord({aircraftId:passengerConnectionAc.id,from:'LHR',to:'CDG',departure:w.flightActualArrival(flight)+75*60_000,fare:{economy:130,business:320,first:650}});
    w.recalculateOperations();
    w.settleSelectedFlight(flight.id);
    w.refreshScheduleTimeline(true);
    await wait(120);
    assert(d.querySelector(`#schedule-board .schedule-connection-overlay [data-connection-inbound="${flight.id}"][data-connection-outbound="${passengerConnection.id}"]`),'selected flight passenger connection arrow is not shown in the schedule');
    assert(d.querySelector('#schedule-board .schedule-passenger-connection-label')?.textContent.includes('/'),'passenger connection arrow label does not show available time and MCT');
    d.querySelector(`#schedule-board .schedule-connection-overlay [data-connection-inbound="${flight.id}"][data-connection-outbound="${passengerConnection.id}"] .schedule-connection-path`)?.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    await wait(80);
    assert(w.eval(`selectedFlightId==='${flight.id}'`),'clicking a passenger connection arrow did not select the inbound flight');
    w.clearOperationalSelection();
    await wait(80);
    const connectorAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const connectorFirst=w.createFlightRecord({aircraftId:connectorAc.id,from:'FRA',to:'LHR',departure:w.simNow()+3*60*60_000,fare:{economy:120,business:300,first:600}});
    w.recalculateOperations();
    const connectorSecond=w.createFlightRecord({aircraftId:connectorAc.id,from:'LHR',to:'FRA',departure:w.flightActualArrival(connectorFirst)+75*60_000,fare:{economy:120,business:300,first:600}});
    w.refreshAll(); await wait(120);
    const expectedConnectorGap=w.formatDuration(w.flightActualDeparture(connectorSecond)-w.flightActualArrival(connectorFirst));
    assert([...d.querySelectorAll('#schedule-board .connection-label')].some(item=>item.textContent.trim()===expectedConnectorGap),'schedule connector does not show ground-time distance');
    const lateConnectorAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'AMS');
    const lateInbound=w.createFlightRecord({aircraftId:lateConnectorAc.id,from:'AMS',to:'FRA',departure:w.simNow()+2*60*60_000,fare:{economy:120,business:300,first:600}});
    w.recalculateOperations();
    const lateOutbound=w.createFlightRecord({aircraftId:lateConnectorAc.id,from:'FRA',to:'CDG',departure:w.flightActualArrival(lateInbound)+35*60_000,fare:{economy:120,business:300,first:600}});
    lateInbound.manualDelayMin=75;
    w.recalculateOperations();
    w.refreshAll(); await wait(120);
    assert(!w.lateInboundStatusForFlight(lateOutbound).active,'planned short turn should not also derive a late-inbound warning');
    assert(!d.querySelector('#schedule-board .connection-line.late-inbound'),'planned short turn should not be highlighted as late inbound');
    if(!d.querySelector('#schedule-board .connection-line.short-turn')){
      const shortTurnAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'CDG');
      const shortFirst=w.createFlightRecord({aircraftId:shortTurnAc.id,from:'CDG',to:'AMS',departure:w.simNow()+6*60*60_000,fare:{economy:120,business:300,first:600}});
      w.recalculateOperations();
      w.createFlightRecord({aircraftId:shortTurnAc.id,from:'AMS',to:'CDG',departure:w.flightActualArrival(shortFirst)+10*60_000,fare:{economy:120,business:300,first:600}});
      w.recalculateOperations();
      w.refreshAll(); await wait(120);
    }
    assert(d.querySelector('#schedule-board .connection-line.short-turn'),'under-minimum turnaround connector is not highlighted');
    w.eval('state.ops.automaticDisruptions=false');
    const weatherAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'DXB');
    const weatherFlight=w.createFlightRecord({aircraftId:weatherAc.id,from:'DXB',to:'DOH',departure:w.simNow()-30*60_000,fare:{economy:140,business:360,first:700}});
    weatherFlight.departureLogged=true;
    weatherFlight.actualDeparture=w.simNow()-30*60_000;
    weatherFlight.actualArrival=w.simNow()+65*60_000;
    weatherFlight.enrouteChecked=true;
    weatherFlight.weatherLiveChecks={period:Math.floor(w.simNow()/(30*60_000)),routeApplied:true,destinationChecked:true,lightningApplied:true};
    w.refreshAll(); await wait(120);
    w.settleSelectedFlight(weatherFlight.id); await wait(120);
    assert(!d.querySelector('#routeDetailStrip'),'center route detail strip should not be rendered');
    const leftWeather=d.querySelector(`[data-desk-widget="planning"] .flight-weather-forecast`);
    assert(leftWeather,'dispatch selected-flight details do not show forecast weather');
    assert(leftWeather.textContent.includes('Forecast weather')&&leftWeather.textContent.includes('Route')&&leftWeather.textContent.includes('DOH'),'flight weather forecast is missing route or destination context');
    w.eval(`knownActionableIncidentIds=actionableIncidentIdSet(); incidentSoundInitialized=true; window.__incidentDingStarts=1;`);
    w.refreshAll(); await wait(250);
    assert(w.__incidentDingStarts===1,'existing actionable incident played repeated alert dings');
    w.eval(`window.__testAudioState='suspended'; playIncidentDing(); window.__testAudioState='running';`);
    await w.armIncidentDing(); await wait(50);
    assert(w.__incidentDingStarts===1,'blocked incident ding replayed later on user interaction');
    const loopAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'DXB');
    const loopFlight=w.createFlightRecord({aircraftId:loopAc.id,from:'DXB',to:'DOH',departure:w.simNow()+60*60_000,fare:{economy:120,business:300,first:600}});
    loopFlight.weatherChecked=true;
    loopFlight.constraintChecked=true;
    const loopIncident=w.createIncident('fueling_issue',loopFlight,{training:true});
    assert(loopIncident,'loop incident scenario was not created');
    w.save();
    await wait(250);
    assert(w.__incidentDingStarts===2,'live-loop actionable incident did not play an alert ding');
    loopIncident.status='resolved';
    loopIncident.blocking=false;
    loopIncident.resolvedAt=w.simNow();
    loopFlight.cancelled=true;
    w.eval(`state.incidents.filter(item=>item.flightId==='${loopFlight.id}'&&item.status==='open').forEach(item=>{
      item.status='resolved'; item.blocking=false; item.resolvedAt=simNow(); item.automaticResolution=true;
      incidentTasks(item.id).forEach(task=>{ if(!['completed','cancelled'].includes(task.status)) task.status='cancelled'; });
    })`);
    w.save();
    w.refreshAll(); await wait(80);
    assert(!d.querySelector('[data-rail-widget="upcomingFlights"]'),'upcoming flight widget should be removed from the left rail');
    assert(d.querySelector(`#schedule-board [data-flight-id="${flight.id}"]`),'upcoming flight was not rendered in schedule');
    assert(!d.querySelector('[data-rail-widget="activeFlights"]'),'active flight widget should be removed from the left rail');
    assert(d.querySelectorAll('.operations-rail [data-rail-widget]').length===4,'left rail should show corporate resources, personnel, aircraft, and maintenance widgets');
    assert(d.querySelector('[data-toggle-rail="corporateResources"]'),'corporate resources widget header is not collapsible');
    assert(d.querySelector('[data-toggle-rail="personnel"]'),'personnel widget header is not collapsible');
    assert(d.querySelector('[data-toggle-rail="aircraft"]'),'aircraft widget header is not collapsible');
    assert(d.querySelector('[data-toggle-rail="maintenance"]'),'maintenance widget header is not collapsible');
    d.querySelector('[data-toggle-rail="personnel"]').click(); await wait(50);
    assert(d.querySelector('#rail-body-personnel').hidden,'personnel widget did not collapse');
    d.querySelector('[data-toggle-rail="personnel"]').click(); await wait(50);
    assert(!d.querySelector('#rail-body-personnel').hidden,'personnel widget did not reopen');
    assert(![...d.querySelectorAll('#aircraftList .list-reason')].some(item=>item.textContent.includes('Crew sick')),'flight-only crew incident was duplicated on the aircraft row');
    assert(!d.querySelector('#attentionList'),'a separate attention list exists');
    const activeAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'AMS');
    const activeFlight=w.createFlightRecord({aircraftId:activeAc.id,from:'AMS',to:'CDG',departure:w.simNow()-45*60_000,fare:{economy:140,business:360,first:700}});
    activeFlight.departureLogged=true;
    activeFlight.actualDeparture=activeFlight.departure;
    activeFlight.actualArrival=w.simNow()+75*60_000;
    activeFlight.operationalDurationMs=activeFlight.actualArrival-activeFlight.actualDeparture;
    activeFlight.fueled=true;
    activeFlight.fuelOnboardAtDeparture=5200;
    activeFlight.tripFuelGallons=3200;
    activeFlight.fuelReserveGallons=900;
    w.refreshAll(); await wait(120);
    w.settleSelectedFlight(activeFlight.id); w.refreshAll(); await wait(120);
    assert(d.querySelector(`[data-dispatch-flight-status="${activeFlight.id}"] .dispatch-progress`),'dispatch selected-flight status does not show active flight progress');
    assert(d.querySelector(`[data-dispatch-flight-status="${activeFlight.id}"]`)?.textContent.includes(activeAc.tail),'dispatch selected-flight status does not show aircraft used');
    const selectedStatusText=d.querySelector(`[data-dispatch-flight-status="${activeFlight.id}"]`)?.textContent||'';
    assert(!/Inbound turn|Outbound turn|No connected turnaround/.test(selectedStatusText),'dispatch selected-flight status should not include turnaround rows');
    const recoveryAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'ATL');
    const recoveryFlight=w.createFlightRecord({aircraftId:recoveryAc.id,from:'ATL',to:'ORD',departure:w.simNow()-45*60_000,fare:{economy:220,business:520,first:1100}});
    const recoveryPlan=w.flightFuelPlan('ATL','ORD',recoveryAc);
    recoveryFlight.departureLogged=true;
    recoveryFlight.actualDeparture=recoveryFlight.departure;
    recoveryFlight.operationalDurationMs=recoveryFlight.arrival-recoveryFlight.departure;
    recoveryFlight.enrouteDelayMin=45;
    recoveryFlight.fueled=true;
    recoveryFlight.fuelOnboardAtDeparture=recoveryPlan.fuelCapacityGal;
    recoveryAc.fuelGallons=recoveryPlan.fuelCapacityGal;
    recoveryFlight.tripFuelGallons=recoveryPlan.tripBurnGal;
    recoveryFlight.fuelReserveGallons=recoveryPlan.reserveGal;
    w.recalculateOperations();
    const beforeRecoveryArrival=w.flightActualArrival(recoveryFlight);
    w.settleSelectedFlight(recoveryFlight.id); w.refreshAll(); await wait(120);
    const speedRecovery=d.querySelector(`[data-dispatch-occ-flight="${recoveryFlight.id}"] [data-enroute-recovery="${recoveryFlight.id}"][data-recovery-option="speed"]`);
    const recoveryRow=d.querySelector(`[data-dispatch-occ-flight="${recoveryFlight.id}"] .enroute-recovery-row`);
    assert(recoveryRow?.textContent.includes('Recommend a higher cruise cost index'),'en-route recovery explanation is not visible under the option button');
    assert(recoveryRow?.textContent.includes('fuel margin'),'en-route recovery impact details are not visible under the option button');
    const recoveryContext=w.enrouteRecoveryContextForFlight(recoveryFlight);
    assert(speedRecovery&&!speedRecovery.disabled,`dispatch does not expose higher-speed en-route recovery for a delayed airborne flight: ${JSON.stringify({reason:recoveryContext.unavailableReason,status:recoveryContext.status,arrDelay:recoveryContext.arrDelay,remainingMin:recoveryContext.remainingMin,fuel:w.fuelMarginContextForFlight(recoveryFlight),plan:recoveryPlan,onboard:recoveryFlight.fuelOnboardAtDeparture,options:recoveryContext.options.map(option=>({id:option.id,disabled:option.disabled,disabledReason:option.disabledReason,recoverMin:option.recoverMin,fuelMarginPct:option.fuelMarginPct}))})}`);
    speedRecovery.click(); await wait(140);
    assert(recoveryFlight.enrouteRecoveryRequest?.status==='pending','higher-speed recovery should wait for flight deck response');
    let acceptedRequestId='';
    for(let i=0;i<80;i++){
      const candidate=`fixture-speed-accepted-${i}`;
      if(w.stableFraction(`${candidate}:response`)>.7){ acceptedRequestId=candidate; break; }
    }
    assert(acceptedRequestId,'could not find deterministic accepted en-route response id');
    recoveryFlight.enrouteRecoveryRequest.id=acceptedRequestId;
    recoveryFlight.enrouteRecoveryRequest.respondsAt=w.simNow()-60_000;
    w.processEnrouteRecoveryRequests(w.simNow());
    w.recalculateOperations();
    w.refreshAll(); await wait(120);
    assert(recoveryFlight.enrouteRecoveryMin>0,'higher-speed recovery did not record recovered en-route minutes');
    assert(w.flightActualArrival(recoveryFlight)<beforeRecoveryArrival,'higher-speed recovery did not improve projected arrival');
    assert(recoveryFlight.enrouteRecoveryCost>0,'higher-speed recovery did not record recovery cost');
    const resultCard=d.querySelector(`[data-dispatch-occ-flight="${recoveryFlight.id}"] .enroute-result-card`);
    assert(resultCard?.textContent.includes('Accepted'),'completed en-route recovery does not show the accepted response');
    assert(resultCard?.textContent.includes('recovered'),'completed en-route recovery does not show recovered minutes');
    assert(!d.querySelector(`[data-dispatch-occ-flight="${recoveryFlight.id}"] [data-enroute-recovery="${recoveryFlight.id}"]`),'completed en-route recovery should not expose another immediate option set');
    assert(d.querySelector(`[data-dispatch-delay-flight="${recoveryFlight.id}"]`)?.textContent.includes('En-route recovery'),'delay analysis does not explain en-route recovery');
    assert(!d.querySelector('[data-desk-widget="airports"]'),'airports widget should not be rendered');
    const watchAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const watchFlight=w.createFlightRecord({aircraftId:watchAc.id,from:'FRA',to:'CDG',departure:w.simNow()+48*60*60_000,fare:{economy:140,business:360,first:700}});
    const watchIncident=w.createIncident('aircraft_late_inbound',watchFlight,{training:true,detectedAt:w.simNow()});
    assert(!watchIncident,'late inbound should not be creatable as a standalone incident');
    w.refreshAll(); await wait(100);
    assert(d.querySelector('[data-incident-filter="actionable"].active'),'incident widget does not default to actionable triage');
    assert(Number(d.querySelector('[data-incident-filter="actionable"] b')?.textContent||0)>=1,'actionable incident count should include current operational cases');
    assert(Number(d.querySelector('[data-incident-filter="all"] b')?.textContent||0)>=1,'all incident count is wrong');
    assert(!d.querySelector('[data-desk-widget="incidents"]')?.textContent.includes('Aircraft late inbound'),'late inbound leaked into incident triage');
    assert(d.querySelector('[data-desk-widget="planning"]'),'dispatch widget is missing from the right rail');
    assert(d.querySelector('[data-desk-widget="passengers"]'),'passenger impact widget is missing from the right rail');
    assert(d.querySelector('[data-desk-widget="crew-impact"]'),'crew impact widget is missing from the right rail');
    assert(d.querySelector('[data-rail-widget="personnel"]'),'personnel widget is missing from the left rail');
    assert(!d.querySelector('[data-desk-widget="personnel"]'),'personnel widget should not remain in the right rail');
    assert(!d.querySelector('[data-desk-widget="selectedWork"]'),'selected-flight work widget should not be rendered');
    w.settleSelectedFlight(flight.id); await wait(80);
    assert(d.querySelector('#contextPane').hidden,'separate selected-details pane should stay hidden');
    assert(!d.querySelector('[data-desk-widget="selectedWork"]'),'selecting a flight should not open a selected-flight work widget');
    const dispatchScope=d.querySelector(`[data-desk-widget="planning"] [data-dispatch-selected-flight="${flight.id}"]`);
    assert(dispatchScope?.textContent.includes(flight.id),'dispatch widget does not show selected-flight scope at the top');
    assert(dispatchScope.compareDocumentPosition(d.querySelector(`[data-dispatch-occ-flight="${flight.id}"]`))&Node.DOCUMENT_POSITION_FOLLOWING,'dispatch selected-flight scope should appear before OCC actions');
    assert(d.querySelector(`[data-dispatch-occ-flight="${flight.id}"]`),'selected upcoming flight did not populate dispatch OCC actions');
    assert(!d.querySelector('[data-cancel-next-flight]'),'left flight card still exposes a cancel-flight action');
    assert(d.querySelector('[data-desk-widget="planning"] .occ-actions-section'),'dispatch widget does not show OCC actions');
    assert(!d.querySelector('[data-desk-widget="planning"] [data-desk-panel="planning:planning"]'),'dispatch widget should not expose plan/position action');
    assert(d.querySelector(`[data-occ-delay-flight="${flight.id}"][data-delay-min="15"]`),'manual +15 hold action is missing');
    d.querySelector(`[data-occ-delay-flight="${flight.id}"][data-delay-min="15"]`).click(); await wait(120);
    assert(flight.manualDelayMin>=15,'manual OCC hold did not add departure delay');
    assert(d.querySelector(`[data-flight-id="${flight.id}"].shifted`),'shifted flight does not render the actual schedule bar');
    assert(d.querySelector(`[data-flight-id="${flight.id}"].shifted`)?.textContent.includes(w.shortClock(w.flightActualDeparture(flight))),'shifted schedule card did not repaint to the new departure time');

    assert(d.querySelector('[data-rail-widget="personnel"] [data-management-content="relocation"]'),'relocation controls are not mounted in the personnel widget after opening the action');
    const openedTask=d.querySelector('[data-desk-widget="incidents"] .case-active-task [data-inline-task]');
    assert(openedTask?.querySelector('.inline-task-action'),'crew workflow controls are not shown directly in the incident widget');
    const openedTaskId=openedTask?.dataset.inlineTask;
    const resolveControl=openedTask?.querySelector('[data-task-action="replace"]');
    assert(resolveControl,'incident crew workflow does not expose a resolver control');
    resolveControl.click(); await wait(160);
    assert(!d.querySelector(`[data-inline-task="${CSS.escape(openedTaskId)}"]`),'resolved crew workflow task did not close');
    assert(w.eval('workspaceUi.nextActiveIncidentId')===incident.id,'incident queue advanced before the same case exposed its next ready task');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-active-task')?.textContent.includes('Activate local reserve crew'),'incident case did not advance from crew strategy to crew allocation');
    const allocateControl=d.querySelector('[data-desk-widget="incidents"] .case-active-task [data-task-action="allocate"]');
    assert(allocateControl,'crew allocation action is missing after selecting the recovery branch');
    allocateControl.click(); await wait(160);
    assert(w.eval('workspaceUi.nextActiveIncidentId')===incident.id,'incident case selection did not stay on the current case after allocation');
    assert(d.querySelector('[data-rail-widget="corporateResources"] .page-heading .info-tip'),'embedded planning helper is missing its info tooltip');
    assert(getComputedStyle(d.querySelector('[data-rail-widget="corporateResources"] .page-heading p')).display==='none','embedded planning helper copy is still visible');
    assert(d.querySelector('[data-rail-widget="personnel"] .desk-list-row')?.textContent.includes('captains'),'personnel widget does not show station staffing');
    const fraStaffToggle=d.querySelector('[data-rail-widget="personnel"] [data-staff-airport="FRA"]');
    assert(fraStaffToggle,'staff airport row is not expandable');
    fraStaffToggle.click(); await wait(80);
    const staffDetail=d.querySelector('[data-rail-widget="personnel"] .staff-detail');
    assert(staffDetail?.textContent.includes('Airbus A320 family'),'expanded staff row does not show aircraft-family qualifications');
    assert(staffDetail?.textContent.includes('Selected flight demand'),'expanded staff row does not show selected-flight crew demand');
    d.querySelector('[data-rail-widget="personnel"] [data-staff-airport="FRA"]').click(); await wait(80);
    assert(!d.querySelector('[data-rail-widget="personnel"] .staff-detail'),'staff airport row did not collapse');
    assert(!d.querySelector('[data-desk-panel^="airports:"]'),'airports widget actions should not exist');
    assert(d.querySelector('[data-desk-widget="passengers"].compact-empty'),'passenger widget should show an empty selected-flight state');
    assert(d.querySelector('[data-desk-widget="crew-impact"].compact-empty'),'crew impact widget should show an empty selected-flight state');
    const autoAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    w.changeStaff('FRA','operations',2);
    const autoFlight=w.createFlightRecord({aircraftId:autoAc.id,from:'FRA',to:'AMS',departure:w.simNow()+2*60*60_000,fare:{economy:140,business:360,first:700}});
    const autoIncident=w.createIncident('airport_capacity_reduction',autoFlight,{training:true,context:{sourceId:autoFlight.id,delayMin:45,reason:'ATC regulated departure window'}});
    w.eval(`workspaceUi.incidentFilter='all'; setActiveIncidentCase('${autoIncident.id}')`);
    w.refreshAll(); await wait(100);
    assert(!d.querySelector(`[data-incident-case="${autoIncident.id}"] [data-open-case]`),'new incident card still renders an open-case link');
    const autoAccept=d.querySelector(`[data-incident-case="${autoIncident.id}"] [data-task-action="accept"]`);
    assert(autoAccept&&!autoAccept.disabled,'single-click airport-flow accept action is not available');
    autoAccept.click();
    await wait(180);
    assert(autoIncident.status==='resolved','single-click strategy did not auto-run the determined follow-up task');
    assert(autoFlight.incidentDelayMin===45,'single-click airport-flow accept did not apply the expected delay');
    assert(!d.querySelector('[data-handle-incident]')&&!d.querySelector('[data-summary-task]')&&!d.querySelector('[data-full-flight]'),'left flight overview still exposes a separate details/task button');
    assert(d.querySelector('#scheduleType option[value="ferry"]'),'ferry planning is not available in the inline planner');
    assert(!d.querySelector('[data-desk-widget="selectedWork"]'),'selected-flight work widget should not exist');
    w.settleSelected(ac.id); await wait(80);
    assert(d.querySelector('#aircraftList [data-left-aircraft-details]'),'aircraft selection did not open inline aircraft details');
    assert(d.querySelector('#aircraftList [data-left-aircraft-details]')?.closest('[data-left-card-aircraft]'),'aircraft details are not contained by the selected aircraft card');
    assert(d.querySelector('#aircraftList [data-left-aircraft-details]')?.textContent.includes(ac.tail)||d.querySelector('#aircraftList .list-row.selected')?.textContent.includes(ac.tail),'map-style aircraft selection did not update left-side information');
    assert(d.querySelectorAll('#deskStack .occ-board-widget').length===5,'aircraft selection rebuilt or hid the individual right-rail widgets');
    assert(d.querySelector('#managementView').hidden,'legacy management workspace became visible');
    assert(d.querySelector('#map.maplibregl-map'),'shared map did not initialize');
    assert(d.querySelector('#schedule-board .sched-aircraft-row'),'shared schedule did not initialize');
    const visual=new URLSearchParams(location.search).get('visual');
    if(visual==='board'){
      d.querySelector('.context-rail').scrollTop=0;
      await wait(100);
    }else if(visual==='incidents'){
      w.openDesk('incidents');
      await wait(100);
    }else if(visual==='details'){
      w.settleSelectedFlight(flight.id);
      w.refreshAll();
      await wait(100);
    }else if(visual){
      w.settleSelectedFlight(flight.id);
      w.refreshAll();
      await wait(100);
    }else{
      const ac2=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      assert(ac2?.id,'second aircraft was not assigned for scheduler personnel test');
      const personnelDeparture=w.simNow()+2*60*60_000;
      const personnelEstimate=w.estimateFlight('FRA','AMS',ac2,{economy:140,business:360,first:700},{departure:personnelDeparture});
      w.requestPersonnelDeficitsForFlight(ac2,personnelDeparture,personnelEstimate.duration,'FRA');
      w.createFlightRecord({aircraftId:ac2.id,from:'FRA',to:'AMS',departure:personnelDeparture,fare:{economy:140,business:360,first:700}});
      w.processResourceRequests(Number.MAX_SAFE_INTEGER);
      w.save();
      const saved=JSON.parse(w.localStorage.getItem('aerosim_mvp_v6'));
      const scheduled=saved.flights.find(item=>item.aircraftId===ac2.id&&item.from==='FRA'&&item.to==='AMS'&&!item.cancelled);
      const family='Airbus A320 family';
      assert(scheduled,'scheduleFlight did not create the requested flight');
      assert(w.qualifiedStaffAt('FRA','captains',family)>=1,'scheduleFlight did not auto-provision a qualified captain');
      assert(w.qualifiedStaffAt('FRA','firstOfficers',family)>=1,'scheduleFlight did not auto-provision a qualified first officer');
      assert(w.staffAt('FRA','cabinCrew')>=4,'scheduleFlight did not auto-provision cabin crew');
      assert(w.staffAt('FRA','groundHandling')>=4,'scheduleFlight did not auto-provision ground handling');
    }
    result.textContent=`PASS\nflight=${flight.id}\nincident=${incident.id}\nnew_ui=department-desks+action-panels`;
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
