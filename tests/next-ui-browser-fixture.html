<!doctype html>
<meta charset="utf-8">
<title>AeroSim Next UI browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=next-ui&cache='+Date.now();
    await loaded;
    if(typeof frame.contentWindow.resetLocalSave==='function') frame.contentWindow.resetLocalSave();
    else{
      frame.contentWindow.localStorage.removeItem('aerosim_mvp_v6');
      frame.contentWindow.localStorage.removeItem('aerosim_occ_ui_v1');
    }
    const cleanLoaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=next-ui&cache='+Date.now();
    await cleanLoaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    const ac=w.requestAircraft('A320neo');
    const departure=w.simNow()+150*60_000;
    const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure,fare:{economy:140,business:360,first:700}});
    flight.weatherChecked=true;
    const spare=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    w.changeStaff('FRA','captains',2);
    w.changeStaff('FRA','firstOfficers',2);
    w.changeQualification('FRA','captains','Airbus A320 family',2);
    w.changeQualification('FRA','firstOfficers','Airbus A320 family',2);
    w.refreshAll(); await wait(80);
    w.eval(`
      window.__incidentDingStarts=0;
      window.__testAudioState='running';
      class TestGain {
        constructor(){ this.gain={setValueAtTime(){},exponentialRampToValueAtTime(){}}; }
        connect(){}
        disconnect(){}
      }
      class TestOscillator {
        constructor(){ this.isDing=false; this.frequency={setValueAtTime:value=>{ if(value>=800) this.isDing=true; }}; }
        connect(){}
        start(){ if(this.isDing) window.__incidentDingStarts++; }
        stop(){}
        addEventListener(type,callback){ if(type==='ended') setTimeout(callback,0); }
      }
      window.AudioContext=class {
        constructor(){ this.currentTime=0; this.destination={}; }
        get state(){ return window.__testAudioState; }
        createGain(){ return new TestGain(); }
        createOscillator(){ return new TestOscillator(); }
        resume(){ return Promise.resolve(); }
      };
    `);
    assert(!d.querySelector('#taskInboxButton'),'Tasks still appears in the top bar');
    assert(!d.querySelector('[data-workspace="management"]'),'Planning & resources still appears in the top bar');
    assert(d.querySelector('[data-training-incident]'),'training incident control is missing');
    const incident=w.createIncident('crew_sick',flight,{training:true});
    incident.affectedRole='captains';
    w.save();
    w.refreshAll(); await wait(100);
    assert(w.__incidentDingStarts===1,'new actionable incident did not play one alert ding');
    assert(incident?.training,'training scenario was not created');
    assert(d.querySelector('#operationFilterBar'),'global operation filter bar is missing');
    w.applyOperationFilter({airport:'FRA'}); await wait(100);
    assert(d.querySelector('[data-remove-airport-filter="FRA"]'),'airport filter did not create an FRA pill');
    assert(d.querySelector('[data-operation-filter-airport]')?.value==='','airport combobox did not reset after adding a pill');
    assert(d.querySelector(`#schedule-board [data-flight-id="${flight.id}"]`),'airport filter hid a matching flight from schedule');
    w.applyOperationFilter({airport:'LHR'}); await wait(100);
    assert(d.querySelector('[data-remove-airport-filter="LHR"]'),'second airport filter pill was not added');
    d.querySelector('[data-remove-airport-filter="LHR"]').click(); await wait(100);
    assert(!d.querySelector('[data-remove-airport-filter="LHR"]'),'airport filter pill remove did not work');
    w.applyOperationFilter({activeIncidents:true}); await wait(100);
    assert(d.querySelector('[data-operation-filter-incidents]')?.classList.contains('active'),'active-incident filter did not toggle on');
    assert(d.querySelector('#schedule-board')?.textContent.includes(flight.id),'active-incident filter hid matching flight from schedule');
    w.applyOperationFilter({airports:['AMS']}); await wait(100);
    assert(!d.querySelector(`#schedule-board [data-flight-id="${flight.id}"]`),'airport filter showed a non-matching flight');
    const delayedAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const delayedFlight=w.createFlightRecord({aircraftId:delayedAc.id,from:'FRA',to:'CDG',departure:w.simNow()-45*60_000,fare:{economy:120,business:300,first:600}});
    delayedFlight.departureLogged=true;
    delayedFlight.manualDelayMin=20;
    delayedFlight.actualDeparture=delayedFlight.departure+20*60_000;
    delayedFlight.actualArrival=w.simNow()+50*60_000;
    w.applyOperationFilter({airports:[],activeIncidents:false,delayed:true}); await wait(100);
    assert(d.querySelector('[data-operation-filter-delayed]')?.classList.contains('active'),'delayed filter did not toggle on');
    assert(d.querySelector('#activeFlightList')?.textContent.includes(delayedFlight.id),'delayed filter hid a delayed active flight');
    delayedFlight.cancelled=true;
    w.applyOperationFilter({airports:[],delayed:false});
    const originalRouteHazards=w.AeroWeatherEngine.routeHazards;
    w.AeroWeatherEngine.routeHazards=(from,to)=>from==='FRA'&&to==='LHR'?[{id:'WXTEST',label:'Test storm cell',type:'storm',severity:'severe',delayMin:30,distanceKm:10,radiusKm:60}]:[];
    w.applyOperationFilter({activeIncidents:false,weatherCell:{id:'WXTEST',label:'Test storm cell',type:'storm',severity:'severe',delayMin:30}}); await wait(100);
    assert(d.querySelector('.filter-chip.weather')?.textContent.includes('WXTEST'),'weather filter chip is missing');
    assert(d.querySelector(`#schedule-board [data-flight-id="${flight.id}"]`),'weather-cell filter hid an affected flight');
    w.AeroWeatherEngine.routeHazards=originalRouteHazards;
    w.clearOperationFilters(); await wait(100);
    const connectorAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const connectorFirst=w.createFlightRecord({aircraftId:connectorAc.id,from:'FRA',to:'LHR',departure:w.simNow()+3*60*60_000,fare:{economy:120,business:300,first:600}});
    w.recalculateOperations();
    const connectorSecond=w.createFlightRecord({aircraftId:connectorAc.id,from:'LHR',to:'FRA',departure:w.flightActualArrival(connectorFirst)+75*60_000,fare:{economy:120,business:300,first:600}});
    w.refreshAll(); await wait(120);
    assert([...d.querySelectorAll('#schedule-board .connection-label')].some(item=>item.textContent.trim()==='1h 15m'),'schedule connector does not show ground-time distance');
    const lateConnectorAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'AMS');
    const lateInbound=w.createFlightRecord({aircraftId:lateConnectorAc.id,from:'AMS',to:'FRA',departure:w.simNow()+2*60*60_000,fare:{economy:120,business:300,first:600}});
    w.recalculateOperations();
    const lateOutbound=w.createFlightRecord({aircraftId:lateConnectorAc.id,from:'FRA',to:'CDG',departure:w.flightActualArrival(lateInbound)+35*60_000,fare:{economy:120,business:300,first:600}});
    lateInbound.manualDelayMin=75;
    w.recalculateOperations();
    w.refreshAll(); await wait(120);
    assert(w.lateInboundStatusForFlight(lateOutbound).active,'controlled rotation did not derive a late inbound warning');
    assert(d.querySelector('#schedule-board .connection-line.late-inbound'),'late-inbound connector is not highlighted');
    assert(d.querySelector('#schedule-board .connection-label.late-inbound'),'late-inbound connector label is not highlighted');
    w.eval('state.ops.automaticDisruptions=false');
    const weatherAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'DXB');
    const weatherFlight=w.createFlightRecord({aircraftId:weatherAc.id,from:'DXB',to:'DOH',departure:w.simNow()-30*60_000,fare:{economy:140,business:360,first:700}});
    weatherFlight.departureLogged=true;
    weatherFlight.actualDeparture=w.simNow()-30*60_000;
    weatherFlight.actualArrival=w.simNow()+65*60_000;
    weatherFlight.enrouteChecked=true;
    weatherFlight.weatherLiveChecks={period:Math.floor(w.simNow()/(30*60_000)),routeApplied:true,destinationChecked:true,lightningApplied:true};
    w.refreshAll(); await wait(120);
    w.settleSelectedFlight(weatherFlight.id); await wait(120);
    assert(!d.querySelector('#routeDetailStrip'),'center route detail strip should not be rendered');
    const leftWeather=d.querySelector(`[data-left-flight-details="${weatherFlight.id}"] .flight-weather-forecast`);
    assert(leftWeather,'selected flight details do not show forecast weather');
    assert(leftWeather.textContent.includes('Forecast weather')&&leftWeather.textContent.includes('Route')&&leftWeather.textContent.includes('DOH'),'flight weather forecast is missing route or destination context');
    w.eval(`knownActionableIncidentIds=actionableIncidentIdSet(); incidentSoundInitialized=true; window.__incidentDingStarts=1;`);
    w.refreshAll(); await wait(250);
    assert(w.__incidentDingStarts===1,'existing actionable incident played repeated alert dings');
    w.eval(`window.__testAudioState='suspended'; playIncidentDing(); window.__testAudioState='running';`);
    await w.armIncidentDing(); await wait(50);
    assert(w.__incidentDingStarts===1,'blocked incident ding replayed later on user interaction');
    const loopAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'DXB');
    const loopFlight=w.createFlightRecord({aircraftId:loopAc.id,from:'DXB',to:'DOH',departure:w.simNow()+60*60_000,fare:{economy:120,business:300,first:600}});
    loopFlight.weatherChecked=true;
    loopFlight.constraintChecked=true;
    const loopIncident=w.createIncident('fueling_issue',loopFlight,{training:true});
    assert(loopIncident,'loop incident scenario was not created');
    w.save();
    await wait(250);
    assert(w.__incidentDingStarts===2,'live-loop actionable incident did not play an alert ding');
    loopIncident.status='resolved';
    loopIncident.blocking=false;
    loopIncident.resolvedAt=w.simNow();
    loopFlight.cancelled=true;
    w.eval(`state.incidents.filter(item=>item.flightId==='${loopFlight.id}'&&item.status==='open').forEach(item=>{
      item.status='resolved'; item.blocking=false; item.resolvedAt=simNow(); item.automaticResolution=true;
      incidentTasks(item.id).forEach(task=>{ if(!['completed','cancelled'].includes(task.status)) task.status='cancelled'; });
    })`);
    w.save();
    w.refreshAll(); await wait(80);
    assert(!d.querySelector('[data-rail-widget="upcomingFlights"]'),'upcoming flight widget should be removed from the left rail');
    assert(d.querySelector(`#schedule-board [data-flight-id="${flight.id}"]`),'upcoming flight was not rendered in schedule');
    assert(d.querySelectorAll('.operations-rail [data-rail-widget]').length===2,'left rail should only show active flights and aircraft widgets');
    assert(d.querySelector('[data-toggle-rail="activeFlights"]'),'active flight widget header is not collapsible');
    assert(d.querySelector('[data-toggle-rail="aircraft"]'),'aircraft widget header is not collapsible');
    d.querySelector('[data-toggle-rail="activeFlights"]').click(); await wait(50);
    assert(d.querySelector('#rail-body-activeFlights').hidden,'active widget did not collapse');
    d.querySelector('[data-toggle-rail="activeFlights"]').click(); await wait(50);
    assert(!d.querySelector('#rail-body-activeFlights').hidden,'active widget did not reopen');
    assert(!d.querySelector('#aircraftList .list-reason'),'flight-only crew incident was duplicated on the aircraft row');
    assert(!d.querySelector('#attentionList'),'a separate attention list exists');
    const activeAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'AMS');
    const activeFlight=w.createFlightRecord({aircraftId:activeAc.id,from:'AMS',to:'CDG',departure:w.simNow()-45*60_000,fare:{economy:140,business:360,first:700}});
    activeFlight.departureLogged=true;
    activeFlight.actualDeparture=activeFlight.departure;
    activeFlight.actualArrival=w.simNow()+75*60_000;
    activeFlight.operationalDurationMs=activeFlight.actualArrival-activeFlight.actualDeparture;
    activeFlight.fueled=true;
    activeFlight.fuelOnboardAtDeparture=5200;
    activeFlight.tripFuelGallons=3200;
    activeFlight.fuelReserveGallons=900;
    w.refreshAll(); await wait(120);
    assert(d.querySelector('#activeFlightList .active-progress'),'active flight list does not show flight progress');
    d.querySelector(`#activeFlightList [data-next-flight="${activeFlight.id}"]`).click(); await wait(120);
    assert(d.querySelector(`#activeFlightList [data-left-flight-details="${activeFlight.id}"] .fuel-progress`),'active flight details do not show fuel remaining progress');
    assert(d.querySelector(`#activeFlightList [data-left-flight-details="${activeFlight.id}"] .crew-duty-progress`),'active flight details do not show crew duty progress');
    d.querySelector(`#activeFlightList [data-next-flight="${activeFlight.id}"]`).click(); await wait(100);
    assert(!d.querySelector(`#activeFlightList [data-left-flight-details="${activeFlight.id}"]`),'clicking the selected active flight did not close inline details');
    assert(!d.querySelector('[data-desk-widget="airports"]'),'airports widget should not be rendered');
    const watchAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const watchFlight=w.createFlightRecord({aircraftId:watchAc.id,from:'FRA',to:'CDG',departure:w.simNow()+48*60*60_000,fare:{economy:140,business:360,first:700}});
    const watchIncident=w.createIncident('aircraft_late_inbound',watchFlight,{training:true,detectedAt:w.simNow()});
    assert(!watchIncident,'late inbound should not be creatable as a standalone incident');
    w.refreshAll(); await wait(100);
    assert(d.querySelector('[data-incident-filter="actionable"].active'),'incident widget does not default to actionable triage');
    assert(Number(d.querySelector('[data-incident-filter="actionable"] b')?.textContent||0)>=1,'actionable incident count should include current operational cases');
    assert(Number(d.querySelector('[data-incident-filter="all"] b')?.textContent||0)>=1,'all incident count is wrong');
    assert(!d.querySelector('[data-desk-widget="incidents"]')?.textContent.includes('Aircraft late inbound'),'late inbound leaked into incident triage');
    assert(!d.querySelector('[data-desk-widget="planning"] .desk-active-task-section'),'dispatch widget should not duplicate incident tasks');
    w.settleSelectedFlight(flight.id); await wait(80);
    assert(d.querySelector('#contextPane').hidden,'separate selected-details pane should stay hidden');
    assert(d.querySelector(`[data-dispatch-occ-flight="${flight.id}"]`),'selected upcoming flight did not populate dispatch OCC actions');
    assert(!d.querySelector('[data-cancel-next-flight]'),'left flight card still exposes a cancel-flight action');
    assert(d.querySelector('[data-desk-widget="planning"] .occ-actions-section'),'dispatch widget does not show OCC actions');
    assert(d.querySelector(`[data-occ-delay-flight="${flight.id}"][data-delay-min="15"]`),'manual +15 hold action is missing');
    d.querySelector(`[data-occ-delay-flight="${flight.id}"][data-delay-min="15"]`).click(); await wait(120);
    assert(flight.manualDelayMin>=15,'manual OCC hold did not add departure delay');
    assert(d.querySelector(`[data-flight-id="${flight.id}"].shifted`),'shifted flight does not render the actual schedule bar');
    assert(d.querySelector(`[data-flight-id="${flight.id}"].shifted`)?.textContent.includes(w.shortClock(w.flightActualDeparture(flight))),'shifted schedule card did not repaint to the new departure time');
    assert(d.querySelector('#schedule-board.has-selected-flight .flight-block.selected'),'selected schedule flight is not visually focused');
    d.querySelector('#schedule-board').dispatchEvent(new MouseEvent('click',{bubbles:true}));
    await wait(80);
    assert(!d.querySelector('#schedule-board.has-selected-flight'),'clicking empty schedule space did not clear selected flight focus');
    w.settleSelectedFlight(flight.id); await wait(80);
    assert(d.querySelector(`[data-flight-id="${flight.id}"].shifted .flight-times`)?.textContent.includes('S '),'shifted flight does not show planned timing inside the single bar');
    assert(d.querySelector(`[data-flight-id="${flight.id}"].shifted .flight-times`)?.textContent.includes('A '),'shifted flight does not show actual timing inside the single bar');
    assert(d.querySelector(`#schedule-board .planned-flight-block[data-flight-id="${flight.id}"]`),'shifted flight does not show the planned ghost box');
    assert(!d.querySelector('#schedule-board .planned-flight-reference'),'schedule should not render a second planned lane');
    assert(d.querySelector(`[data-dispatch-occ-flight="${flight.id}"] [data-occ-swap-aircraft]`),'manual swap selector is missing despite an available spare');
    d.querySelector(`[data-dispatch-occ-flight="${flight.id}"] [data-occ-swap-aircraft]`).value=spare.id;
    d.querySelector(`[data-occ-swap-flight="${flight.id}"]`).click(); await wait(120);
    assert(flight.aircraftId===spare.id,'manual OCC swap did not assign the selected spare aircraft');
    assert(incident.aircraftId===spare.id,'open incident did not follow the manually swapped aircraft');
    assert(!d.querySelector(`[data-occ-cancel-flight="${flight.id}"]`),'dispatch should not expose a general cancel-flight action');
    const shellBg=getComputedStyle(d.querySelector('.operations-rail')).backgroundColor;
    assert(getComputedStyle(d.querySelector('.topbar')).backgroundColor===shellBg,'top bar background does not match the side panels');
    assert(getComputedStyle(d.querySelector('#center-workspace')).backgroundColor===shellBg,'center workspace background does not match the side panels');
    assert(getComputedStyle(d.querySelector('.context-rail')).backgroundColor===shellBg,'right rail background does not match the left rail');
    assert(getComputedStyle(d.querySelector('.schedule-toolbar')).backgroundColor===shellBg,'schedule toolbar background does not match the shell');
    assert(d.querySelector('#resetTopbarBtn')?.getAttribute('aria-label')==='Reset local state','topbar reset icon is missing');
    const mapRect=d.querySelector('#map-pane').getBoundingClientRect();
    const firstLeftWidget=d.querySelector('.operations-rail [data-rail-widget]').getBoundingClientRect();
    const firstRightWidget=d.querySelector('#deskStack .occ-board-widget').getBoundingClientRect();
    assert(Math.abs(mapRect.top-firstLeftWidget.top)<=2,'map is not top-aligned with the first left widget');
    assert(Math.abs(mapRect.top-firstRightWidget.top)<=2,'map is not top-aligned with the first right widget');
    assert(parseFloat(getComputedStyle(d.querySelector('#map-pane')).borderTopLeftRadius)>=7,'map pane does not have rounded corners');
    assert(d.querySelector('#deskStack')?.closest('.context-rail'),'OCC actions are not in the right operations rail');
    w.eval(`setActiveIncidentCase('${incident.id}')`);
    w.refreshAll(); await wait(100);
    assert(d.querySelectorAll('#deskStack .occ-board-widget').length===5,'the right rail does not show the expected department desk stack');
    assert(!d.querySelector('#deskStack > .occ-board-header'),'right rail still has a wrapper-style OCC header box');
    assert(d.querySelector('[data-desk-widget="incidents"] [data-incident-case]'),'open incident case is not visible');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-console.expanded'),'open incident is not expanded as a case console');
    assert(!d.querySelector('[data-desk-widget="incidents"] [data-open-case]'),'incident cards should not require a separate open-case link');
    assert(!Array.from(d.querySelectorAll('[data-desk-widget="incidents"] .case-console-section h2')).some(node=>node.textContent.includes('Recovery path')),'incident case still shows a duplicate recovery path section');
    assert(!d.querySelector('[data-case-plan]'),'incident case still exposes non-executable recovery path choices');
    assert(!Array.from(d.querySelectorAll('[data-desk-widget="incidents"] .case-console-section h2')).some(node=>node.textContent.includes('Required gates')),'incident case still shows required gates');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-active-task [data-inline-task] .inline-task-action'),'incident case does not expose the active task controls');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-active-task [data-task-action="replace"]'),'incident case does not expose crew recovery as the active branch decision');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-active-task .choice-consequence')?.textContent.includes('local replacement'),'incident option consequences are not shown in the active task');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-step-list'),'incident case coordination chain is missing');
    assert(!d.querySelector('[data-desk-widget="incidents"] .case-log-row'),'incident case log should not be shown');
    assert(!d.querySelector('[data-desk-widget="incidents"] .case-current-task'),'incident case still sends work to another department');
    assert(!d.querySelector('[data-task-link-action]'),'incident-only desk action links should not be rendered');
    assert(!d.querySelector('[data-desk-widget="personnel"] .desk-active-task-section'),'personnel widget should not duplicate incident tasks');
    assert(!d.querySelector('[data-desk-widget="maintenance"] .desk-active-task-section'),'maintenance widget should not duplicate incident tasks');
    assert(d.querySelector('[data-desk-widget="maintenance"] .maintenance-condition .progress-track'),'maintenance widget does not show aircraft condition as a progress bar');
    assert(d.querySelector('[data-desk-widget="maintenance"]'),'maintenance desk is missing');
    assert(!d.querySelector('[data-desk-widget="communications"]'),'communications desk should not be shown as a standalone widget');
    assert(d.querySelector('[data-desk-widget="connections"]'),'connections desk is missing');
    assert(!d.querySelector('[data-desk-widget="airports"]'),'airports desk should not be shown');
    assert(d.querySelector('#weatherStrip .weather-chip'),'airport weather strip is missing');
    assert(d.querySelector('#weatherStrip .weather-chip')?.getAttribute('title')?.includes('ceiling'),'airport weather strip does not expose rich weather details');
    assert(d.querySelector('#map.maplibregl-map canvas'),'MapLibre map canvas is missing');
    assert(d.querySelectorAll('#deskStack .occ-widget-header .info-tip').length===5,'department widget helper labels are not behind info tooltips');
    assert(!d.querySelector('#deskStack .occ-widget-header>div>span:not(.info-tip)'),'department widget eyebrow labels are still visible');
    const widgetStyle=getComputedStyle(d.querySelector('#deskStack .occ-board-widget'));
    assert(widgetStyle.backgroundColor!=='rgba(0, 0, 0, 0)','department widgets do not have a boxed background');
    assert(getComputedStyle(d.querySelector('.context-rail')).backgroundColor!==widgetStyle.backgroundColor,'right rail gutter and widget boxes use the same background');
    const rightWidgets=Array.from(d.querySelectorAll('#deskStack .occ-board-widget')).map(node=>node.getBoundingClientRect());
    assert(rightWidgets[1].top-rightWidgets[0].bottom>=10,'right widgets do not have visible vertical margin');
    const leftWidgetStyle=getComputedStyle(d.querySelector('.operations-rail [data-rail-widget]'));
    assert(getComputedStyle(d.querySelector('.operations-rail')).backgroundColor!==leftWidgetStyle.backgroundColor,'left rail gutter and widget boxes use the same background');
    const leftWidgets=Array.from(d.querySelectorAll('.operations-rail [data-rail-widget]')).map(node=>node.getBoundingClientRect());
    assert(leftWidgets[1].top-leftWidgets[0].bottom>=10,'left widgets do not have visible vertical margin');
    assert(getComputedStyle(d.querySelector('.context-rail')).borderLeftColor==='rgba(0, 0, 0, 0)','right rail divider line is still visible');
    assert(!d.querySelector('[data-desk-widget="dispatch"]'),'duplicate dispatch flight board still exists');
    assert(!d.querySelector('[data-desk-widget="fleet"]'),'duplicate fleet rotations board still exists');
    assert(!d.querySelector('.occ-flight-row'),'a duplicate right-side flight row still exists');
    assert(!d.querySelector('#deskWorkbench'),'obsolete desk workbench still exists');
    assert(!d.querySelector('.desk-tab'),'obsolete OCC tabs still exist');
    assert(!d.querySelector('[data-open-desk]'),'an OCC widget still requires an open button');
    assert(d.querySelector('[data-desk-panel="planning:planning"]'),'plan-flight action button is missing');
    assert(d.querySelector('[data-desk-panel="planning:remove-schedule"]'),'remove-schedule action link is missing');
    assert(!d.querySelector('[data-desk-panel="planning:slots"]'),'dispatch should not expose manual slot request action');
    assert(d.querySelector('[data-desk-panel="personnel:personnel"]'),'request-personnel action button is missing');
    assert(d.querySelector('[data-desk-panel="maintenance:maintenance"]'),'schedule-maintenance action button is missing');
    assert(!Array.from(d.querySelectorAll('#deskStack .desk-action-link')).some(node=>/ATC|Diversion|Connection|release|Cancel flight|Crew recovery|Inspect defect|Set disposition|Station recovery|Alternate handling|replacement aircraft/i.test(node.textContent)),'incident-only shortcuts are still shown in widget action bars');
    assert(!d.querySelector('[data-desk-panel="planning:spares"]'),'list-only spare action should not be hidden behind a link');
    assert(!d.querySelector('[data-desk-panel="personnel:stations"]'),'station staffing list should not be hidden behind a link');
    assert(!d.querySelector('[data-desk-panel="maintenance:condition"]'),'aircraft condition list should not be hidden behind a link');
    assert(!d.querySelector('[data-desk-panel="airports:alternates"]'),'alternate list should not be hidden behind a link');
    assert(!Array.from(d.querySelectorAll('#deskStack .desk-section h2')).some(node=>node.textContent.includes('Next action')),'department widgets still show the old next-action section');
    assert(!d.querySelector('.next-action'),'old next-action copy is still visible');
    assert(!d.querySelector('[data-desk-widget="planning"] [data-management-content="planning"]'),'planning form is visible before opening its action');
    const removableAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const removableDeparture=w.simNow()+9*60*60_000;
    const removableOutbound=w.estimateFlight('FRA','AMS',removableAc,{economy:140,business:360,first:700},{departure:removableDeparture});
    const removableReturnDeparture=removableDeparture+removableOutbound.duration+90*60_000;
    const removableService={id:'SCH_REMOVE',aircraftId:removableAc.id,from:'FRA',to:'AMS',fare:140,fares:{economy:140,business:360,first:700},rule:'daily',turnaroundMin:90,firstDeparture:removableDeparture,firstReturnDeparture:removableReturnDeparture,nextDeparture:removableDeparture+24*60*60_000,originSlotRightId:'',destinationSlotRightId:'',lastGeneratedDeparture:removableDeparture,active:true,createdAt:w.simNow()};
    w.eval(`state.services.push(${JSON.stringify(removableService)})`);
    const removableOut=w.createFlightRecord({aircraftId:removableAc.id,from:'FRA',to:'AMS',departure:removableDeparture,fare:removableService.fares,serviceId:removableService.id,serviceLeg:'outbound'});
    const removableRet=w.createFlightRecord({aircraftId:removableAc.id,from:'AMS',to:'FRA',departure:removableReturnDeparture,fare:removableService.fares,serviceId:removableService.id,serviceLeg:'return'});
    w.save(); w.refreshAll(); await wait(100);
    d.querySelector('[data-desk-panel="planning:remove-schedule"]').click(); await wait(80);
    const removalSelect=d.querySelector('[data-remove-schedule-select]');
    assert(removalSelect,'remove-schedule selector did not open');
    assert(Array.from(removalSelect.options).some(option=>option.value==='service:SCH_REMOVE'),'recurring schedule is missing from remove-schedule selector');
    removalSelect.value='service:SCH_REMOVE';
    w.confirm=()=>true;
    d.querySelector('[data-remove-schedule]').click(); await wait(140);
    assert(!w.eval(`state.services.find(service=>service.id==='SCH_REMOVE')?.active`),'removed recurring schedule is still active');
    assert(!w.eval(`state.flights.some(item=>['${removableOut.id}','${removableRet.id}'].includes(item.id))`),'future recurring schedule legs were not removed');
    d.querySelector('[data-toggle-desk="planning"]').click(); await wait(80);
    assert(d.querySelector('#occ-body-planning').hidden,'clicking the planning widget header did not collapse it');
    d.querySelector('[data-toggle-desk="planning"]').click(); await wait(80);
    assert(!d.querySelector('#occ-body-planning').hidden,'clicking the planning widget header did not reopen it');
    d.querySelector('[data-desk-panel="planning:planning"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="planning"] [data-management-content="planning"]'),'planning controls are not mounted after opening the action');
    d.querySelector('[data-desk-panel="planning:aircraft"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="planning"] [data-management-content="aircraft"]')&&!d.querySelector('[data-desk-widget="planning"] [data-management-content="planning"]'),'aircraft request action did not replace the planning panel');
    assert(getComputedStyle(d.querySelector('[data-desk-widget="planning"] [data-occ-page-host="aircraft"] .data-section')).display==='none','fleet inventory is duplicated in resource controls');
    assert(!d.querySelector('#managementCabinFirst')&&!d.querySelector('#managementCabinBusiness'),'aircraft request form still exposes cabin configuration');
    assert(d.querySelector('#managementAircraftDelivery'),'aircraft request form does not expose delivery airport');
    d.querySelector('#managementAircraftDelivery').value='CDG';
    d.querySelector('#managementAircraftDelivery').dispatchEvent(new Event('input',{bubbles:true}));
    const aircraftBefore=w.eval('state.aircraft.length'),resourceRequestsBefore=w.eval('state.resourceRequests.length');
    d.querySelector('#requestAircraftButton').click(); await wait(120);
    assert(w.eval(`state.aircraft.length>${aircraftBefore} ? state.aircraft[state.aircraft.length-1]?.location==='CDG' : state.resourceRequests.length>${resourceRequestsBefore} && state.resourceRequests[state.resourceRequests.length-1]?.location==='CDG'`),'aircraft request was not routed to the selected delivery airport');
    assert(d.querySelector('#homeBaseSelect'),'topbar home-base selector is missing');
    d.querySelector('#homeBaseSelect').value='LHR';
    d.querySelector('#homeBaseSelect').dispatchEvent(new Event('change',{bubbles:true}));
    await wait(120);
    assert(w.eval(`state.home==='LHR'`),'topbar home-base selector did not update state.home');
    assert(d.querySelector('#managementAircraftDelivery')?.value==='LHR','aircraft delivery default did not follow the new home base');
    assert(!Array.from(d.querySelectorAll('[data-desk-widget="planning"] .desk-section h2')).some(node=>node.textContent.includes('External replies')),'dispatch widget should not show external replies');
    d.querySelector('[data-desk-panel="personnel:personnel"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="personnel"] [data-management-content="personnel"]'),'personnel request controls are not mounted after opening the action');
    d.querySelector('[data-desk-panel="personnel:relocation"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="personnel"] [data-management-content="relocation"]'),'relocation controls are not mounted after opening the action');
    d.querySelector('[data-desk-panel="maintenance:maintenance"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="maintenance"] [data-management-content="maintenance"]'),'maintenance controls are not mounted after opening the action');
    const openedTask=d.querySelector('[data-desk-widget="incidents"] .case-active-task [data-inline-task]');
    assert(openedTask?.querySelector('.inline-task-action'),'crew workflow controls are not shown directly in the incident widget');
    const openedTaskId=openedTask?.dataset.inlineTask;
    const resolveControl=openedTask?.querySelector('[data-task-action="replace"]');
    assert(resolveControl,'incident crew workflow does not expose a resolver control');
    resolveControl.click(); await wait(160);
    assert(!d.querySelector(`[data-inline-task="${CSS.escape(openedTaskId)}"]`),'resolved crew workflow task did not close');
    assert(w.eval('workspaceUi.nextActiveIncidentId')===incident.id,'incident queue advanced before the same case exposed its next ready task');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-active-task')?.textContent.includes('Allocate replacement crew'),'incident case did not advance from crew strategy to crew allocation');
    const allocateControl=d.querySelector('[data-desk-widget="incidents"] .case-active-task [data-task-action="allocate"]');
    assert(allocateControl,'crew allocation action is missing after selecting the recovery branch');
    allocateControl.click(); await wait(160);
    assert(w.eval('workspaceUi.nextActiveIncidentId')===incident.id,'incident case selection did not stay on the current case after allocation');
    assert(d.querySelector('[data-desk-widget="planning"] .page-heading .info-tip'),'embedded planning helper is missing its info tooltip');
    assert(getComputedStyle(d.querySelector('[data-desk-widget="planning"] .page-heading p')).display==='none','embedded planning helper copy is still visible');
    assert(d.querySelector('[data-desk-widget="personnel"] .desk-list-row')?.textContent.includes('captains'),'personnel desk does not show station staffing');
    assert(!d.querySelector('[data-desk-panel^="airports:"]'),'airports widget actions should not exist');
    const autoAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    w.changeStaff('FRA','operations',2);
    const autoFlight=w.createFlightRecord({aircraftId:autoAc.id,from:'FRA',to:'AMS',departure:w.simNow()+2*60*60_000,fare:{economy:140,business:360,first:700}});
    const autoIncident=w.createIncident('atc_restriction',autoFlight,{training:true});
    w.eval(`workspaceUi.incidentFilter='all'; setActiveIncidentCase('${autoIncident.id}')`);
    w.refreshAll(); await wait(100);
    assert(!d.querySelector(`[data-incident-case="${autoIncident.id}"] [data-open-case]`),'new incident card still renders an open-case link');
    const autoAccept=d.querySelector(`[data-incident-case="${autoIncident.id}"] [data-task-action="accept"]`);
    assert(autoAccept&&!autoAccept.disabled,'single-click ATC accept action is not available');
    autoAccept.click();
    await wait(180);
    assert(autoIncident.status==='resolved','single-click strategy did not auto-run the determined follow-up task');
    assert(autoFlight.incidentDelayMin===45,'single-click ATC accept did not apply the expected delay');
    assert(!d.querySelector('[data-handle-incident]')&&!d.querySelector('[data-summary-task]')&&!d.querySelector('[data-full-flight]'),'left flight overview still exposes a separate details/task button');
    assert(d.querySelector('#scheduleType option[value="ferry"]'),'ferry planning is not available in the inline planner');
    assert(!d.querySelector('[data-desk-widget="personnel"] [data-inline-task].focused'),'resolved flight task reopened or stayed focused');
    w.settleSelected(ac.id); await wait(80);
    assert(d.querySelector('#aircraftList [data-left-aircraft-details]'),'aircraft selection did not open inline aircraft details');
    assert(d.querySelector('#aircraftList [data-left-aircraft-details]')?.closest('[data-left-card-aircraft]'),'aircraft details are not contained by the selected aircraft card');
    assert(d.querySelector('#aircraftList [data-left-aircraft-details]')?.textContent.includes(ac.tail)||d.querySelector('#aircraftList .list-row.selected')?.textContent.includes(ac.tail),'map-style aircraft selection did not update left-side information');
    assert(d.querySelectorAll('#deskStack .occ-board-widget').length===5,'aircraft selection rebuilt or hid the OCC board');
    assert(d.querySelector('#managementView').hidden,'legacy management workspace became visible');
    assert(d.querySelector('#map.maplibregl-map'),'shared map did not initialize');
    assert(d.querySelector('#schedule-board .sched-aircraft-row'),'shared schedule did not initialize');
    const visual=new URLSearchParams(location.search).get('visual');
    if(visual==='board'){
      d.querySelector('.context-rail').scrollTop=0;
      await wait(100);
    }else if(visual==='incidents'){
      w.openDesk('incidents');
      await wait(100);
    }else if(visual==='details'){
      w.settleSelectedFlight(flight.id);
      w.refreshAll();
      await wait(100);
    }else if(visual){
      w.settleSelectedFlight(flight.id);
      w.refreshAll();
      await wait(100);
    }else{
      const ac2=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      assert(ac2?.id,'second aircraft was not assigned for scheduler personnel test');
      const personnelDeparture=w.simNow()+2*60*60_000;
      const personnelEstimate=w.estimateFlight('FRA','AMS',ac2,{economy:140,business:360,first:700},{departure:personnelDeparture});
      w.requestPersonnelDeficitsForFlight(ac2,personnelDeparture,personnelEstimate.duration,'FRA');
      w.createFlightRecord({aircraftId:ac2.id,from:'FRA',to:'AMS',departure:personnelDeparture,fare:{economy:140,business:360,first:700}});
      w.save();
      const saved=JSON.parse(w.localStorage.getItem('aerosim_mvp_v6'));
      const scheduled=saved.flights.find(item=>item.aircraftId===ac2.id&&item.from==='FRA'&&item.to==='AMS'&&!item.cancelled);
      const family='Airbus A320 family';
      assert(scheduled,'scheduleFlight did not create the requested flight');
      assert(w.qualifiedStaffAt('FRA','captains',family)>=1,'scheduleFlight did not auto-provision a qualified captain');
      assert(w.qualifiedStaffAt('FRA','firstOfficers',family)>=1,'scheduleFlight did not auto-provision a qualified first officer');
      assert(w.staffAt('FRA','cabinCrew')>=4,'scheduleFlight did not auto-provision cabin crew');
      assert(w.staffAt('FRA','groundHandling')>=4,'scheduleFlight did not auto-provision ground handling');
    }
    result.textContent=`PASS\nflight=${flight.id}\nincident=${incident.id}\nnew_ui=department-desks+action-panels`;
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
