<!doctype html>
<meta charset="utf-8">
<title>AeroSim Next UI browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../aerosim-next.html?fixture=next-ui&cache='+Date.now();
    await loaded;
    if(typeof frame.contentWindow.resetLocalSave==='function') frame.contentWindow.resetLocalSave();
    else{
      frame.contentWindow.localStorage.removeItem('aerosim_mvp_v6');
      frame.contentWindow.localStorage.removeItem('aerosim_occ_ui_v1');
    }
    const cleanLoaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../aerosim-next.html?fixture=next-ui&cache='+Date.now();
    await cleanLoaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    const ac=w.requestAircraft('A320neo');
    const departure=w.simNow()+4*60*60_000;
    const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure,fare:{economy:140,business:360,first:700}});
    const spare=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    w.changeStaff('FRA','captains',2);
    w.changeStaff('FRA','firstOfficers',2);
    w.changeQualification('FRA','captains','Airbus A320 family',2);
    w.changeQualification('FRA','firstOfficers','Airbus A320 family',2);
    w.refreshAll(); await wait(80);
    assert(!d.querySelector('#taskInboxButton'),'Tasks still appears in the top bar');
    assert(!d.querySelector('[data-workspace="management"]'),'Planning & resources still appears in the top bar');
    assert(d.querySelector('[data-training-incident]'),'training incident control is missing');
    const incident=w.createIncident('crew_sick',flight,{training:true});
    incident.affectedRole='captains';
    w.save();
    w.refreshAll(); await wait(100);
    assert(incident?.training,'training scenario was not created');
    w.refreshAll(); await wait(250);
    assert(d.querySelectorAll('#upcomingFlightList [data-next-flight]').length===1,'upcoming flight was not rendered');
    assert(d.querySelectorAll('.operations-rail [data-rail-widget]').length===3,'left rail does not use three separate widgets');
    assert(d.querySelector('[data-toggle-rail="activeFlights"]'),'active flight widget header is not collapsible');
    assert(d.querySelector('[data-toggle-rail="upcomingFlights"]'),'upcoming flight widget header is not collapsible');
    assert(d.querySelector('[data-toggle-rail="aircraft"]'),'aircraft widget header is not collapsible');
    d.querySelector('[data-toggle-rail="activeFlights"]').click(); await wait(50);
    assert(d.querySelector('#rail-body-activeFlights').hidden,'active widget did not collapse');
    d.querySelector('[data-toggle-rail="activeFlights"]').click(); await wait(50);
    assert(!d.querySelector('#rail-body-activeFlights').hidden,'active widget did not reopen');
    assert(d.querySelector('#upcomingFlightList .list-reason')?.textContent.includes('Crew'),'incident reason is not visible in flight list');
    assert(d.querySelectorAll('#upcomingFlightList .list-readiness i').length===3,'flight readiness was not consolidated into the flight row');
    assert(d.querySelector('#flightListCount')?.textContent==='1','combined flight overview count is incorrect');
    assert(!d.querySelector('#aircraftList .list-reason'),'flight-only crew incident was duplicated on the aircraft row');
    assert(!d.querySelector('#attentionList'),'a separate attention list exists');
    d.querySelector('#upcomingFlightList [data-next-flight]').click(); await wait(80);
    assert(d.querySelector('#contextPane').hidden,'separate selected-details pane should stay hidden');
    assert(d.querySelector('#upcomingFlightList [data-left-flight-details]'),'flight details did not open inside the selected left widget');
    assert(d.querySelector('#upcomingFlightList [data-left-flight-details]')?.closest('[data-left-card-flight]'),'flight details are not contained by the selected flight card');
    assert(!d.querySelector('[data-cancel-next-flight]'),'left flight card still exposes a cancel-flight action');
    assert(d.querySelector('[data-desk-widget="planning"] .occ-actions-section'),'dispatch widget does not show OCC actions');
    assert(d.querySelector(`[data-occ-delay-flight="${flight.id}"][data-delay-min="15"]`),'manual +15 hold action is missing');
    d.querySelector(`[data-occ-delay-flight="${flight.id}"][data-delay-min="15"]`).click(); await wait(120);
    assert(flight.manualDelayMin>=15,'manual OCC hold did not add departure delay');
    assert(d.querySelector(`[data-dispatch-occ-flight="${flight.id}"] [data-occ-swap-aircraft]`),'manual swap selector is missing despite an available spare');
    d.querySelector(`[data-dispatch-occ-flight="${flight.id}"] [data-occ-swap-aircraft]`).value=spare.id;
    d.querySelector(`[data-occ-swap-flight="${flight.id}"]`).click(); await wait(120);
    assert(flight.aircraftId===spare.id,'manual OCC swap did not assign the selected spare aircraft');
    assert(incident.aircraftId===spare.id,'open incident did not follow the manually swapped aircraft');
    assert(d.querySelector(`[data-occ-cancel-flight="${flight.id}"]`),'dispatch cancel action is missing');
    const shellBg=getComputedStyle(d.querySelector('.operations-rail')).backgroundColor;
    assert(getComputedStyle(d.querySelector('.topbar')).backgroundColor===shellBg,'top bar background does not match the side panels');
    assert(getComputedStyle(d.querySelector('#center-workspace')).backgroundColor===shellBg,'center workspace background does not match the side panels');
    assert(getComputedStyle(d.querySelector('.context-rail')).backgroundColor===shellBg,'right rail background does not match the left rail');
    assert(getComputedStyle(d.querySelector('.schedule-toolbar')).backgroundColor===shellBg,'schedule toolbar background does not match the shell');
    assert(d.querySelector('#resetTopbarBtn')?.getAttribute('aria-label')==='Reset local state','topbar reset icon is missing');
    const mapRect=d.querySelector('#map-pane').getBoundingClientRect();
    const firstLeftWidget=d.querySelector('.operations-rail [data-rail-widget]').getBoundingClientRect();
    const firstRightWidget=d.querySelector('#deskStack .occ-board-widget').getBoundingClientRect();
    assert(Math.abs(mapRect.top-firstLeftWidget.top)<=2,'map is not top-aligned with the first left widget');
    assert(Math.abs(mapRect.top-firstRightWidget.top)<=2,'map is not top-aligned with the first right widget');
    assert(parseFloat(getComputedStyle(d.querySelector('#map-pane')).borderTopLeftRadius)>=7,'map pane does not have rounded corners');
    assert(d.querySelector('#deskStack')?.closest('.context-rail'),'OCC actions are not in the right operations rail');
    assert(d.querySelector('#upcomingFlightList [data-left-flight-details] .attention-summary'),'incident is not shown inside inline flight details');
    assert(d.querySelector('#upcomingFlightList [data-left-flight-details] .fact-grid'),'inline flight facts are missing');
    assert(d.querySelectorAll('#deskStack .occ-board-widget').length===5,'the right rail does not show the expected department desk stack');
    assert(!d.querySelector('#deskStack > .occ-board-header'),'right rail still has a wrapper-style OCC header box');
    assert(d.querySelector('[data-desk-widget="incidents"] [data-incident-case]'),'open incident case is not visible');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-console.expanded'),'open incident is not expanded as a case console');
    assert(!Array.from(d.querySelectorAll('[data-desk-widget="incidents"] .case-console-section h2')).some(node=>node.textContent.includes('Recovery path')),'incident case still shows a duplicate recovery path section');
    assert(!d.querySelector('[data-case-plan]'),'incident case still exposes non-executable recovery path choices');
    assert(!Array.from(d.querySelectorAll('[data-desk-widget="incidents"] .case-console-section h2')).some(node=>node.textContent.includes('Required gates')),'incident case still shows required gates');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-active-task [data-inline-task] .inline-task-action'),'incident case does not expose the active task controls');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-active-task [data-task-action="replace"]'),'incident case does not expose crew recovery as the active branch decision');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-active-task .choice-consequence')?.textContent.includes('local replacement'),'incident option consequences are not shown in the active task');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-step-list'),'incident case coordination chain is missing');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-log-row'),'incident case log is missing');
    assert(!d.querySelector('[data-desk-widget="incidents"] .case-current-task'),'incident case still sends work to another department');
    assert(!d.querySelector('[data-task-link-action]'),'incident-only desk action links should not be rendered');
    assert(d.querySelector('[data-desk-widget="personnel"] .desk-active-task-section [data-inline-task] .inline-task-action'),'personnel widget does not show its active incident task directly');
    assert(d.querySelector('[data-desk-widget="maintenance"]'),'maintenance desk is missing');
    assert(!d.querySelector('[data-desk-widget="communications"]'),'communications desk should not be shown as a standalone widget');
    assert(d.querySelector('[data-desk-widget="airports"]'),'airports desk is missing');
    assert(d.querySelector('#weatherStrip .weather-chip'),'airport weather strip is missing');
    assert(d.querySelectorAll('#deskStack .occ-widget-header .info-tip').length===5,'department widget helper labels are not behind info tooltips');
    assert(!d.querySelector('#deskStack .occ-widget-header>div>span:not(.info-tip)'),'department widget eyebrow labels are still visible');
    const widgetStyle=getComputedStyle(d.querySelector('#deskStack .occ-board-widget'));
    assert(widgetStyle.backgroundColor!=='rgba(0, 0, 0, 0)','department widgets do not have a boxed background');
    assert(getComputedStyle(d.querySelector('.context-rail')).backgroundColor!==widgetStyle.backgroundColor,'right rail gutter and widget boxes use the same background');
    const rightWidgets=Array.from(d.querySelectorAll('#deskStack .occ-board-widget')).map(node=>node.getBoundingClientRect());
    assert(rightWidgets[1].top-rightWidgets[0].bottom>=10,'right widgets do not have visible vertical margin');
    const leftWidgetStyle=getComputedStyle(d.querySelector('.operations-rail [data-rail-widget]'));
    assert(getComputedStyle(d.querySelector('.operations-rail')).backgroundColor!==leftWidgetStyle.backgroundColor,'left rail gutter and widget boxes use the same background');
    const leftWidgets=Array.from(d.querySelectorAll('.operations-rail [data-rail-widget]')).map(node=>node.getBoundingClientRect());
    assert(leftWidgets[1].top-leftWidgets[0].bottom>=10,'left widgets do not have visible vertical margin');
    assert(getComputedStyle(d.querySelector('.context-rail')).borderLeftColor==='rgba(0, 0, 0, 0)','right rail divider line is still visible');
    assert(!d.querySelector('[data-desk-widget="dispatch"]'),'duplicate dispatch flight board still exists');
    assert(!d.querySelector('[data-desk-widget="fleet"]'),'duplicate fleet rotations board still exists');
    assert(!d.querySelector('.occ-flight-row'),'a duplicate right-side flight row still exists');
    assert(!d.querySelector('#deskWorkbench'),'obsolete desk workbench still exists');
    assert(!d.querySelector('.desk-tab'),'obsolete OCC tabs still exist');
    assert(!d.querySelector('[data-open-desk]'),'an OCC widget still requires an open button');
    assert(d.querySelector('[data-desk-panel="planning:planning"]'),'plan-flight action button is missing');
    assert(d.querySelector('[data-desk-panel="personnel:personnel"]'),'request-personnel action button is missing');
    assert(d.querySelector('[data-desk-panel="maintenance:maintenance"]'),'schedule-maintenance action button is missing');
    assert(!Array.from(d.querySelectorAll('#deskStack .desk-action-link')).some(node=>/ATC|Diversion|Connection|release|Cancel flight|Crew recovery|Inspect defect|Set disposition|Station recovery|Alternate handling|replacement aircraft/i.test(node.textContent)),'incident-only shortcuts are still shown in widget action bars');
    assert(!d.querySelector('[data-desk-panel="planning:spares"]'),'list-only spare action should not be hidden behind a link');
    assert(!d.querySelector('[data-desk-panel="personnel:stations"]'),'station staffing list should not be hidden behind a link');
    assert(!d.querySelector('[data-desk-panel="maintenance:condition"]'),'aircraft condition list should not be hidden behind a link');
    assert(!d.querySelector('[data-desk-panel="airports:alternates"]'),'alternate list should not be hidden behind a link');
    assert(!Array.from(d.querySelectorAll('#deskStack .desk-section h2')).some(node=>node.textContent.includes('Next action')),'department widgets still show the old next-action section');
    assert(!d.querySelector('.next-action'),'old next-action copy is still visible');
    assert(!d.querySelector('[data-desk-widget="planning"] [data-management-content="planning"]'),'planning form is visible before opening its action');
    d.querySelector('[data-toggle-desk="planning"]').click(); await wait(80);
    assert(d.querySelector('#occ-body-planning').hidden,'clicking the planning widget header did not collapse it');
    d.querySelector('[data-toggle-desk="planning"]').click(); await wait(80);
    assert(!d.querySelector('#occ-body-planning').hidden,'clicking the planning widget header did not reopen it');
    d.querySelector('[data-desk-panel="planning:planning"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="planning"] [data-management-content="planning"]'),'planning controls are not mounted after opening the action');
    d.querySelector('[data-desk-panel="planning:aircraft"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="planning"] [data-management-content="aircraft"]')&&!d.querySelector('[data-desk-widget="planning"] [data-management-content="planning"]'),'aircraft request action did not replace the planning panel');
    assert(getComputedStyle(d.querySelector('[data-desk-widget="planning"] [data-occ-page-host="aircraft"] .data-section')).display==='none','fleet inventory is duplicated in resource controls');
    d.querySelector('[data-desk-panel="planning:slots"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="planning"] [data-management-content="slots"]'),'slot request controls are not mounted after opening the action');
    d.querySelector('[data-desk-panel="personnel:personnel"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="personnel"] [data-management-content="personnel"]'),'personnel request controls are not mounted after opening the action');
    d.querySelector('[data-desk-panel="personnel:relocation"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="personnel"] [data-management-content="relocation"]'),'relocation controls are not mounted after opening the action');
    d.querySelector('[data-desk-panel="maintenance:maintenance"]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="maintenance"] [data-management-content="maintenance"]'),'maintenance controls are not mounted after opening the action');
    const openedTask=d.querySelector('[data-desk-widget="personnel"] .desk-active-task-section [data-inline-task]');
    assert(openedTask?.querySelector('.inline-task-action'),'crew workflow controls are not shown directly in the personnel widget');
    const openedTaskId=openedTask?.dataset.inlineTask;
    const resolveControl=openedTask?.querySelector('[data-task-action]');
    assert(resolveControl,'opened crew workflow does not expose a resolver control');
    resolveControl.click(); await wait(160);
    assert(!d.querySelector(`[data-inline-task="${CSS.escape(openedTaskId)}"]`),'resolved crew workflow task did not close');
    assert(d.querySelector('[data-desk-widget="incidents"] .case-active-task')?.textContent.includes('Allocate replacement crew'),'incident case did not advance from crew strategy to crew allocation');
    const allocateControl=d.querySelector('[data-desk-widget="incidents"] .case-active-task [data-task-action="allocate"]');
    assert(allocateControl,'crew allocation action is missing after selecting the recovery branch');
    allocateControl.click(); await wait(160);
    assert(d.querySelector('[data-desk-widget="incidents"] .case-active-task')?.textContent.includes('Replacement report'),'incident case did not advance to the next coordinated step');
    assert(d.querySelector('[data-desk-widget="planning"] .page-heading .info-tip'),'embedded planning helper is missing its info tooltip');
    assert(getComputedStyle(d.querySelector('[data-desk-widget="planning"] .page-heading p')).display==='none','embedded planning helper copy is still visible');
    assert(d.querySelector('[data-desk-widget="personnel"] .desk-list-row')?.textContent.includes('captains'),'personnel desk does not show station staffing');
    assert(d.querySelector('[data-desk-widget="airports"] .airport-ops-row')?.textContent.includes('handling'),'airports widget does not show airport operations');
    assert(!d.querySelector('[data-desk-widget="airports"] .airport-ops-row')?.textContent.includes('wind'),'airports widget still duplicates the weather brief');
    assert(!d.querySelector('[data-desk-panel="airports:brief"]'),'weather brief action should not exist in the airports widget');
    assert(!d.querySelector('[data-handle-incident]')&&!d.querySelector('[data-summary-task]')&&!d.querySelector('[data-full-flight]'),'left flight overview still exposes a separate details/task button');
    assert(d.querySelector('#scheduleType option[value="ferry"]'),'ferry planning is not available in the inline planner');
    assert(d.querySelector('[data-left-flight-details] .ground-overview'),'inline full ground progress is missing');
    assert(d.querySelector('[data-left-flight-details] .ground-task-list').hidden,'ground task details are expanded by default');
    d.querySelector('[data-left-flight-details] .ground-task-toggle').click();
    assert(!d.querySelector('[data-left-flight-details] .ground-task-list').hidden,'ground task disclosure does not expand');
    assert(!d.querySelector('[data-desk-widget="personnel"] [data-inline-task].focused'),'resolved flight task reopened or stayed focused');
    assert(d.querySelector('[data-left-flight-details]'),'flight information disappeared while working its task');
    w.settleSelected(ac.id); await wait(80);
    assert(d.querySelector('#aircraftList [data-left-aircraft-details]'),'aircraft selection did not open inline aircraft details');
    assert(d.querySelector('#aircraftList [data-left-aircraft-details]')?.closest('[data-left-card-aircraft]'),'aircraft details are not contained by the selected aircraft card');
    assert(d.querySelector('#aircraftList [data-left-aircraft-details]')?.textContent.includes(ac.tail)||d.querySelector('#aircraftList .list-row.selected')?.textContent.includes(ac.tail),'map-style aircraft selection did not update left-side information');
    assert(d.querySelectorAll('#deskStack .occ-board-widget').length===5,'aircraft selection rebuilt or hid the OCC board');
    assert(d.querySelector('#managementView').hidden,'legacy management workspace became visible');
    assert(d.querySelector('#map.leaflet-container'),'shared map did not initialize');
    assert(d.querySelector('#schedule-board .sched-aircraft-row'),'shared schedule did not initialize');
    const visual=new URLSearchParams(location.search).get('visual');
    if(visual==='board'){
      d.querySelector('.context-rail').scrollTop=0;
      await wait(100);
    }else if(visual==='incidents'){
      w.openDesk('incidents');
      await wait(100);
    }else if(visual==='details'){
      d.querySelector('#upcomingFlightList [data-next-flight]').click();
      await wait(100);
    }else if(visual){
      d.querySelector('#upcomingFlightList [data-next-flight]').click();
      await wait(100);
    }else{
      const ac2=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      assert(ac2?.id,'second aircraft was not assigned for scheduler personnel test');
      const personnelDeparture=w.simNow()+2*60*60_000;
      const personnelEstimate=w.estimateFlight('FRA','AMS',ac2,{economy:140,business:360,first:700},{departure:personnelDeparture});
      w.requestPersonnelDeficitsForFlight(ac2,personnelDeparture,personnelEstimate.duration,'FRA');
      w.createFlightRecord({aircraftId:ac2.id,from:'FRA',to:'AMS',departure:personnelDeparture,fare:{economy:140,business:360,first:700}});
      w.save();
      const saved=JSON.parse(w.localStorage.getItem('aerosim_mvp_v6'));
      const scheduled=saved.flights.find(item=>item.aircraftId===ac2.id&&item.from==='FRA'&&item.to==='AMS'&&!item.cancelled);
      const family='Airbus A320 family';
      assert(scheduled,'scheduleFlight did not create the requested flight');
      assert(w.qualifiedStaffAt('FRA','captains',family)>=1,'scheduleFlight did not auto-provision a qualified captain');
      assert(w.qualifiedStaffAt('FRA','firstOfficers',family)>=1,'scheduleFlight did not auto-provision a qualified first officer');
      assert(w.staffAt('FRA','cabinCrew')>=4,'scheduleFlight did not auto-provision cabin crew');
      assert(w.staffAt('FRA','groundHandling')>=4,'scheduleFlight did not auto-provision ground handling');
    }
    result.textContent=`PASS\nflight=${flight.id}\nincident=${incident.id}\nnew_ui=department-desks+action-panels`;
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
