<!doctype html>
<meta charset="utf-8">
<title>AeroSim Next UI browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../aerosim-next.html?fixture=next-ui';
    await loaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    const ac=w.requestAircraft('A320neo');
    const departure=w.simNow()+4*60*60_000;
    const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure,fare:{economy:140,business:360,first:700}});
    w.refreshAll(); await wait(80);
    assert(!d.querySelector('#taskInboxButton'),'Tasks still appears in the top bar');
    assert(!d.querySelector('[data-workspace="management"]'),'Planning & resources still appears in the top bar');
    assert(d.querySelector('[data-training-incident]'),'training incident control is missing');
    d.querySelector('[data-training-incident]').click(); await wait(100);
    const incident=w.openIncidentsForFlight(flight.id).find(item=>item.training);
    assert(incident?.training,'training scenario was not created');
    w.refreshAll(); await wait(250);
    assert(d.querySelectorAll('#upcomingFlightList [data-next-flight]').length===1,'upcoming flight was not rendered');
    assert(d.querySelector('#upcomingFlightList .list-reason')?.textContent.includes('Crew'),'incident reason is not visible in flight list');
    assert(!d.querySelector('#attentionList'),'a separate attention list exists');
    d.querySelector('#upcomingFlightList [data-next-flight]').click(); await wait(80);
    assert(d.querySelector('#contextPane')?.closest('.operations-rail'),'selected details are not in the left information rail');
    assert(d.querySelector('#deskStack')?.closest('.context-rail'),'OCC desks are not in the right operations rail');
    assert(d.querySelector('#contextPane .context-header h1')?.textContent.includes('FRA'),'flight context did not open');
    assert(d.querySelector('#contextPane .attention-summary'),'incident is not at top of flight details');
    assert(d.querySelector('#contextPane .compact-status-lines'),'compact operating summary is missing');
    assert(d.querySelectorAll('#deskStack .occ-board-widget').length===6,'the six complete OCC widgets are not visible');
    assert(!d.querySelector('#deskWorkbench'),'obsolete desk workbench still exists');
    assert(!d.querySelector('.desk-tab'),'obsolete OCC tabs still exist');
    assert(!d.querySelector('[data-open-desk]'),'an OCC widget still requires an open button');
    assert(d.querySelector('[data-desk-widget="crew"] [data-inline-task]'),'crew workflow is not visible inline in its owning widget');
    assert(d.querySelector('[data-desk-widget="crew"] .inline-task-action'),'crew workflow controls are not visible by default');
    const visibleSections={dispatch:'Flight watch and release readiness',crew:'Upcoming duties',fleet:'Complete aircraft rotations',maintenance:'Maintenance',network:'Airport operating plan',weather:'Operational weather briefing'};
    for(const [desk,needle] of Object.entries(visibleSections)) assert(d.querySelector(`[data-desk-widget="${desk}"]`)?.textContent.includes(needle),`${desk} complete information is hidden`);
    const mountedPages={planning:'dispatch',personnel:'crew',relocation:'crew',aircraft:'fleet',maintenance:'maintenance',slots:'network'};
    for(const [page,desk] of Object.entries(mountedPages)) assert(d.querySelector(`[data-desk-widget="${desk}"] [data-management-content="${page}"]`),`${page} controls are not permanently mounted in ${desk}`);
    assert([...d.querySelectorAll('.occ-flight-row')].some(row=>row.textContent.includes('Crew')&&row.textContent.includes('Fuel')&&row.textContent.includes('Slot')&&row.textContent.includes('Alternate')),'dispatch rows do not combine complete readiness information');
    assert(d.querySelector('#scheduleType option[value="ferry"]'),'ferry planning is not available in the inline planner');
    d.querySelector('[data-full-flight]').click(); await wait(80);
    assert(d.querySelector('#contextPane .ground-overview'),'full ground progress is missing');
    assert(d.querySelector('#contextPane .ground-task-list').hidden,'ground task details are expanded by default');
    d.querySelector('#contextPane .ground-task-toggle').click();
    assert(!d.querySelector('#contextPane .ground-task-list').hidden,'ground task disclosure does not expand');
    d.querySelector('[data-handle-incident]').click(); await wait(80);
    assert(d.querySelector('[data-desk-widget="crew"] [data-inline-task].focused'),'flight task did not focus its inline department workflow');
    assert(d.querySelector('#contextPane .context-header'),'flight information disappeared while working its task');
    w.settleSelected(ac.id); await wait(80);
    assert(d.querySelector('#contextPane .context-header h1')?.textContent===ac.tail,'map-style aircraft selection did not update left-side information');
    assert(d.querySelectorAll('#deskStack .occ-board-widget').length===6,'aircraft selection rebuilt or hid the OCC board');
    assert(d.querySelector('#managementView').hidden,'legacy management workspace became visible');
    assert(d.querySelector('#map.leaflet-container'),'shared map did not initialize');
    assert(d.querySelector('#schedule-board .sched-aircraft-row'),'shared schedule did not initialize');
    const visual=new URLSearchParams(location.search).get('visual');
    if(visual==='board'){
      d.querySelector('.context-rail').scrollTop=0;
      await wait(100);
    }else if(visual==='crew'){
      w.openDesk('crew');
      await wait(100);
    }else if(visual==='details'){
      d.querySelector('#upcomingFlightList [data-next-flight]').click();
      await wait(100);
      d.querySelector('[data-full-flight]').click();
      await wait(100);
    }else if(visual){
      d.querySelector('#upcomingFlightList [data-next-flight]').click();
      await wait(100);
    }
    result.textContent=`PASS\nflight=${flight.id}\nincident=${incident.id}\nnew_ui=continuous-occ-board+inline-workflows`;
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
