<!doctype html>
<meta charset="utf-8">
<title>AOC network problems browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{ if(!condition) throw new Error(message); };
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=network-problems&cache='+Date.now();
    await loaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.resetLocalSave?.();
    w.eval(`
      state.ops.automaticDisruptions=false;
      state.aircraft=[];
      state.flights=[];
      state.problems=[];
      state.externalRequests=[];
      state.networkEvents=[];
      selectedFlightId=null;
      selectedAircraftId=null;
      workspaceUi.operationFilter={airports:[],activeProblems:false,delayed:false,weatherCell:null};
    `);

    const now=w.simNow();
    w.changeStaff('ATL','operations',4);
    const firstAircraft=w.assignRequestedAircraft('A220-300',w.defaultCabin('A220-300'),'ATL');
    const secondAircraft=w.assignRequestedAircraft('A220-300',w.defaultCabin('A220-300'),'ATL');
    const first=w.createFlightRecord({
      aircraftId:firstAircraft.id,
      from:'ATL',
      to:'JFK',
      departure:now+45*60_000,
      fare:{economy:170,business:460,first:0}
    });
    const second=w.createFlightRecord({
      aircraftId:secondAircraft.id,
      from:'ATL',
      to:'JFK',
      departure:now+95*60_000,
      fare:{economy:170,business:460,first:0}
    });
    w.recalculateOperations();

    const filedPoints=w.AeroRoutePlanning.routeCoordinatesForFlight(first).map(([lon,lat])=>({lat,lon}));
    const mid=filedPoints[Math.floor(filedPoints.length/2)];
    assert(mid,'fixture could not sample the filed route');
    const polygon=[
      {lat:mid.lat+2.0,lon:mid.lon-2.8},
      {lat:mid.lat+2.0,lon:mid.lon+2.8},
      {lat:mid.lat-2.0,lon:mid.lon+2.8},
      {lat:mid.lat-2.0,lon:mid.lon-2.8}
    ];
    w.eval(`state.networkEvents.push(${JSON.stringify({
      id:'NET-FIXTURE-AIRSPACE',
      manual:true,
      source:'fixture',
      eventType:'airspace_closure',
      problemType:'network_airspace_closure',
      networkId:'fixture-airspace-closure',
      label:'Fixture restricted airspace',
      reason:'Regression fixture restricted area',
      severity:'critical',
      activeFrom:now-10*60_000,
      activeUntil:now+5*60*60_000,
      delayMin:44,
      rerouteDelayMin:26,
      minAffected:2,
      polygon
    })})`);

    assert(w.AeroNetworkEvents?.processNetworkOperationalProblems,'network-event processor is not exposed');
    const candidate=w.AeroNetworkEvents.candidateNetworkEvents(now).find(event=>event.id==='NET-FIXTURE-AIRSPACE');
    assert(w.AeroNetworkEvents.affectedFlightsForNetworkEvent(candidate,now).length===2,'manual network event does not cover both fixture flights');
    assert(w.processNetworkOperationalProblems(now),'network processor did not open or update the shared case');
    const problems=w.eval(`state.problems.filter(problem=>problem.status==='open'&&problem.type==='network_airspace_closure')`);
    assert(problems.length===1,`expected one shared network problem, got ${problems.length}`);
    const problem=problems[0];
    assert(problem.scope?.kind==='network','network airspace closure did not store network scope');
    assert(problem.scope.subjectId==='fixture-airspace-closure','network scope subject is not the shared event id');
    const affected=w.problemAffectedFlightIds(problem).sort();
    assert(JSON.stringify(affected)===JSON.stringify([first.id,second.id].sort()),`network problem did not retain exactly the affected flights: ${affected.join(',')}`);
    assert(w.openProblemsForFlight(first.id).some(item=>item.id===problem.id),'first flight does not see the shared network problem');
    assert(w.openProblemsForFlight(second.id).some(item=>item.id===problem.id),'second flight does not see the shared network problem');

    w.eval(`state.networkEvents.push(${JSON.stringify({
      id:'NET-FIXTURE-SECTOR',
      manual:true,
      source:'fixture',
      eventType:'atc_sector_capacity',
      problemType:'network_atc_sector_capacity',
      networkId:'fixture-sector-capacity',
      label:'Fixture sector capacity',
      reason:'Regression fixture flow regulation',
      severity:'warning',
      activeFrom:now-10*60_000,
      activeUntil:now+3*60*60_000,
      delayMin:24,
      rerouteDelayMin:16,
      minAffected:2,
      polygon
    })})`);
    w.processNetworkOperationalProblems(now);
    assert(!w.eval(`state.problems.some(problem=>problem.status==='open'&&problem.type==='network_atc_sector_capacity')`),'routine sector capacity opened a problem');
    assert(w.operationWarnings(now).some(item=>item.type==='network_atc_sector_capacity'&&item.title.includes('2 flights')),'sector capacity did not create one shared warning');

    const farAircraft=w.assignRequestedAircraft('A220-300',w.defaultCabin('A220-300'),'ATL');
    const farFlight=w.createFlightRecord({aircraftId:farAircraft.id,from:'ATL',to:'JFK',departure:now+4*60*60_000,fare:{economy:170,business:460,first:0}});
    const convective={problemType:'network_convective_weather'};
    assert(!w.AeroNetworkEvents.networkEventProblemRequired(convective,[farFlight],now),'far-ahead convective exposure escalated to a problem');
    assert(w.AeroNetworkEvents.networkEventProblemRequired(convective,[first],now),'imminent convective exposure did not escalate to a problem');

    w.refreshAll();
    await wait(120);
    const caseText=d.querySelector(`[data-critical-incident="${problem.caseId||problem.id}"]`)?.textContent||'';
    assert(caseText.includes('Affected flights')&&caseText.includes(first.id)&&caseText.includes(second.id),'problem card does not show affected network flights');

    for(let i=0;i<80&&!w.__aeroMapReady;i++) await wait(100);
    assert(w.__aeroMapReady,'map did not finish initializing before network fixture checks');
    w.updateMapData();
    await wait(80);
    const feature=w.eval(`map.getSource('network-events')?.data?.features?.find(feature=>feature.properties.id==='NET-FIXTURE-AIRSPACE')`);
    assert(feature?.geometry?.type==='Polygon','network event polygon was not rendered into the map source');
    assert(feature.properties.tooltip.includes('affected flights'),'network event map tooltip does not summarize affected flights');

    const action=w.AeroNetworkEvents.applyNetworkEventAction(problem,'reroute_around',{t:now+5*60_000});
    assert(action.ok,`network route plan was rejected: ${action.reason||'unknown'}`);
    assert(first.networkConstraintIds.includes('fixture-airspace-closure')&&second.networkConstraintIds.includes('fixture-airspace-closure'),'network constraint tag was not applied to all affected flights');
    assert(w.AeroRoutePlanning.activeRevision(first.routePlan)?.mode==='network_avoidance','first flight did not receive a network avoidance route revision');
    assert(w.AeroRoutePlanning.activeRevision(second.routePlan)?.mode==='network_avoidance','second flight did not receive a network avoidance route revision');
    assert(problem.status==='open','shared network problem should remain visible while the network event is still active');
    w.eval(`state.networkEvents.find(event=>event.id==='NET-FIXTURE-AIRSPACE').activeUntil=${now+6*60_000}`);
    w.AeroNetworkEvents.processNetworkOperationalProblems(now+45*60_000);
    w.AeroNetworkEvents.processNetworkOperationalProblems(now+80*60_000);
    assert(problem.status==='resolved','network problem did not close after the shared network event cleared');

    result.textContent=`PASS network problems validated\nproblem=${problem.id}\naffected=${affected.join(',')}`;
    await wait(10);
  }catch(error){
    result.textContent='FAIL\n'+(error.stack||error);
  }
})();
</script>
