<!doctype html>
<meta charset="utf-8">
<title>AeroSim performance browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{ if(!condition) throw new Error(message); };
  const measure=(label,fn)=>{
    const start=performance.now();
    const value=fn();
    return {label,value,ms:performance.now()-start};
  };
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../aerosim-next.html?fixture=performance&cache='+Date.now();
    await loaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.resetLocalSave?.();
    w.eval('state.ops.automaticDisruptions=false; state.aircraft=[]; state.flights=[]; state.incidents=[]; state.coordinationTasks=[]; state.resourceRequests=[]; state.personnelTransfers=[]; state.services=[]; window.__perfState=state;');

    const MIN=60_000,HOUR=60*MIN;
    const airports=w.eval('Object.keys(AIRPORTS).filter(code=>AIRPORTS[code]?.lat&&AIRPORTS[code]?.lon)');
    const models=['E190','A320neo','A330-900'].filter(model=>w.eval(`Boolean(MODELS[${JSON.stringify(model)}])`));
    assert(airports.length>=20,'performance fixture needs the expanded airport list');
    assert(models.length>=2,'performance fixture needs at least two aircraft models');

    const now=w.simNow();
    const aircraftCount=90;
    const legsPerAircraft=12;
    for(let i=0;i<aircraftCount;i++){
      const model=models[i%models.length];
      let origin=airports[(i*7)%airports.length];
      const aircraft=w.assignRequestedAircraft(model,w.defaultCabin(model),origin);
      let departure=now-3*HOUR+(i%18)*10*MIN;
      for(let j=0;j<legsPerAircraft;j++){
        let destination=airports[(i*11+j*5+3)%airports.length];
        if(destination===origin) destination=airports[(airports.indexOf(origin)+1)%airports.length];
        const flight=w.createFlightRecord({
          aircraftId:aircraft.id,
          from:origin,
          to:destination,
          departure,
          fare:{economy:130+(j%5)*12,business:330,first:720}
        });
        flight.weatherChecked=true;
        flight.constraintChecked=true;
        flight.opsChecked=true;
        flight.enrouteChecked=true;
        flight.weatherLiveChecks={period:Math.floor(now/(30*MIN)),routeApplied:true,destinationChecked:true,lightningApplied:true};
        if(j%9===0) flight.manualDelayMin=15+(i%4)*5;
        if(flight.departure<=now){
          flight.departureLogged=true;
          flight.actualDeparture=flight.departure+(flight.manualDelayMin||0)*MIN;
        }
        if(flight.arrival<=now){
          flight.settled=true;
          flight.actualArrival=flight.arrival+(flight.manualDelayMin||0)*MIN;
        }
        departure=flight.arrival+(45+(i+j)%55)*MIN;
        origin=destination;
      }
    }

    for(let i=0;i<12;i++){
      const flight=w.__perfState.flights.find(item=>!item.cancelled&&item.departure>w.simNow()+i*HOUR);
      if(flight) w.createIncident(i%2?'fueling_issue':'crew_sick',flight,{training:true,detectedAt:now+i*MIN});
    }

    const timings=[];
    timings.push(measure('recalculateOperations',()=>w.recalculateOperations()));
    w.save();
    timings.push(measure('refreshAll',()=>w.refreshAll()));
    for(let i=0;i<60&&!w.__aeroMapReady;i++) await wait(100);
    await wait(150);
    timings.push(measure('refreshScheduleTimeline',()=>w.refreshScheduleTimeline(true)));
    timings.push(measure('renderDeskStack',()=>w.renderDeskStack(true)));
    timings.push(measure('refreshOccWidgets',()=>w.refreshOccWidgets(true)));
    timings.push(measure('updateMapData',()=>w.updateMapData()));

    const rows=d.querySelectorAll('#schedule-board .sched-aircraft-row').length;
    const renderedFlights=d.querySelectorAll('#schedule-board [data-flight-id]').length;
    assert(w.__perfState.aircraft.length===aircraftCount,'fixture aircraft were not created');
    assert(w.__perfState.flights.length===aircraftCount*legsPerAircraft,'fixture flights were not created');
    assert(rows>0,'schedule did not render aircraft rows');
    assert(renderedFlights>0,'schedule did not render flights');
    assert(d.querySelectorAll('.aircraft-marker,.plane-shell').length||d.querySelector('#map.maplibregl-map'),'map did not initialize');
    const slow=timings.filter(item=>item.ms>2500);
    assert(!slow.length,`slow render path: ${slow.map(item=>`${item.label} ${item.ms.toFixed(0)}ms`).join(', ')}`);

    result.textContent='PASS\n'+timings.map(item=>`${item.label}: ${item.ms.toFixed(1)}ms`).join('\n')+`\naircraft=${w.__perfState.aircraft.length}\nflights=${w.__perfState.flights.length}\nrendered=${renderedFlights}`;
  }catch(error){
    result.textContent='FAIL\n'+(error.stack||error);
  }
})();
</script>
