<!doctype html>
<meta charset="utf-8">
<title>AOC required problem response browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=problem-response&cache='+Date.now();
    await loaded;
    if(typeof frame.contentWindow.resetLocalSave==='function') frame.contentWindow.resetLocalSave();
    const cleanLoaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=problem-response&cache='+Date.now();
    await cleanLoaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.eval('state.ops.automaticDisruptions=false; state.flights=[]; state.aircraft=[]; state.problems=[]; state.crewDuties=[]; state.services=[];');
    const now=w.simNow();
    const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const flight=w.createFlightRecord({
      aircraftId:aircraft.id,from:'FRA',to:'LHR',departure:now-30*60_000,
      fare:{economy:140,business:360,first:700}
    });
    flight.departureLogged=true;
    flight.actualDeparture=now-30*60_000;
    flight.actualArrival=now+75*60_000;
    flight.arrival=flight.actualArrival;
    flight.operationalDurationMs=flight.actualArrival-flight.actualDeparture;
    const problem=w.createProblem('onboard_medical',flight,{training:true,detectedAt:now,sourceKey:'fixture:cabin-response'});
    assert(problem?.requiredResponse?.status==='pending','cabin response did not start when the problem opened');
    assert(problem.requiredResponse.requestedAt===now&&problem.requiredResponse.respondsAt>now,'cabin response timer has invalid bounds');
    w.refreshAll();
    await wait(150);
    let card=d.querySelector(`[data-critical-incident="${problem.caseId}"]`);
    assert(card?.querySelector('.incident-required-response.pending'),'incident card does not show the pending cabin response');
    assert(/Cabin medical assessment/i.test(card.textContent),'incident card does not identify the expected cabin response');

    const midpoint=Math.round((problem.requiredResponse.requestedAt+problem.requiredResponse.respondsAt)/2);
    w.eval(`state.clock={realBase:Date.now(),simBase:${midpoint},speed:0,paused:true,previousSpeed:1}; refreshRequiredResponseProgress();`);
    const progress=Number(card.querySelector('[role="progressbar"]')?.getAttribute('aria-valuenow'));
    assert(progress>=45&&progress<=55,`cabin response progress is not time-derived: ${progress}`);

    const completedAt=problem.requiredResponse.respondsAt+60_000;
    const before={destination:w.flightOperationalDestination(flight),arrival:w.flightActualArrival(flight),delay:flight.manualDelayMin||0};
    w.eval(`state.clock={realBase:Date.now(),simBase:${completedAt},speed:0,paused:true,previousSpeed:1}; processProblems(simNow());`);
    assert(w.flightOperationalDestination(flight)===before.destination,'cabin report changed the flight destination automatically');
    assert(w.flightActualArrival(flight)===before.arrival&&(flight.manualDelayMin||0)===before.delay,'cabin report changed flight timing automatically');
    w.refreshAll();
    await wait(150);
    assert(problem.requiredResponse.status==='received','cabin response did not complete after its response time');
    card=d.querySelector(`[data-critical-incident="${problem.caseId}"]`);
    assert(card?.querySelector('.incident-required-response.received'),'incident card does not show the received cabin report');
    assert(card.textContent.includes(problem.requiredResponse.title),'incident card does not present the cabin decision/report');
    assert(problem.status==='open','receiving the cabin report incorrectly resolved the operational problem');

    const technicalNow=completedAt;
    const technicalAircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const technicalFlight=w.createFlightRecord({
      aircraftId:technicalAircraft.id,from:'FRA',to:'CDG',departure:technicalNow-60*60_000,
      fare:{economy:140,business:360,first:700}
    });
    technicalFlight.departureLogged=true;
    technicalFlight.actualDeparture=technicalNow-60*60_000;
    technicalFlight.actualArrival=technicalNow+30*60_000;
    technicalFlight.arrival=technicalFlight.actualArrival;
    technicalFlight.operationalDurationMs=technicalFlight.actualArrival-technicalFlight.actualDeparture;
    const technicalProblem=w.createProblem('inflight_technical_fault',technicalFlight,{
      training:true,detectedAt:technicalNow,sourceKey:'fixture:flight-deck-response',context:{phasePct:70,aircraftCondition:78}
    });
    assert(technicalProblem?.requiredResponse?.owner==='flightDeck','technical fault did not start a flight-deck response');
    w.refreshAll();
    await wait(150);
    let technicalCard=d.querySelector(`[data-critical-incident="${technicalProblem.caseId}"]`);
    assert(technicalCard?.querySelector('.incident-required-response.pending'),'technical fault card does not show the pending flight-deck assessment');
    assert(/Waiting flight deck/i.test(technicalCard.textContent),'technical fault card has the wrong response owner');

    const technicalBefore={destination:w.flightOperationalDestination(technicalFlight),arrival:w.flightActualArrival(technicalFlight),delay:technicalFlight.manualDelayMin||0};
    const technicalCompletedAt=technicalProblem.requiredResponse.respondsAt+60_000;
    w.eval(`state.clock={realBase:Date.now(),simBase:${technicalCompletedAt},speed:0,paused:true,previousSpeed:1}; processProblems(simNow());`);
    assert(w.flightOperationalDestination(technicalFlight)===technicalBefore.destination,'flight-deck assessment changed the destination automatically');
    assert(w.flightActualArrival(technicalFlight)===technicalBefore.arrival&&(technicalFlight.manualDelayMin||0)===technicalBefore.delay,'flight-deck assessment changed flight timing automatically');
    w.refreshAll();
    await wait(150);
    technicalCard=d.querySelector(`[data-critical-incident="${technicalProblem.caseId}"]`);
    assert(technicalProblem.requiredResponse.status==='received','flight-deck assessment did not complete after its response time');
    assert(technicalProblem.requiredResponse.severityLabel&&technicalProblem.requiredResponse.decision,'flight-deck assessment has no severity or decision');
    assert(technicalCard?.querySelector('.incident-required-response.received'),'technical fault card does not show the received flight-deck assessment');
    assert(technicalCard.textContent.includes(technicalProblem.requiredResponse.severityLabel),'technical fault card does not display fault severity');
    assert(technicalCard.textContent.includes(technicalProblem.requiredResponse.decision),'technical fault card does not display the flight-deck decision');
    assert(technicalProblem.status==='open','receiving the flight-deck assessment incorrectly resolved the technical problem');
    result.textContent=`PASS\nmedical=${problem.requiredResponse.outcomeId}\ntechnical=${technicalProblem.requiredResponse.outcomeId}`;
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
