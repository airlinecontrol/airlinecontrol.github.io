<!doctype html>
<meta charset="utf-8">
<title>Map workspace layout contract</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1600px;height:1000px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result'),frame=document.getElementById('game');
  const assert=(ok,message)=>{if(!ok)throw new Error(message);};
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  try{
    localStorage.removeItem('aerosim_mvp_v6');localStorage.removeItem('aerosim_occ_ui_v1');
    localStorage.removeItem('aoc_workspace_layout');localStorage.removeItem('aoc_map_schedule_height');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=map-workspace';await loaded;
    const w=frame.contentWindow,d=frame.contentDocument,api=w.eval('AeroMapWorkspace'),s=w.eval('state');
    w.setSimulationPaused(true);s.ops.automaticDisruptions=false;
    const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'LHR',departure:w.simNow()+150*60000,fare:{economy:140,business:360,first:700}});
    w.settleSelectedFlight(flight.id);w.refreshAll();await wait(150);
    const rect=selector=>d.querySelector(selector).getBoundingClientRect();
    const close=(a,b)=>Math.abs(a-b)<2;
    function toolbarGeometry(){
      const bar=rect('.schedule-toolbar'),controls=rect('.schedule-view-controls');
      const range=rect('#schedule-window-label'),filters=rect('#operationFilterBar');
      assert(bar.height<=40,'Schedule toolbar is no longer a single compact row');
      assert(close(range.top+range.height/2,filters.top+filters.height/2)&&close(range.top+range.height/2,controls.top+controls.height/2),'Date range, filters, and view controls are not on the same row');
      assert(controls.right<=bar.right&&controls.left>=bar.left,'View controls are outside the toolbar');
      assert(!d.querySelector('.schedule-legend')&&!d.querySelector('.schedule-toolbar h2,.schedule-toolbar>div>b'),'Schedule heading or legend is still present');
      assert(!d.querySelector('#scheduleCollapseBtn').textContent.trim(),'Collapse control still shows the Schedule heading');
      assert(d.querySelector('.schedule-toolbar-scroll').scrollWidth>=d.querySelector('.schedule-toolbar-scroll').clientWidth,'Toolbar scroll region is invalid');
    }
    function geometry(){
      const shell=rect('#operationsView'),map=rect('#map-pane'),dock=rect('#map-schedule-dock');
      assert(close(map.width,shell.width)&&close(map.height,shell.height),'Map does not fill workspace');
      assert(close(map.left,shell.left)&&close(map.top,shell.top),'Map is offset from workspace');
      const leftRail=rect('.operations-rail'),rightRail=rect('.context-rail');
      assert(close(dock.left,leftRail.right+18)&&close(dock.right,rightRail.left-18),'Schedule does not fit between side panels');
      for(const side of ['.operations-rail','.context-rail']){
        const rail=rect(side);
        assert(close(rail.bottom,shell.bottom-12),'Side panel does not extend to the bottom');
        assert(close(rail.bottom,dock.bottom),'Side panel and schedule bottoms are not aligned');
        assert(close(rail.top,shell.top+12),'Widgets are not aligned');
        assert(w.getComputedStyle(d.querySelector(side)).backgroundColor==='rgba(0, 0, 0, 0)','Sidebar has a large opaque background');
      }
      for(const selector of ['#left-rail-splitter','#right-rail-splitter']){
        assert(close(rect(selector).bottom,shell.bottom-12),'Side resize handle does not span full height');
      }
      for(const control of d.querySelectorAll('.schedule-view-controls>button,.schedule-view-controls>select,#scheduleCollapseBtn')){
        const box=control.getBoundingClientRect();
        assert(box.left>=dock.left&&box.right<=dock.right,'Schedule control spills into side panel');
      }
      const inset=api.padding();
      assert(inset.left>200&&inset.right>200&&inset.bottom>=dock.height,'Map camera ignores covered area');
      const point={x:(rect('.operations-rail').right+rect('.context-rail').left)/2,y:map.top+110};
      assert(d.elementFromPoint(point.x,point.y)?.closest('#map-pane'),'An invisible overlay blocks map input');
      assert(rect('#schedule-scroll').height>0,'Schedule has no usable scrolling area');
      toolbarGeometry();
    }
    assert(d.body.classList.contains('map-workspace'),'Map workspace is not the default');
    geometry();
    d.querySelector('[data-desk-panel="corporate:planning"]').click();w.flushUiDirty();await wait(40);
    const destination=d.querySelector('#destination');destination.value='JFK';
    const stateBefore=JSON.stringify(s),selected=w.eval('selectedFlightId');
    const toggle=d.querySelector('#workspaceLayoutBtn');
    toggle.click();await wait(80);
    assert(!d.querySelector('#map-schedule-dock')&&!d.body.classList.contains('map-workspace'),'Classic layout was not restored');
    assert(d.querySelector('#center-workspace>.schedule-toolbar #operationFilterBar'),'Classic merged schedule toolbar is misplaced');
    toolbarGeometry();
    assert(d.querySelector('#destination')===destination&&destination.value==='JFK','Layout change replaced or reset a form');
    toggle.click();await wait(80);geometry();
    assert(JSON.stringify(s)===stateBefore&&w.eval('selectedFlightId')===selected,'Layout switch changed gameplay or selection');
    assert(d.querySelector('#destination')===destination,'Map layout recreated the planner');

    const originalOffset=w.eval('scheduleWindowOffsetHours');
    d.querySelector('#scheduleNextBtn').click();w.flushUiDirty();await wait(30);
    assert(w.eval('scheduleWindowOffsetHours')===originalOffset+12,'Next 12 hours control stopped working');
    d.querySelector('#schedulePrevBtn').click();w.flushUiDirty();await wait(30);
    assert(w.eval('scheduleWindowOffsetHours')===originalOffset,'Previous 12 hours control stopped working');
    const rangeSelect=d.querySelector('#scheduleRange');
    rangeSelect.value='48';rangeSelect.dispatchEvent(new w.Event('change',{bubbles:true}));w.flushUiDirty();await wait(30);
    assert(w.scheduleWindow().end-w.scheduleWindow().start===48*3600000,'Range selector no longer changes the window');
    rangeSelect.value='24';rangeSelect.dispatchEvent(new w.Event('change',{bubbles:true}));w.flushUiDirty();

    d.querySelector('#scheduleCollapseBtn').click();await wait(80);
    assert(close(rect('#map-schedule-dock').height,rect('#map-schedule-dock .schedule-toolbar').height)&&rect('#schedule-scroll').height===0,'Schedule did not collapse to toolbar');
    d.querySelector('#scheduleCollapseBtn').click();await wait(80);geometry();
    const splitter=d.querySelector('#map-schedule-splitter'),before=rect('#map-schedule-dock').height;
    splitter.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true}));await wait(80);
    assert(rect('#map-schedule-dock').height>before,'Schedule resize did not work');
    w.applyRailWidths({left:460,right:380},{persist:false});await wait(80);geometry();
    assert(w.eval('map.getPadding().left')===api.padding().left,'Map padding did not follow rail resizing');

    d.querySelector('#mapFocusBtn').click();await wait(80);
    assert(w.getComputedStyle(d.querySelector('.context-rail')).visibility==='hidden','Focus did not hide widgets');
    assert(api.padding().left===0,'Focus retains sidebar camera padding');
    assert(w.getComputedStyle(d.querySelector('#mapFocusBtn')).visibility==='visible','Focus cannot be exited');
    d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(80);geometry();

    // Responsive fallback must restore real DOM parents, not merely hide the desktop dock.
    for(const width of [390,768,901,1100,1366,1600,1920]){
      frame.style.width=`${width}px`;await wait(150);
      if(width<=900){
        assert(!d.body.classList.contains('map-workspace'),'Small screen retained overlays');
        assert(!d.querySelector('#map-schedule-dock'),'Small screen retained schedule dock');
        assert(d.querySelector('#center-workspace>#schedule-pane'),'Small-screen schedule is detached');
        assert(d.documentElement.scrollWidth<=width+2,'Small screen overflows horizontally');
        toolbarGeometry();
      }else geometry();
    }
    assert(d.querySelector('#destination')===destination&&destination.value==='JFK','Responsive changes replaced planner controls');
    result.textContent='PASS\nMap workspace, classic restoration, controls, resizing, input identity, camera padding, and mobile fallback';
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
