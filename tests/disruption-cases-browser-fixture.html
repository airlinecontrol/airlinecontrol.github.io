<!doctype html>
<meta charset="utf-8">
<title>AeroSim disruption case browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=disruption-cases&cache='+Date.now();
    await loaded;
    if(typeof frame.contentWindow.resetLocalSave==='function') frame.contentWindow.resetLocalSave();
    const cleanLoaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=disruption-cases&cache='+Date.now();
    await cleanLoaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.eval('state.ops.automaticDisruptions=false');
    const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const departure=w.simNow()+90*60_000;
    const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure,fare:{economy:140,business:360,first:700}});
    const root=w.createProblem('crew_sick',flight,{training:true,detectedAt:w.simNow(),context:{sourceId:flight.id,label:'Fixture crew root'}});
    const effect=w.createProblem('security_screening',flight,{source:'derived',sourceKey:`fixture-security:${flight.id}`,detectedAt:w.simNow()+60_000,context:{sourceId:flight.id,label:'Fixture security screening'}});
    assert(root&&effect,'fixture problems were not created');
    assert(root.caseId===root.id&&root.rootProblemId===root.id,'root problem did not create its own case');
    assert(effect.caseId===root.caseId,'derived problem did not inherit the disruption case id');
    assert(effect.rootProblemId===root.id,'derived problem did not store the root problem id');
    assert(effect.triggeredByProblemId===root.id,'derived problem did not store its immediate trigger');
    w.refreshAll(); await wait(140);
    const group=d.querySelector(`[data-critical-incident="${CSS.escape(root.caseId)}"]`);
    assert(group,'disruption case was not rendered as one critical card');
    assert(group.textContent.includes('Crew sick call'),'critical card does not show the root cause');
    assert(group.textContent.includes('1 linked operational effect'),'critical card does not summarize the derived effect');
    assert(group.querySelectorAll(`[data-case-affected-flight="${flight.id}"]`).length===1,'critical card should show the affected flight once');
    assert(!group.querySelector('[data-dismiss-warning]'),'critical card should not be dismissible');
    result.textContent=`PASS\ncase=${root.caseId}\nroot=${root.id}\neffect=${effect.id}`;
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
