<!doctype html>
<meta charset="utf-8">
<title>AeroSim disruption case browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=disruption-cases&cache='+Date.now();
    await loaded;
    if(typeof frame.contentWindow.resetLocalSave==='function') frame.contentWindow.resetLocalSave();
    const cleanLoaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=disruption-cases&cache='+Date.now();
    await cleanLoaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.eval('state.ops.automaticDisruptions=false');
    const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const departure=w.simNow()+90*60_000;
    const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure,fare:{economy:140,business:360,first:700}});
    const root=w.createIncident('mel_defect',flight,{training:true,detectedAt:w.simNow()});
    const effect=w.createIncident('crew_duty_risk',flight,{source:'derived',sourceKey:`fixture-duty:${flight.id}`,detectedAt:w.simNow()+60_000,context:{sourceId:flight.id,label:'Fixture duty risk'}});
    assert(root&&effect,'fixture incidents were not created');
    assert(root.caseId===root.id&&root.rootIncidentId===root.id,'root incident did not create its own case');
    assert(effect.caseId===root.caseId,'derived incident did not inherit the disruption case id');
    assert(effect.rootIncidentId===root.id,'derived incident did not store the root incident id');
    assert(effect.triggeredByIncidentId===root.id,'derived incident did not store its immediate trigger');
    w.eval("workspaceUi.incidentFilter='all';");
    w.refreshAll(); await wait(140);
    const group=d.querySelector(`[data-disruption-case="${CSS.escape(root.caseId)}"]`);
    assert(group,'disruption case group was not rendered');
    assert(group.textContent.includes('Root:')&&group.textContent.includes('Ground technical defect'),'group does not show the root cause');
    assert(group.textContent.includes('Crew duty risk'),'group does not show the derived effect');
    assert(group.querySelectorAll('[data-incident-case]').length===2,'group should contain both incident cards');
    result.textContent=`PASS\ncase=${root.caseId}\nroot=${root.id}\neffect=${effect.id}`;
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
