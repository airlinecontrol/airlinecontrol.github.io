<!doctype html>
<meta charset="utf-8">
<title>AeroSim night operations browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=night-ops&cache='+Date.now();
    await loaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.resetLocalSave();
    await wait(150);

    const airportCodes=w.eval('Object.keys(AIRPORTS)');
    const nightCodes=w.eval('Object.keys(AIRPORT_NIGHT_RULES)');
    const missing=w.eval('Object.keys(AIRPORTS).filter(code=>!AIRPORT_NIGHT_RULES[code])');
    const extras=w.eval('Object.keys(AIRPORT_NIGHT_RULES).filter(code=>!AIRPORTS[code])');
    assert(!missing.length,'airport night profiles missing: '+missing.join(', '));
    assert(!extras.length,'unknown airport night profiles: '+extras.join(', '));

    const fraLate=Date.UTC(2026,0,1,22,30);
    const fraStatus=w.airportNightStatus('FRA',fraLate);
    assert(fraStatus.status==='closed','FRA should be closed during the modeled night curfew');
    const fraFlight=w.flightNightRestriction({
      from:'FRA',
      to:'LHR',
      departure:fraLate,
      arrival:fraLate+90*60_000,
      operationalDurationMs:90*60_000,
      enrouteDelayMin:0
    },fraLate);
    assert(fraFlight.delayMin>=300,'FRA night curfew did not create a departure hold');
    assert(fraFlight.reason.includes('Night curfew'),'FRA curfew reason was not exposed');

    const lhrNight=Date.UTC(2026,0,1,0,45);
    const lhrStatus=w.airportNightStatus('LHR',lhrNight);
    assert(lhrStatus.status==='restricted','LHR should be quota restricted overnight, not hard closed');
    assert(lhrStatus.delayMin>0,'LHR quota period should add operational friction');

    let futureFraLate=w.simNow()+60*60_000;
    for(let i=0;i<96&&w.airportNightStatus('FRA',futureFraLate).status!=='closed';i++) futureFraLate+=30*60_000;
    assert(w.airportNightStatus('FRA',futureFraLate).status==='closed','fixture could not find a future FRA night curfew window');
    const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const flight=w.createFlightRecord({
      aircraftId:aircraft.id,
      from:'FRA',
      to:'LHR',
      departure:futureFraLate,
      fare:{economy:140,business:360,first:700}
    });
    w.recalculateOperations();
    assert(flight.nightRestrictionDelayMin>=300,'recalculation did not persist night restriction delay');
    assert(w.flightActualDeparture(flight)>flight.departure,'night restriction did not move actual departure');
    w.alignScheduleWindowToFlight(flight);
    w.refreshAll();
    await wait(100);
    const block=d.querySelector(`[data-flight-id="${flight.id}"]`);
    assert(block?.querySelector('.flight-night-marker'),'schedule flight bar does not show a night restriction marker');
    assert(block.getAttribute('title')?.includes('Night curfew'),'schedule flight bar tooltip does not explain the night restriction');
    assert(block.querySelector('.flight-night-marker')?.getAttribute('title')?.includes('expected departure'),'night marker tooltip does not include the expected departure');
    assert(!d.querySelector('[data-desk-widget="airports"]'),'airport widget should not be rendered');
    result.textContent='PASS night operations validated';
  }catch(error){
    result.textContent='FAIL '+(error.stack||error);
  }
})();
</script>
