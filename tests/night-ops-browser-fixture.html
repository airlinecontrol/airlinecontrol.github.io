<!doctype html>
<meta charset="utf-8">
<title>AeroSim night operations browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=night-ops&cache='+Date.now();
    await loaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.resetLocalSave();
    await wait(150);

    const airportCodes=w.eval('Object.keys(AIRPORTS)');
    const nightCodes=w.eval('Object.keys(AIRPORT_NIGHT_RULES)');
    const missing=w.eval('Object.keys(AIRPORTS).filter(code=>!AIRPORT_NIGHT_RULES[code])');
    const extras=w.eval('Object.keys(AIRPORT_NIGHT_RULES).filter(code=>!AIRPORTS[code])');
    assert(!missing.length,'airport night profiles missing: '+missing.join(', '));
    assert(!extras.length,'unknown airport night profiles: '+extras.join(', '));

    const fraLate=Date.UTC(2026,0,1,22,30);
    const fraStatus=w.airportNightStatus('FRA',fraLate);
    assert(fraStatus.status==='closed','FRA should be closed during the modeled night curfew');
    const fraFlight=w.flightNightRestriction({
      from:'FRA',
      to:'LHR',
      departure:fraLate,
      arrival:fraLate+90*60_000,
      operationalDurationMs:90*60_000,
      enrouteDelayMin:0
    },fraLate);
    assert(fraFlight.delayMin>=300,'FRA night curfew did not create a departure hold');
    assert(fraFlight.reason.includes('Night curfew'),'FRA curfew reason was not exposed');

    const lhrNight=Date.UTC(2026,0,1,0,45);
    const lhrStatus=w.airportNightStatus('LHR',lhrNight);
    assert(lhrStatus.status==='restricted','LHR should be quota restricted overnight, not hard closed');
    assert(lhrStatus.delayMin>0,'LHR quota period should add operational friction');

    let futureFraLate=w.simNow()+60*60_000;
    for(let i=0;i<96&&w.airportNightStatus('FRA',futureFraLate).status!=='closed';i++) futureFraLate+=30*60_000;
    assert(w.airportNightStatus('FRA',futureFraLate).status==='closed','fixture could not find a future FRA night curfew window');
    let futureFraStart=futureFraLate;
    for(let i=0;i<180&&w.airportNightStatus('FRA',futureFraStart-5*60_000).status==='closed';i++) futureFraStart-=5*60_000;
    const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'LHR');
    const family='Airbus A320 family';
    w.changeStaff('LHR','captains',20);
    w.changeStaff('LHR','firstOfficers',20);
    w.changeStaff('LHR','cabinCrew',60);
    w.changeStaff('LHR','groundHandling',80);
    w.changeStaff('LHR','operations',20);
    w.changeStaff('LHR','customerService',20);
    w.changeQualification('LHR','captains',family,20);
    w.changeQualification('LHR','firstOfficers',family,20);
    let futureLhrRestricted=w.simNow()+60*60_000;
    for(let i=0;i<96&&w.airportNightStatus('LHR',futureLhrRestricted).status!=='restricted';i++) futureLhrRestricted+=30*60_000;
    assert(w.airportNightStatus('LHR',futureLhrRestricted).status==='restricted','fixture could not find a future LHR night restriction window');
    const quotaAircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'LHR');
    const quotaFlight=w.createFlightRecord({
      aircraftId:quotaAircraft.id,
      from:'LHR',
      to:'AMS',
      departure:futureLhrRestricted,
      fare:{economy:140,business:360,first:700}
    });
    w.recalculateOperations();
    w.alignScheduleWindowToFlight(quotaFlight);
    w.refreshAll();
    await wait(100);
    const restrictionBar=d.querySelector(`#schedule-board .night-closure-bar.restriction[data-night-flight="${quotaFlight.id}"][data-night-airport="LHR"]`);
    assert(restrictionBar,'quota/noise night restriction did not render a lighter schedule bar');

    const flight=w.createFlightRecord({
      aircraftId:aircraft.id,
      from:'LHR',
      to:'FRA',
      departure:futureFraStart-105*60_000,
      fare:{economy:140,business:360,first:700}
    });
    flight.arrival=futureFraStart-15*60_000;
    flight.operationalDurationMs=flight.arrival-flight.departure;
    flight.manualDelayMin=30;
    w.recalculateOperations();
    assert(flight.nightRestrictionDelayMin===0,'night curfew conflict should not auto-reschedule before OCC decision');
    assert(flight.nightRestrictionConflictDelayMin>=300,'recalculation did not expose the pending night curfew conflict');
    assert(w.flightActualDeparture(flight)<w.flightNightRestriction(flight,w.flightActualDeparture(flight)).nextDeparture,'flight was magically moved to the post-curfew departure');
    assert(w.processDerivedOperationalIncidents(flight.departure-5*60_000),'night curfew conflict did not create a derived incident');
    const incident=w.eval(`state.incidents.find(item=>item.flightId==='${flight.id}'&&item.type==='night_curfew_conflict'&&item.status==='open')`);
    assert(incident,'night curfew conflict incident is missing');
    incident.deadline=w.simNow()+30*60_000;
    const task=w.incidentTasks(incident.id).find(item=>item.kind==='recovery_strategy');
    assert(task?.strategyOptions?.some(option=>option.id==='change_departure'),'night curfew incident does not offer manual departure change');
    assert(task.strategyOptions.some(option=>option.id==='cancel'),'night curfew incident does not offer cancellation');
    assert(incident.context.restrictionSummary?.includes('FRA'),'night curfew incident does not explain the affected restriction chain');
    w.alignScheduleWindowToFlight(flight);
    w.refreshAll();
    await wait(100);
    const block=d.querySelector(`.flight-block[data-flight-id="${flight.id}"]`);
    assert(block?.querySelector('.flight-night-marker.conflict')?.textContent.trim()==='N!','pending night curfew conflict should show a red conflict marker');
    const nightBar=d.querySelector('#schedule-board .night-closure-bar[data-night-airport="FRA"]');
    assert(nightBar,'arrival near curfew did not render a horizontal night closure bar');
    assert(nightBar.textContent.includes('23:00')&&nightBar.textContent.includes('05:00'),'night closure bar does not show local closure times');
    assert(nightBar.getAttribute('title')?.includes('Night curfew'),'night closure bar tooltip does not explain the curfew');
    assert(w.performOperationalTask(task.id,'change_departure'),'manual departure-change option did not complete');
    const manualTask=w.incidentTasks(incident.id).find(item=>item.kind==='manual_departure_change_required');
    assert(manualTask?.status==='available','manual departure-change follow-up did not unlock');
    assert(!w.performOperationalTask(manualTask.id),'manual departure-change task completed before the flight was retimed');
    w.delayFlightUntil(flight.id,incident.context.nextDeparture+5*60_000);
    assert(w.flightActualDeparture(flight)>=incident.context.nextDeparture,'hold-until action did not move the projected departure past reopening');
    assert(w.performOperationalTask(manualTask.id),'manual departure-change task did not complete after retiming');
    assert(flight.nightRecoveryDecision==='manual_departure_change','flight did not store the manual night recovery decision');
    assert(incident.status==='resolved','night curfew incident did not resolve after the manual departure change was confirmed');

    const airborneAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'LHR');
    w.changeStaff('LHR','operations',1);
    let airborneCurfewArrival=w.simNow()+45*60_000;
    for(let i=0;i<144&&w.airportNightStatus('FRA',airborneCurfewArrival).status!=='closed';i++) airborneCurfewArrival+=20*60_000;
    assert(w.airportNightStatus('FRA',airborneCurfewArrival).status==='closed','fixture could not find a closed FRA arrival window for the airborne case');
    const airborne=w.createFlightRecord({
      aircraftId:airborneAc.id,
      from:'LHR',
      to:'FRA',
      departure:w.simNow()-35*60_000,
      fare:{economy:140,business:360,first:700}
    });
    airborne.departureLogged=true;
    airborne.arrival=airborneCurfewArrival;
    airborne.operationalDurationMs=airborne.arrival-airborne.departure;
    airborne.enrouteDelayMin=0;
    w.recalculateOperations();
    assert(airborne.nightRestrictionConflictDelayMin>0,'airborne curfew arrival did not expose a schedule conflict');
    assert(w.processDerivedOperationalIncidents(w.simNow()),'airborne curfew arrival did not create a derived incident');
    const airborneIncident=w.eval(`state.incidents.find(item=>item.flightId==='${airborne.id}'&&item.type==='arrival_curfew_coordination'&&item.status==='open')`);
    assert(airborneIncident,'arrival curfew coordination incident is missing');
    w.alignScheduleWindowToFlight(airborne);
    w.refreshAll();
    await wait(100);
    const airborneBlock=d.querySelector(`.flight-block[data-flight-id="${airborne.id}"]`);
    assert(airborneBlock?.querySelector('.flight-night-marker.conflict')?.textContent.trim()==='N!','airborne curfew arrival should show a red conflict marker');
    const airborneTask=w.incidentTasks(airborneIncident.id).find(item=>item.kind==='flight_watch_coordination');
    assert(w.performOperationalTask(airborneTask.id),'arrival curfew coordination task did not start');
    for(let i=0;i<12&&airborneTask.status!=='completed';i++){ w.processOperationalWorkflows(w.simNow()+10*60_000); await wait(10); }
    assert(airborne.arrivalCurfewCoordinatedKey===airborneIncident.context.sourceKey,'arrival curfew coordination was not acknowledged on the flight');

    const reopening=incident.context.nextDeparture;
    const morningAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const morning=w.createFlightRecord({
      aircraftId:morningAc.id,
      from:'FRA',
      to:'LHR',
      departure:reopening+20*60_000,
      fare:{economy:140,business:360,first:700}
    });
    w.recalculateOperations();
    w.alignScheduleWindowToFlight(morning);
    w.refreshAll();
    await wait(100);
    const departureNightBar=d.querySelector(`#schedule-board .night-closure-bar[data-night-flight="${morning.id}"][data-night-edge="departure"][data-night-airport="FRA"]`);
    assert(departureNightBar,'departure shortly after curfew did not render the previous night closure bar');
    assert(departureNightBar.textContent.includes('23:00')&&departureNightBar.textContent.includes('05:00'),'departure night closure bar does not show local closure times');
    const overlapFlight=w.createFlightRecord({
      aircraftId:morningAc.id,
      from:'MUC',
      to:'LHR',
      departure:reopening+40*60_000,
      fare:{economy:140,business:360,first:700}
    });
    w.recalculateOperations();
    w.alignScheduleWindowToFlight(morning);
    w.refreshAll();
    await wait(100);
    const nightRow=d.querySelector(`#schedule-board [data-sched-aircraft="${morningAc.id}"]`);
    assert(nightRow,'overlap fixture did not render the aircraft schedule row');
    const rowNightBars=[...nightRow.querySelectorAll('.night-closure-bar')];
    const fraNight=rowNightBars.find(node=>node.dataset.nightAirport==='FRA');
    const mucNight=rowNightBars.find(node=>node.dataset.nightAirport==='MUC');
    assert(fraNight&&mucNight,`overlap fixture did not render both night bars for ${morning.id} and ${overlapFlight.id}`);
    const fraRect=fraNight.getBoundingClientRect(),mucRect=mucNight.getBoundingClientRect();
    const horizontallyOverlapping=fraRect.left<mucRect.right&&mucRect.left<fraRect.right;
    assert(!horizontallyOverlapping||Math.abs(fraRect.top-mucRect.top)>4,'overlapping night closure bars were not stacked into separate lanes');

    for(let i=0;i<60&&!w.__aeroMapReady;i++) await wait(100);
    const fraMarker=[...d.querySelectorAll('.airport-marker')].find(node=>node.textContent.includes('FRA'));
    assert(fraMarker?.title.includes('Night closure: 23:00-05:00 local'),'airport marker title does not expose night closure times');
    fraMarker.dispatchEvent(new MouseEvent('mouseenter',{bubbles:false}));
    await wait(50);
    assert(d.querySelector('.maplibregl-popup-content')?.textContent.includes('Night closure: 23:00-05:00 local'),'airport hover popup does not show night closure times');
    fraMarker.dispatchEvent(new MouseEvent('mouseleave',{bubbles:false}));
    assert(!d.querySelector('[data-desk-widget="airports"]'),'airport widget should not be rendered');
    result.textContent='PASS night operations validated';
  }catch(error){
    result.textContent='FAIL '+(error.stack||error);
  }
})();
</script>
