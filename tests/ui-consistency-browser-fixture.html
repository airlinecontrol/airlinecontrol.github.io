<!doctype html>
<meta charset="utf-8">
<title>Widget interaction and layout contract</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1600px;height:1000px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result'),frame=document.getElementById('game');
  const assert=(ok,message)=>{if(!ok)throw new Error(message);};
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  try{
    localStorage.removeItem('aerosim_mvp_v6');localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=ui-consistency';await loaded;
    const w=frame.contentWindow,d=frame.contentDocument,s=w.eval('state'),MIN=60000;
    w.setSimulationPaused(true);s.ops.automaticDisruptions=false;
    const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'LHR',departure:w.simNow()+150*MIN,fare:{economy:140,business:360,first:700}});
    w.settleSelectedFlight(flight.id);w.refreshAll();await wait(100);
    const clickTab=async key=>{const tab=d.querySelector(`[data-desk-panel="${key}"]`);assert(tab,`Missing tab ${key}`);tab.click();w.flushUiDirty();await wait(30);};

    // Clicking an active tab must preserve its actual controls, not just its selected styling.
    await clickTab('corporate:planning');
    const destination=d.querySelector('#destination');
    await clickTab('corporate:planning');
    assert(d.querySelector('#destination')===destination,'Active tab recreated the form');
    assert(d.querySelector('[data-desk-panel="corporate:planning"]').getAttribute('aria-selected')==='true','Active tab was closed');
    assert(!d.querySelector('[data-close-desk-panel]'),'Tab content still has a duplicate panel-close control');
    const search=destination.closest('.ui-select')?.querySelector('input[type="search"]');
    assert(search,'Long airport list has no search');
    const original=destination.value;search.focus();search.value='JFK';search.dispatchEvent(new w.Event('input',{bubbles:true}));
    w.refreshAll();await wait(80);
    assert(d.activeElement===search&&d.querySelector('#destination')===destination,'Refresh replaced a focused search or combobox');
    assert(destination.value===original,'Filtering changed the selected airport');
    assert([...destination.options].filter(option=>!option.hidden).every(option=>option.selected||option.textContent.includes('JFK')),'Airport search did not filter options');
    search.value='not-an-airport';search.dispatchEvent(new w.Event('input',{bubbles:true}));
    assert(destination.value===original&&search.parentElement.textContent.includes('No matches'),'No-match search lost the selected airport');
    search.blur();
    const tab=d.querySelector('[data-desk-panel="corporate:planning"]');tab.focus();
    tab.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await wait(50);
    assert(d.activeElement?.dataset.deskPanel==='corporate:aircraft','Arrow-key tab navigation did not retain focus');
    const panel=d.getElementById(d.activeElement.getAttribute('aria-controls'));
    assert(panel?.getAttribute('aria-labelledby')===d.activeElement.id,'Selected tab and content are not associated');

    // Expanded pool information survives dirty rendering.
    await clickTab('personnel:overview');
    const details=d.querySelector('[data-ui-details="crew-pool-FRA"]');assert(details,'Pool details missing');
    details.open=true;await wait(30);w.refreshPersonnelRail(true,true);await wait(30);
    assert(d.querySelector('[data-ui-details="crew-pool-FRA"]').open,'Pool details collapsed on refresh');

    // Every formerly capped work list exposes all items without changing operational data.
    const host=d.createElement('div');host.id='presentation-contract';d.body.append(host);
    const exposures=Array.from({length:27},(_,i)=>({flightId:`UX${i}`,flight:{...flight,id:`UX${i}`},arranged:false,reason:'Diversion',cost:100,crew:5,releaseAirport:'LHR',actions:[{id:'hotel',label:'Request hotel'}],records:[]}));
    const warnings=exposures.map((item,i)=>({id:`test-warning-${i}`,group:'UX warnings',type:'short_turn',flightId:flight.id,title:`Warning ${i}`,detail:'Turn below minimum',level:'warning'}));
    const views=[
      [()=>w.passengerRecoveryDeskMarkup(exposures),'.passenger-recovery-row'],
      [()=>w.crewAccommodationMarkup(exposures),'.crew-accommodation-row'],
      [()=>w.incidentsWarningsDeskMarkup([],warnings),'.warning-row'],
      [()=>w.networkConstraintsMarkup(exposures.map((_,i)=>({id:`test-network-${i}`,activeFrom:w.simNow(),activeUntil:w.simNow()+60*MIN,label:`Area ${i}`,reason:'Capacity'}))),'.desk-list-row']
    ];
    for(const [render,selector] of views){
      host.innerHTML=render();assert(host.querySelectorAll(selector).length===10,`Initial list is not ten rows: ${selector}`);
      for(let n=0;n<2;n++){host.querySelector('[data-ui-more]').click();host.innerHTML=render();}
      assert(host.querySelectorAll(selector).length===27,`List silently lost items: ${selector}`);
      assert(!host.querySelector('[data-ui-more]'),'Finished list still claims hidden work');
      host.querySelector('[data-ui-less]').click();host.innerHTML=render();
      assert(host.querySelectorAll(selector).length===10,'Show fewer did not reset the list');
    }
    host.innerHTML=w.passengerRecoveryDeskMarkup(exposures.map(item=>({...item,arranged:true})));
    assert(!host.querySelector('.passenger-recovery-row'),'Completed passenger work is still visible');
    host.innerHTML=w.crewAccommodationMarkup(exposures.map(item=>({...item,arranged:true})));
    assert(!host.querySelector('.crew-accommodation-row'),'Completed crew work is still visible');
    const now=w.simNow();
    host.innerHTML=w.AeroUi.requestStatus({title:'Station service',label:'Service in progress',pending:true,startAt:now-10*MIN,endAt:now+10*MIN});
    const statusNode=host.firstElementChild;w.AeroUi.refreshProgress(host);
    assert(statusNode===host.firstElementChild&&host.querySelector('[role="progressbar"]').getAttribute('aria-valuenow')==='50','Progress refresh replaced the receipt or calculated the wrong progress');
    host.innerHTML=w.AeroUi.requestStatus({title:'Route request',label:'Partially accepted',detail:'ATC approved part of the shortcut.',facts:[['Recovered','8 min'],['Cost','EUR 500']]});
    assert(host.textContent.includes('Partially accepted')&&host.textContent.includes('8 min')&&!host.querySelector('button'),'Outcome is missing or replaced by another action list');
    host.remove();

    await clickTab('planning:route');
    assert(d.querySelectorAll('[data-dispatch-shorter-route]').length===1&&!d.querySelector('[data-recovery-option="direct"]'),'Direct routing is exposed twice');
    assert(d.querySelector('[data-dispatch-holding-plan]'),'Holding capability is hidden without an incident');
    assert(d.querySelectorAll('#occ-desk-planning [data-toggle-dispatch-swap]').length===1,'Aircraft swap context is duplicated');
    assert(!d.querySelector('#occ-desk-planning .occ-widget-state'),'Dispatch has a meaningless zero badge');
    assert(!d.querySelector('[data-desk-widget="network"]'),'Read-only network widget still exists');
    for(const key of ['planning:overview','planning:delay','planning:route']){
      await clickTab(key);assert(d.querySelector('[data-dispatch-selected-flight] [data-toggle-dispatch-swap]'),'Aircraft context disappears across Dispatch tabs');
    }
    const help=d.querySelector('#occ-desk-planning [data-help]');help.focus();
    assert(!d.querySelector('#ui-help').hidden&&help.getAttribute('aria-describedby')==='ui-help','Info tooltip is not keyboard accessible');
    help.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    assert(d.querySelector('#ui-help').hidden,'Escape does not close the tooltip');help.blur();

    // The unified route entry preserves filing on the ground and timed recovery in the air.
    w.coordinateShorterRoute(flight.id);
    assert(!flight.enrouteRecoveryRequest&&!flight.dispatchRouteRequest,'Ground filing unexpectedly became an airborne response workflow');
    assert(w.AeroRoutePlanning.activeRevision(flight.routePlan).mode==='direct','Ground route entry did not refile a direct route');
    const longAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'ATL');
    const airborne=w.createFlightRecord({aircraftId:longAc.id,from:'ATL',to:'ORD',departure:w.simNow()-45*MIN,fare:{economy:200,business:400,first:700}});
    const fuel=w.flightFuelPlan('ATL','ORD',longAc);
    Object.assign(airborne,{departureLogged:true,actualDeparture:airborne.departure,operationalDurationMs:airborne.arrival-airborne.departure,enrouteDelayMin:45,fueled:true,fuelOnboardAtDeparture:fuel.fuelCapacityGal,tripFuelGallons:fuel.tripBurnGal,fuelReserveGallons:fuel.reserveGal});
    longAc.fuelGallons=fuel.fuelCapacityGal;w.recalculateOperations();
    const before=w.flightActualArrival(airborne);w.coordinateShorterRoute(airborne.id);
    const request=airborne.enrouteRecoveryRequest;
    assert(request?.status==='pending'&&request.option==='direct','Airborne route entry bypassed the timed flight deck / ATC response');
    w.coordinateShorterRoute(airborne.id);
    assert(airborne.enrouteRecoveryRequest===request,'Repeated click sent a duplicate routing request');
    w.coordinateDispatchRouteRevision(airborne.id,'direct');
    assert(!airborne.dispatchRouteRequest,'Conflicting route request was allowed while awaiting recovery response');
    for(let i=0;i<100;i++){const id=`ui-direct-accepted-${i}`;if(w.stableFraction(`${id}:response`)>.8){request.id=id;break;}}
    request.respondsAt=w.simNow()-MIN;w.processEnrouteRecoveryRequests();w.recalculateOperations();
    assert(airborne.enrouteRecoveryRequest.status==='confirmed'&&w.flightActualArrival(airborne)<before,'Approved routing did not improve arrival');
    w.settleSelectedFlight(airborne.id);w.renderDeskStack(true,true);
    assert(d.querySelector('.enroute-result-card')?.textContent.includes('Accepted'),'Approved response is not visible in Dispatch');

    // Layout must remain readable at both responsive boundaries and on a small phone.
    for(const width of [1600,1280,900,680,390]){
      frame.style.width=`${width}px`;await wait(120);
      assert(d.documentElement.scrollWidth<=width+2,`Page overflows at ${width}px`);
      if(width<=900){
        const clock=d.querySelector('#simClock'),nav=d.querySelector('.compact-navigation'),center=d.querySelector('#center-workspace');
        assert(w.getComputedStyle(clock).display!=='none'&&clock.getBoundingClientRect().height>0,`Clock hidden at ${width}px`);
        assert(center.getBoundingClientRect().width<=width+2,`Map/schedule wider than viewport at ${width}px`);
        assert(w.getComputedStyle(nav).display!=='none','Compact navigation hidden');
        assert(d.querySelector('#occ-desk-warnings').getBoundingClientRect().top<d.querySelector('#occ-desk-planning').getBoundingClientRect().top,'Attention is below operational desks on a narrow screen');
      }
    }
    result.textContent='PASS shared widget controls, complete work lists, progress, tooltips, selectors and responsive layout';
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
