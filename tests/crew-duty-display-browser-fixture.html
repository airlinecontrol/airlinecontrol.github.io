<!doctype html>
<meta charset="utf-8">
<title>Crew coverage presentation</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result'),frame=document.getElementById('game');
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=crew-duty-display';await loaded;
    const w=frame.contentWindow,d=frame.contentDocument,s=w.eval('state');
    const HOUR=3_600_000,now=Date.UTC(2026,8,15,10);
    s.clock={simBase:now,realBase:Date.now(),speed:0,paused:true,previousSpeed:1};
    s.ops.automaticDisruptions=false;
    s.aircraft=[];s.flights=[];s.problems=[];
    const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'LHR',departure:now+HOUR,fare:{economy:140,business:360,first:700}});
    const role=(start,max)=>({dutyStart:start,dutyEnd:now+5*HOUR,dutyHours:(now+5*HOUR-start)/HOUR,maxHours:max,legal:true});
    const duty={id:'CD-DISPLAY',aircraftId:aircraft.id,flightIds:[flight.id],dutyStart:now-3*HOUR,reportAt:now-3*HOUR,
      dutyEnd:now+5*HOUR,releaseAt:now+5*HOUR,dutyHours:8,maxHours:9,legal:true,status:'active',sectors:1,
      roleDuties:{captains:role(now-HOUR,11),firstOfficers:role(now-3*HOUR,9),cabinCrew:role(now-2*HOUR,10)},
      roleSwaps:[{role:'captains',at:now-HOUR}]};
    s.crewDuties=[duty];flight.crewDutyId=duty.id;
    w.invalidateOperationalIndex();w.refreshScheduleTimeline(true);
    const snapshot=JSON.stringify(duty),view=w.AeroCrewDutyUi.describe(duty);
    assert(view.different&&view.badge==='FO limit','First officer was not identified as the limiting role');
    assert(view.margin===1,'summary did not use the smallest role margin');
    assert(JSON.stringify(duty)===snapshot,'presentation mutated duty or assignment state');
    assert(view.tooltip.includes('Captain (replacement)')&&view.tooltip.includes('First officer')&&view.tooltip.includes('Cabin crew'),'separate role details are missing');
    const bar=()=>d.querySelector('[data-crew-duty="CD-DISPLAY"]');
    assert(d.querySelectorAll('.crew-duty-bar').length===1,'role detail expanded the schedule into multiple bars');
    assert(bar().textContent.includes('Crew coverage')&&bar().textContent.includes('FO limit'),'compact summary or limiting badge missing');
    assert(bar().classList.contains('warning'),'bar tone does not follow the limiting role margin');
    assert(bar().dataset.help===view.tooltip,'schedule and shared role detail disagree');
    assert(!bar().textContent.includes('11h'),'detailed duty calculations leaked into the compact bar');
    bar().dispatchEvent(new w.MouseEvent('mouseover',{bubbles:true}));
    const tooltip=d.getElementById('ui-help');
    assert(!tooltip.hidden&&tooltip.textContent===view.tooltip,'hover does not open the crew detail');
    assert(tooltip.classList.contains('multiline'),'role detail lost its line breaks');
    bar().dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    assert(tooltip.hidden,'Escape did not close the detail');
    bar().focus();
    assert(!tooltip.hidden,'keyboard focus does not expose role details');
    bar().dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    bar().click();
    assert(!tooltip.hidden,'click/tap does not expose role details');
    const host=d.createElement('div');host.innerHTML=w.crewDutyProgressMarkup(duty);
    assert(host.firstElementChild.dataset.help===view.tooltip,'flight-detail progress and schedule describe different duty information');

    // Role-only changes must invalidate the schedule even when coverage bounds stay fixed.
    duty.roleDuties.captains.maxHours=6.5;
    w.refreshScheduleTimeline(false);
    assert(bar().textContent.includes('CPT limit'),'limiting role badge stayed stale after a role-only change');
    const unchanged=bar();w.refreshScheduleTimeline(false);
    assert(bar()===unchanged,'unchanged role details keep rebuilding the schedule');
    duty.roleDuties.captains.maxHours=5;duty.roleDuties.captains.legal=false;duty.legal=false;
    w.refreshScheduleTimeline(false);
    assert(bar().classList.contains('illegal')&&bar().dataset.help.includes('1h 00m over limit'),'over-limit crew is not shown accurately');

    const common=role(now-3*HOUR,11);
    duty.roleDuties={captains:{...common},firstOfficers:{...common},cabinCrew:{...common}};
    duty.roleSwaps=[];duty.maxHours=11;duty.legal=true;
    w.refreshScheduleTimeline(false);
    assert(!w.AeroCrewDutyUi.describe(duty).different,'identical role duties were needlessly split');
    assert(!bar().querySelector('em')&&bar().dataset.help.includes('All required roles'),'common crew clocks should remain one concise summary');
    const overnight={...duty,dutyStart:now,reportAt:now,dutyEnd:now+24*HOUR,releaseAt:now+24*HOUR};
    assert(w.AeroCrewDutyUi.describe(overnight).tooltip.includes(w.shortDay(now+24*HOUR)),'overnight coverage does not identify the release date');
    result.textContent='PASS\nShared and differing duties, limiting role, unchanged model, hover/tap/focus, margins and stable rendering';
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
