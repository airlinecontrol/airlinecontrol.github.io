<!doctype html>
<meta charset="utf-8">
<title>AOC warnings browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=warnings&cache='+Date.now();
    await loaded;
    if(typeof frame.contentWindow.resetLocalSave==='function') frame.contentWindow.resetLocalSave();
    const cleanLoaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=warnings&cache='+Date.now();
    await cleanLoaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.eval('state.ops.automaticDisruptions=false; state.flights=[]; state.aircraft=[]; state.incidents=[]; state.crewDuties=[]; state.services=[]; workspaceUi.dismissedWarnings={}; save(); saveWorkspaceUi();');

    const now=w.simNow();
    const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const first=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure:now+2*60*60_000,fare:{economy:140,business:360,first:700}});
    w.recalculateOperations();
    const second=w.createFlightRecord({aircraftId:ac.id,from:'LHR',to:'FRA',departure:w.flightActualArrival(first)+55*60_000,fare:{economy:140,business:360,first:700}});
    first.manualDelayMin=50;
    const coveredAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const coveredInbound=w.createFlightRecord({aircraftId:coveredAc.id,from:'FRA',to:'LHR',departure:now+3*60*60_000,fare:{economy:140,business:360,first:700}});
    w.recalculateOperations();
    const coveredOutbound=w.createFlightRecord({aircraftId:coveredAc.id,from:'LHR',to:'FRA',departure:w.flightActualArrival(coveredInbound)+55*60_000,fare:{economy:140,business:360,first:700}});
    coveredInbound.manualDelayMin=30;
    coveredOutbound.manualDelayMin=90;
    const shortAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'CDG');
    const shortFirst=w.createFlightRecord({aircraftId:shortAc.id,from:'CDG',to:'AMS',departure:now+5*60*60_000,fare:{economy:120,business:300,first:600}});
    w.recalculateOperations();
    w.createFlightRecord({aircraftId:shortAc.id,from:'AMS',to:'CDG',departure:w.flightActualArrival(shortFirst)+10*60_000,fare:{economy:120,business:300,first:600}});

    let fraClosed=now+30*60_000;
    for(let i=0;i<144&&w.airportNightStatus('FRA',fraClosed).status!=='closed';i++) fraClosed+=20*60_000;
    assert(w.airportNightStatus('FRA',fraClosed).status==='closed','fixture could not find a future FRA curfew');
    const nightAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const nightFlight=w.createFlightRecord({aircraftId:nightAc.id,from:'FRA',to:'CDG',departure:fraClosed,fare:{economy:120,business:300,first:600}});

    const maintenanceAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'AMS');
    w.eval(`{
      const ac=state.aircraft.find(item=>item.id==='${maintenanceAc.id}');
      ac.flightHours=550; ac.cycles=380;
      ac.maintenance={lastCheckHours:0,lastCheckCycles:0,scheduled:null};
    }`);
    const melAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const melFlight=w.createFlightRecord({aircraftId:melAc.id,from:'FRA',to:'CDG',departure:now+4*60*60_000,fare:{economy:120,business:300,first:0}});
    w.eval(`{
      const ac=state.aircraft.find(item=>item.id==='${melAc.id}');
      ac.melItems=[{id:'MEL-FIXTURE-32',code:'32-41',title:'Brake temperature indication fault',restriction:'Manual brake cooling calculation',category:'B',status:'open',deferredAt:${now-30*60_000},detectedAt:${now-30*60_000},expiresAt:${now+2*24*60*60_000},remainingCycles:6}];
      ac.maintenance={lastCheckHours:0,lastCheckCycles:0,scheduled:null};
    }`);
    const connectionInboundAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'HKG');
    const connectionOnwardAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'SIN');
    const connectionInbound=w.createFlightRecord({aircraftId:connectionInboundAc.id,from:'HKG',to:'SIN',departure:now-150*60_000,fare:{economy:120,business:300,first:0}});
    connectionInbound.arrival=now-50*60_000;
    connectionInbound.operationalDurationMs=connectionInbound.arrival-connectionInbound.departure;
    connectionInbound.manualDelayMin=80;
    connectionInbound.departureLogged=true;
    connectionInbound.pax=160;
    const connectionOnward=w.createFlightRecord({aircraftId:connectionOnwardAc.id,from:'SIN',to:'BKK',departure:w.nextSlotTime(connectionInbound.arrival+120*60_000,'SIN'),fare:{economy:120,business:300,first:0}});
    const alternateAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const alternateFlight=w.createFlightRecord({aircraftId:alternateAc.id,from:'FRA',to:'LHR',departure:now-70*60_000,fare:{economy:120,business:300,first:0}});
    alternateFlight.departureLogged=true;
    alternateFlight.arrival=now+95*60_000;
    alternateFlight.operationalDurationMs=alternateFlight.arrival-alternateFlight.departure;
    const originalAlternateSuitability=w.alternateSuitabilityContextForFlight;
    w.alternateSuitabilityContextForFlight=(flight,t)=>flight.id===alternateFlight.id
      ? {
        sourceId:flight.id,
        sourceKey:`alternate-suitability:${flight.id}:fixture`,
        destination:'LHR',
        airport:'LHR',
        conditions:'Thunderstorm cells',
        level:'caution',
        capacityPct:74,
        delayMin:28,
        availableAlternates:0,
        active:true
      }
      : originalAlternateSuitability(flight,t);

    w.recalculateOperations();
    second.actualDeparture=w.flightActualArrival(first)+30*60_000;
    second.actualArrival=second.actualDeparture+(second.arrival-second.departure);
    {
      const onwardDeparture=Math.max(w.flightActualDeparture(connectionOnward),now+90*60_000);
      connectionOnward.actualDeparture=onwardDeparture;
      connectionInbound.actualArrival=onwardDeparture-40*60_000;
    }
    w.updatePassengerConnections();
    w.eval(`{
      const duty=state.crewDuties.find(item=>item.flightIds.includes('${second.id}'));
      duty.maxHours=duty.dutyHours+1;
      duty.remainingHours=1;
      duty.legal=true;
    }`);

    const warnings=w.operationWarnings();
    {
      const transient={
        id:'fixture-transient-warning',
        type:'fixture',
        group:'Fixture warnings',
        level:'warning',
        owner:'Dispatch',
        flightId:first.id,
        aircraftId:first.aircraftId,
        title:'Fixture transient warning',
        detail:'Synthetic warning used to guard against warning flicker',
        sortAt:now
      };
      assert(w.stabilizeOperationWarnings([transient],now).some(item=>item.id===transient.id&&!item.clearing),'transient warning did not enter warning memory');
      assert(w.stabilizeOperationWarnings([],now+10*60_000).some(item=>item.id===transient.id&&item.clearing),'transient warning was removed before the warning stability window');
      assert(w.stabilizeOperationWarnings([],now+40*60_000).some(item=>item.id===transient.id&&item.clearing),'transient warning cleared before the warning stability window');
      assert(!w.stabilizeOperationWarnings([],now+70*60_000).some(item=>item.id===transient.id),'transient warning did not leave memory after the warning stability window');
    }
    assert(warnings.some(item=>item.type==='short_turn'),'short-turn warning was not derived');
    assert(!warnings.some(item=>item.type==='short_turn'&&item.flightId===second.id),'legal planned turn with actual delay should not be classified as a short-turn warning');
    assert(!warnings.some(item=>item.type==='short_turn'&&item.flightId===coveredOutbound.id),'outbound delay preserving turn time should not be classified as a short-turn warning');
    assert(warnings.some(item=>item.type==='late_inbound'),'late-inbound warning was not derived');
    assert(!warnings.some(item=>item.type==='late_inbound'&&item.flightId===coveredOutbound.id),'late-inbound warning should not fire when outbound delay preserves minimum turnaround');
    assert(warnings.some(item=>item.type==='night_conflict'),'night-curfew warning was not derived');
    assert(warnings.some(item=>item.type==='crew_duty'),'crew-duty warning was not derived');
    assert(warnings.some(item=>item.type==='maintenance'),'maintenance warning was not derived');
    assert(warnings.some(item=>item.type==='mel_restriction'&&item.aircraftId===melAc.id&&item.detail.includes('MEL 32-41')),'open MEL without scheduled maintenance did not create a restriction warning');
    assert(warnings.some(item=>item.type==='connection_risk'&&item.detail.includes(connectionOnward.id)),'connection-risk warning was not derived');
    assert(warnings.some(item=>item.type==='alternate_coverage'&&item.flightId===alternateFlight.id),'alternate suitability should be a warning');
    assert(!w.createIncident('alternate_unsuitable',alternateFlight,{training:true,detectedAt:now,source:'test'}),'alternate suitability should not be creatable as an incident');
    for(const retiredType of ['airport_capacity_reduction','gate_conflict','fueling_issue','baggage_loading_issue']){
      assert(!w.createIncident(retiredType,first,{training:true,detectedAt:now,source:'test'}),`${retiredType} should not be creatable as an incident`);
    }
    w.processDerivedOperationalIncidents(now);
    assert(!w.openIncidentsForFlight(alternateFlight.id).some(item=>item.type==='alternate_unsuitable'),'alternate suitability warning created an incident');
    w.renderDeskStack(true);
    assert(d.querySelector('[data-desk-widget="warnings"]'),'warning widget was not rendered');
    assert(!d.querySelector('[data-desk-widget="connections"]'),'connections widget should not be rendered');
    assert(d.querySelector('[data-desk-widget="warnings"]')?.textContent.includes(connectionOnward.id),'warnings widget does not show the affected onward connection');
    assert(!d.querySelector('[data-desk-widget="warnings"] .warning-summary-section'),'warning widget still renders the old duplicated summary section');
    assert(d.querySelectorAll('[data-desk-widget="warnings"] .warning-group-card').length>=4,'warning widget did not group warning families');
    assert([...d.querySelectorAll('[data-desk-widget="warnings"] .warning-group-card')].every(group=>group.querySelectorAll(':scope > .warning-row').length<=10),'warning groups should preview at most ten rows');
    if(warnings.some(item=>warnings.filter(other=>other.group===item.group).length>10)){
      assert(d.querySelector('[data-desk-widget="warnings"] .warning-group-more'),'warning groups with overflow should expose a compact disclosure');
    }
    assert(d.querySelector('[data-desk-widget="warnings"]')?.textContent.includes('MEL 32-41'),'warnings widget does not show MEL restriction detail');
    w.refreshMaintenanceRail(true);
    await wait(80);
    assert(d.querySelector('[data-rail-widget="maintenance"] [data-desk-panel="maintenance:schedule"]'),'maintenance rail does not expose the maintenance scheduler');
    d.querySelector('[data-rail-widget="maintenance"] [data-desk-panel="maintenance:schedule"]').click();
    await wait(100);
    const maintenancePanel=d.querySelector('[data-rail-widget="maintenance"] [data-maintenance-scheduler]');
    assert(maintenancePanel,'maintenance scheduler did not open for MEL rectification');
    const maintenanceAircraft=maintenancePanel.querySelector('[data-maintenance-work-aircraft]');
    maintenanceAircraft.value=melAc.id;
    maintenanceAircraft.dispatchEvent(new Event('change',{bubbles:true}));
    const maintenanceType=maintenancePanel.querySelector('[data-maintenance-work-type]');
    maintenanceType.value='mel_rectification';
    maintenanceType.dispatchEvent(new Event('change',{bubbles:true}));
    assert(maintenancePanel.querySelector('[data-maintenance-work-preview]')?.textContent.includes('MEL 32-41'),'maintenance scheduler preview does not show the selected MEL detail');
    const melRectificationButton=maintenancePanel.querySelector('[data-schedule-maintenance-work]');
    assert(melRectificationButton&&!melRectificationButton.disabled,'maintenance scheduler does not enable MEL rectification');
    const melRectificationInput=maintenancePanel.querySelector('[data-maintenance-work-start]');
    assert(melRectificationInput,'maintenance scheduler does not expose a MEL rectification date/time input');
    melRectificationInput.value=w.datetimeLocalValue(now+60*60_000);
    melRectificationInput.dispatchEvent(new Event('input',{bubbles:true}));
    w.confirm=()=>true;
    melRectificationButton.click();
    await wait(120);
    assert(w.eval(`state.aircraft.find(item=>item.id==='${melAc.id}')?.maintenance?.scheduled?.reason.includes('MEL rectification')`),'MEL rectification task did not create a MEL-specific maintenance booking');
    assert(w.eval(`state.aircraft.find(item=>item.id==='${melAc.id}')?.maintenance?.scheduled?.workType`)==='mel_rectification','MEL rectification booking did not use the MEL work type');
    assert(d.querySelector(`[data-rail-widget="maintenance"] [data-maintenance-job-card="${melAc.id}"]`)?.textContent.includes('MEL 32-41'),'maintenance rail does not show the booked MEL rectification job');
    assert(w.eval(`state.aircraft.find(item=>item.id==='${melAc.id}')?.maintenance?.scheduled?.durationHours < Management.maintenancePlan(state.aircraft.find(item=>item.id==='${melAc.id}'),${now+60*60_000},'FRA',MODELS.A320neo.seats).durationHours`),'MEL rectification should be shorter than a full scheduled check');
    assert(!w.operationWarnings(now+90*60_000).some(item=>item.type==='mel_restriction'&&item.aircraftId===melAc.id),'MEL warning should clear after a timely maintenance check is scheduled');
    assert(!Array.from(d.querySelectorAll('[data-desk-widget="warnings"] .warning-row em, [data-desk-widget="warnings"] .warning-group-card>header em')).some(node=>/dispatch|crew|maintenance/i.test(node.textContent)),'warning owner department labels should not be rendered');
    const flightWarning=d.querySelector(`[data-desk-widget="warnings"] [data-warning-flight="${second.id}"]`);
    assert(flightWarning,'clickable flight warning is missing');
    flightWarning.click();
    await wait(120);
    assert(w.eval(`selectedFlightId==='${second.id}'`),'clicking a warning did not select the affected flight');
    assert(d.querySelector(`#schedule-board .flight-block.selected[data-flight-id="${second.id}"]`),'selected warning flight is not highlighted in the schedule');
    const aircraftWarning=d.querySelector(`[data-desk-widget="warnings"] [data-warning-aircraft="${maintenanceAc.id}"]`);
    assert(aircraftWarning,'clickable aircraft warning is missing');
    aircraftWarning.click();
    await wait(120);
    assert(w.eval(`selectedAircraftId==='${maintenanceAc.id}'`),'clicking an aircraft warning did not select the affected aircraft');
    const dismissRow=d.querySelector('[data-desk-widget="warnings"] .warning-row');
    const dismissKey=dismissRow?.dataset.warningKey;
    assert(dismissRow?.querySelector('[data-dismiss-warning]'),'warning row does not expose a dismiss button');
    dismissRow.querySelector('[data-dismiss-warning]').click();
    await wait(120);
    assert(!d.querySelector(`[data-warning-key="${CSS.escape(dismissKey)}"]`),'dismissed warning is still visible in the widget');
    assert(w.operationWarnings().some(item=>w.warningDismissKey(item)===dismissKey),'dismiss should not delete the underlying derived warning');
    nightFlight.cancelled=true;
    w.recalculateOperations();
    assert(!w.operationWarnings().some(item=>item.flightId===nightFlight.id),'cancelled flight warning did not self-clear');

    {
      const staleAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'ATL');
      const staleFlight=w.createFlightRecord({aircraftId:staleAc.id,from:'ATL',to:'MCO',departure:now-45*60_000,fare:{economy:120,business:300,first:0}});
      staleFlight.departureLogged=true;
      staleFlight.actualDeparture=staleFlight.departure;
      staleFlight.actualArrival=now+75*60_000;
      staleFlight.operationalDurationMs=staleFlight.actualArrival-staleFlight.actualDeparture;
      const staleIncident={
        id:'INC_STALE_WX',
        type:'destination_weather_deterioration',
        flightId:staleFlight.id,
        aircraftId:staleAc.id,
        airport:'MCO',
        detectedAt:now-10*60_000,
        deadline:now+15*60_000,
        status:'open',
        severity:'warning',
        blocking:true,
        training:false,
        selectedAction:'',
        resolvedAt:0,
        outcome:'',
        automaticResolution:false,
        classification:'derived',
        workflowCreatedAt:now-10*60_000,
        overdue:false,
        recoveryPlan:'',
        recoveryPlanAt:0,
        source:'derived',
        sourceKey:'stale-destination-weather',
        context:{sourceId:staleFlight.id,airport:'MCO',conditions:'Rain showers',capacityPct:76,delayMin:22,active:true},
        lastDetectedAt:now-10*60_000,
        impacts:[]
      };
      w.eval(`{
        const staleIncident=${JSON.stringify(staleIncident)};
        state.incidents.push(staleIncident);
        state.coordinationTasks.push(...AeroOperationalWorkflows.tasksForIncident(staleIncident));
      }`);
      assert(w.processEvents(),'stale retired destination-weather incident was not repaired');
      assert(!w.openOperationalIncidents().some(item=>item.id==='INC_STALE_WX'),'retired destination-weather incident stayed open');
      w.renderDeskStack(true);
      assert(d.querySelector('[data-desk-widget="warnings"]'),'warning widget failed to render after stale retired incident cleanup');
      d.querySelector('[data-desk-widget="warnings"] [data-toggle-desk]')?.click();
      assert(true,'warning widget remains clickable after stale retired incident cleanup');
    }
    result.textContent='PASS warning widget validated';
  }catch(error){
    result.textContent='FAIL '+(error.stack||error);
  }
})();
</script>
