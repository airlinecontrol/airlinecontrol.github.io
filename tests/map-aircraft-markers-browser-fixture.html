<!doctype html>
<meta charset="utf-8">
<title>AeroSim map aircraft marker fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=map-aircraft-markers&cache='+Date.now();
    await loaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.resetLocalSave();
    w.eval('state.ops.automaticDisruptions=false');
    await wait(150);
    const now=w.simNow();

    const ground=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const airborneAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'LHR');
    const criticalAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'AMS');
    const taxiAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const airborne=w.createFlightRecord({aircraftId:airborneAc.id,from:'LHR',to:'CDG',departure:now-30*60_000,fare:{economy:140,business:360,first:700}});
    airborne.departureLogged=true;
    airborne.actualDeparture=airborne.departure;
    airborne.actualArrival=now+70*60_000;
    airborne.arrival=airborne.actualArrival;
    const critical=w.createFlightRecord({aircraftId:criticalAc.id,from:'AMS',to:'FRA',departure:now-45*60_000,fare:{economy:140,business:360,first:700}});
    critical.departureLogged=true;
    critical.actualDeparture=critical.departure;
    critical.actualArrival=now+80*60_000;
    critical.arrival=critical.actualArrival;
    const taxi=w.createFlightRecord({aircraftId:taxiAc.id,from:'FRA',to:'LHR',departure:now-2*60_000,fare:{economy:140,business:360,first:700}});
    taxi.departureLogged=true;
    taxi.actualDeparture=taxi.departure;
    taxi.actualArrival=now+90*60_000;
    taxi.arrival=taxi.actualArrival;
    const incident=w.createIncident('onboard_medical',critical,{training:true,detectedAt:now});
    assert(incident?.severity==='critical','fixture critical incident was not created');

    for(let i=0;i<60&&!w.__aeroMapReady;i++) await wait(100);
    w.updateMapData();
    for(let i=0;i<30&&d.querySelectorAll('.plane-shell').length<4;i++) await wait(100);
    assert(d.querySelector('#map.maplibregl-map'),'MapLibre map did not initialize');
    assert(w.eval(`map.getLayoutProperty('place_state','visibility')==='none'`),'state labels are still visible on the basemap');
    assert(w.eval(`map.getLayoutProperty('place_city','visibility')!=='none'`),'city labels should remain visible on the basemap');
    const markers=[...d.querySelectorAll('.plane-shell')];
    const groundMarker=markers.find(node=>node.textContent.includes(ground.tail));
    const airborneMarker=markers.find(node=>node.textContent.includes(airborne.id));
    const criticalMarker=markers.find(node=>node.textContent.includes(critical.id));
    const taxiMarker=markers.find(node=>node.textContent.includes(taxi.id));
    assert(groundMarker?.classList.contains('ground'),'grounded aircraft is not marked as ground');
    assert(groundMarker?.classList.contains('normal'),'grounded aircraft is not normal');
    assert(airborneMarker?.classList.contains('airborne'),'airborne aircraft is not marked as airborne');
    assert(airborneMarker?.classList.contains('normal'),'normal airborne aircraft is not normal');
    assert(taxiMarker?.classList.contains('taxi'),'taxiing aircraft is not marked as taxiing');
    assert(w.currentAircraftPosition(taxiAc,now).status==='taxi_out','current aircraft position does not expose taxi-out state');
    assert(criticalMarker?.classList.contains('airborne'),'critical aircraft should still be airborne');
    assert(criticalMarker?.classList.contains('critical'),'critical incident aircraft is not marked red-critical');
    const airborneColor=w.getComputedStyle(airborneMarker.querySelector('.plane-glyph')).color;
    const criticalColor=w.getComputedStyle(criticalMarker.querySelector('.plane-glyph')).color;
    assert(airborneColor.includes('255, 209, 102'),'airborne aircraft glyph is not yellow');
    assert(criticalColor.includes('255, 117, 143'),'critical aircraft glyph is not red');
    result.textContent='PASS map aircraft marker states validated';
  }catch(error){
    result.textContent='FAIL '+(error.stack||error);
  }
})();
</script>
