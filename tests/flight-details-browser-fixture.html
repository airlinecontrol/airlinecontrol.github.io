<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AeroSim flight details UI fixture</title></head>
<body>
<pre id="result">RUNNING</pre>
<iframe id="app" title="AeroSim test application" style="width:1280px;height:900px"></iframe>
<script>
  const HOUR=60*60*1000;
  const now=Date.now();
  const departure=now-HOUR;
  localStorage.removeItem('aerosim_occ_ui_v1');
  localStorage.setItem('aerosim_mvp_v6',JSON.stringify({
    version:6,clock:{realBase:now,simBase:now,speed:1},cash:0,home:'FRA',
    nextAircraft:3,nextFlight:2,nextService:1,nextSlotRight:1,nextIncident:1,
    aircraft:[{id:'AC1',tail:'D-AS01',model:'A320neo',cabin:{economy:150,business:15,first:0},location:'FRA',condition:98,flightHours:10,cycles:5,fuelGallons:0,acquisitionType:'requested',acquiredAt:now},{id:'AC2',tail:'D-AS02',model:'A320neo',cabin:{economy:150,business:15,first:0},location:'FRA',condition:99,flightHours:2,cycles:1,fuelGallons:0,acquisitionType:'requested',acquiredAt:now}],
    flights:[{id:'AS1',aircraftId:'AC1',from:'FRA',to:'LHR',departure,arrival:departure+2*HOUR,manualDelayMin:15,fare:160,fares:{economy:160,business:420,first:800},load:.8,pax:144,classPax:{economy:132,business:12,first:0},classLoads:{economy:.88,business:.8,first:0},revenue:26160,costs:19000,baseCosts:19000,settled:false,departureLogged:false}],
    services:[],incidents:[],slotRights:[],transactions:[],personnelTransfers:[],
    personnel:{assignments:{FRA:{captains:2,firstOfficers:2,cabinCrew:8,groundHandling:8,operations:2,customerService:2},LHR:{captains:2,firstOfficers:2,cabinCrew:8,groundHandling:8,operations:2,customerService:2}},qualifications:{FRA:{captains:{'Airbus A320 family':2},firstOfficers:{'Airbus A320 family':2}},LHR:{captains:{'Airbus A320 family':2},firstOfficers:{'Airbus A320 family':2}}},lastPayrollAt:now},
    fuelMarket:{pricePerGallon:2.45,updatedAt:now},ops:{automaticDisruptions:true},
    stats:{revenue:0,costs:0,staffCosts:0,leaseCosts:0,transferCosts:0,cancelled:0,pax:0,completed:0}
  }));

  const frame=document.getElementById('app');
  frame.addEventListener('load',()=>setTimeout(()=>{
    try{
      const doc=frame.contentDocument;
      const timelineFlight=doc.querySelector('[data-flight-id="AS1"]');
      if(!timelineFlight) throw new Error('timeline flight AS1 missing');
      timelineFlight.click();
      setTimeout(()=>{
        try{
          const pane=doc.getElementById('flightDetailsPane');
          const aircraftPane=doc.getElementById('aircraftDetailsPane');
          const detailsWidget=doc.querySelector('[data-widget="context-workbench"]');
          const firstRightWidget=doc.querySelector('.sidebar.right > .sidebar-widget');
          const leftSidebar=doc.querySelector('.sidebar:not(.right)'),center=doc.getElementById('center-workspace'),rightSidebar=doc.querySelector('.sidebar.right');
          const nestedDetailStyle=frame.contentWindow.getComputedStyle(pane.querySelector('.flight-detail-section'));
          const queueItemStyle=frame.contentWindow.getComputedStyle(doc.querySelector('#occActiveFlightList .occ-item'));
          const fleetItemStyle=frame.contentWindow.getComputedStyle(doc.querySelector('#aircraftList .fleet-row.selected'));
          const parentWidgetStyle=frame.contentWindow.getComputedStyle(detailsWidget);
          const quietWidgetIds=['flight-planning','dispatch-control','crew-control','maintenance-control','station-operations','management-cycle','network-support','weather','personnel-relocation'];
          const requestWidgetIds=['flight-planner','aircraft-market','slot-market','request-personnel'];
          const problemAnchor=pane.querySelector('.flight-problem-nav [data-flight-anchor]');
          const problemTarget=problemAnchor?pane.querySelector(problemAnchor.getAttribute('href')):null;
          let problemAnchorScrolled=false;
          if(problemTarget){ problemTarget.scrollIntoView=()=>{ problemAnchorScrolled=true; }; problemAnchor.click(); }
          const selectedChecks={
            detailsFirst:firstRightWidget===detailsWidget,
            singleContextWorkbench:Boolean(detailsWidget&&!doc.querySelector('[data-widget="flight-details"],[data-widget="aircraft-details"]')),
            classicThreeColumnLayout:leftSidebar.getBoundingClientRect().right<=center.getBoundingClientRect().left&&center.getBoundingClientRect().right<=rightSidebar.getBoundingClientRect().left,
            dedicatedPaneOpen:detailsWidget.querySelector('.widget-header').getAttribute('aria-expanded')==='true',
            selectedFlightShown:pane.textContent.includes('AS1')&&pane.textContent.includes('FRA')&&pane.textContent.includes('LHR'),
            noDuplicateAircraftIdentity:(pane.textContent.match(/D-AS01/g)||[]).length===1,
            noDuplicateTimingPanels:!pane.querySelector('#flight-section-readiness,#flight-section-delay'),
            detailsAlwaysVisible:pane.querySelectorAll('section.flight-detail-section').length>=3&&!pane.querySelector('details.flight-detail-section'),
            parentWidgetBoundaryPreserved:parseFloat(parentWidgetStyle.borderTopWidth)>0,
            nestedDetailsFlattened:parseFloat(nestedDetailStyle.borderTopWidth)===0&&parseFloat(nestedDetailStyle.borderTopLeftRadius)===0,
            queueRowsFlattened:parseFloat(queueItemStyle.borderTopWidth)===0&&parseFloat(queueItemStyle.borderTopLeftRadius)===0,
            problemRowsStayNeutral:!queueItemStyle.boxShadow.includes('139, 58, 80')&&!fleetItemStyle.boxShadow.includes('139, 58, 80')&&!doc.querySelector('#occActiveFlightList .problem-dot,#aircraftList .problem-dot'),
            noInlineFlightDetails:!doc.querySelector('#aircraftList .flight-details-content')&&!doc.querySelector('#aircraftList .fleet-expanded'),
            aircraftStillHighlighted:Boolean(doc.querySelector('#aircraftList .fleet-row.selected')),
            scheduleRowHighlighted:Boolean(doc.querySelector('.sched-aircraft-row.selected-row .flight-block.selected')),
            flightActionsStayInDetails:Boolean(pane.querySelector('.flight-status-note')&&pane.textContent.includes('Flight airborne')&&!pane.querySelector('[data-acknowledge-flight="AS1"]')),
            attentionOnlyAcknowledges:Boolean(doc.querySelector('#occAttentionList [data-acknowledge-flight="AS1"]')&&!doc.querySelector('#occAttentionList [data-delay-flight],#occAttentionList [data-priority-fuel],#occAttentionList [data-cancel-flight],#occAttentionList [data-resolve-incident]')),
            flightOperationsGrouped:Boolean(doc.querySelector('[data-widget="flight-operations"] #occAttentionList')&&doc.querySelector('[data-widget="flight-operations"] #occActiveFlightList [data-occ-flight="AS1"]')&&doc.querySelector('[data-widget="flight-operations"] #occUpcomingFlightList')),
            problemAnchorsVisible:Boolean(pane.querySelector('.flight-problem-nav [data-flight-anchor]')),
            problemAnchorsJump:problemAnchorScrolled,
            networkGroupedByAirport:Boolean(doc.querySelector('[data-widget="network-support"] #networkAirportList .network-airport-row')&&doc.querySelector('#networkAirportList .network-resource-label')),
            weatherIsSeparateWidget:Boolean(doc.querySelector('[data-widget="weather"] #weatherList')&&!doc.querySelector('[data-widget="network-support"] #weatherList')),
            relocationIsSeparateWidget:Boolean(doc.querySelector('[data-widget="personnel-relocation"] #transferPersonnelBtn')&&!doc.querySelector('[data-widget="network-support"] #transferPersonnelBtn')),
            activeProgressVisible:Boolean(doc.querySelector('#occActiveFlightList [data-occ-flight="AS1"] .active-flight-progress')),
            problemReasonsVisible:Boolean(doc.querySelector('#occActiveFlightList [data-occ-flight="AS1"] .problem-reason-badge')&&doc.querySelector('#aircraftList [data-aircraft-id="AC1"] .problem-reason-badge')),
            performanceMovedToHeader:!doc.querySelector('[data-widget="performance"]')&&['kpiOnTime','kpiCompletion','kpiLoadFactor','kpiAverageDelay','kpiUtilization','kpiFlights'].every(id=>doc.getElementById(id)),
            topBarFits:doc.querySelector('header').scrollWidth<=doc.querySelector('header').clientWidth+1,
            globalSearchRemoved:!doc.getElementById('leftSidebarSearch'),
            requestPanelsRemovedFromDashboard:requestWidgetIds.every(id=>!doc.querySelector(`[data-widget="${id}"]`)),
            requestMenuClosedByDefault:doc.getElementById('resourceMenu').hidden&&doc.getElementById('resourceMenuToggle').getAttribute('aria-expanded')==='false',
            quietDefaults:quietWidgetIds.every(id=>doc.querySelector(`[data-widget="${id}"] > .widget-header`)?.getAttribute('aria-expanded')==='false')
          };
          doc.querySelector('#occAttentionList [data-acknowledge-flight="AS1"]').click();
          selectedChecks.attentionAcknowledgeWorks=!doc.querySelector('#occAttentionList [data-occ-flight="AS1"]')&&Boolean(JSON.parse(localStorage.getItem('aerosim_mvp_v6')).flights[0].issueAcknowledgedKey);
          pane.querySelector('[data-close-flight-details]').click();
          doc.querySelector('[data-aircraft-toggle="AC1"]').click();
          selectedChecks.dedicatedAircraftPane=aircraftPane.textContent.includes('D-AS01')&&aircraftPane.textContent.includes('A320neo')&&!aircraftPane.hidden&&pane.hidden&&detailsWidget.querySelector('.widget-header').getAttribute('aria-expanded')==='true';
          selectedChecks.aircraftNotInline=!doc.querySelector('#aircraftList .aircraft-details-content')&&!doc.querySelector('#aircraftList .fleet-expanded');
          aircraftPane.querySelector('[data-close-aircraft-details]').click();
          selectedChecks.closeReturnsOverview=pane.textContent.includes('Network overview')&&!pane.hidden&&aircraftPane.hidden;
          const requestMenu=doc.getElementById('resourceMenu');
          doc.getElementById('resourceMenuToggle').click();
          doc.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
          selectedChecks.requestMenuEscapeCloses=requestMenu.hidden;
          doc.getElementById('resourceMenuToggle').click();
          doc.body.click();
          selectedChecks.requestMenuOutsideClickCloses=requestMenu.hidden;
          doc.getElementById('resourceMenuToggle').click();
          selectedChecks.requestMenuFirstLevel=['aircraft','slots','personnel'].every(page=>doc.querySelector(`[data-resource-page="${page}"]`))&&!doc.querySelector('[data-resource-page="flight"]');
          doc.querySelector('[data-resource-page="aircraft"]').dispatchEvent(new frame.contentWindow.MouseEvent('mouseenter'));
          selectedChecks.submenuOpensOnHover=!doc.getElementById('resourceMenuPage-aircraft').hidden;
          selectedChecks.aircraftRequestMoved=Boolean(doc.querySelector('#resourceMenuPage-aircraft [data-request-aircraft]'));
          const rootRect=doc.getElementById('resourceMenuRoot').getBoundingClientRect();
          const submenuRect=doc.getElementById('resourceMenuPage-aircraft').getBoundingClientRect();
          selectedChecks.submenuOpensToRight=submenuRect.left>=rootRect.right&&submenuRect.top===rootRect.top;
          doc.querySelector('[data-resource-page="slots"]').click();
          selectedChecks.slotRequestMoved=Boolean(doc.querySelector('#resourceMenuPage-slots #requestSlotBtn'));
          doc.querySelector('[data-resource-page="personnel"]').click();
          selectedChecks.personnelRequestMoved=Boolean(doc.querySelector('#resourceMenuPage-personnel #requestPersonnelBtn'));
          doc.body.click();
          const planner=doc.querySelector('[data-widget="flight-planning"]');
          planner.querySelector('.widget-header').click();
          selectedChecks.flightPlannerWidget=Boolean(planner.querySelector('#scheduleBtn')&&[...doc.getElementById('scheduleType').options].some(option=>option.value==='ferry'));
          doc.getElementById('scheduleType').value='once';
          doc.getElementById('aircraft').value='AC1';
          doc.getElementById('origin').value='LHR';
          doc.getElementById('destination').value='AMS';
          const nextTime=new Date(now+8*HOUR);
          doc.getElementById('departureTime').value=`${String(nextTime.getHours()).padStart(2,'0')}:${String(nextTime.getMinutes()).padStart(2,'0')}`;
          frame.contentWindow.scheduleFlight();
          let scheduledSave=JSON.parse(localStorage.getItem('aerosim_mvp_v6'));
          selectedChecks.plannerClosesAfterSchedule=planner.querySelector('.widget-header').getAttribute('aria-expanded')==='false'&&scheduledSave.flights.some(flight=>flight.from==='LHR'&&flight.to==='AMS');
          planner.querySelector('.widget-header').click();
          doc.getElementById('scheduleType').value='ferry';
          doc.getElementById('aircraft').value='AC2';
          doc.getElementById('scheduleType').dispatchEvent(new frame.contentWindow.Event('change'));
          doc.getElementById('destination').value='MAD';
          const ferryTime=new Date(now+3*HOUR);
          doc.getElementById('departureTime').value=`${String(ferryTime.getHours()).padStart(2,'0')}:${String(ferryTime.getMinutes()).padStart(2,'0')}`;
          frame.contentWindow.scheduleFlight();
          scheduledSave=JSON.parse(localStorage.getItem('aerosim_mvp_v6'));
          const checks={
            ...selectedChecks,
            ferryIntegratedInPlanner:planner.querySelector('.widget-header').getAttribute('aria-expanded')==='false'&&scheduledSave.flights.some(flight=>flight.flightType==='ferry'&&flight.aircraftId==='AC2'&&flight.from==='FRA'&&flight.to==='MAD')
          };
          const passed=Object.values(checks).every(Boolean);
          document.getElementById('result').textContent=`${passed?'PASS':'FAIL'} ${JSON.stringify(checks)}`;
        }catch(error){ document.getElementById('result').textContent=`FAIL ${error.stack||error}`; }
      },250);
    }catch(error){ document.getElementById('result').textContent=`FAIL ${error.stack||error}`; }
  },1300));
  frame.src='../airline-manager-mvp-v9.2.html?flight-details-smoke=1';
</script>
</body>
</html>
