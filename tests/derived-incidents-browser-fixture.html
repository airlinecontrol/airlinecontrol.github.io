<!doctype html>
<meta charset="utf-8">
<title>AeroSim derived incident fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const loadApp=async()=>{
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=derived-incidents&cache='+Date.now();
    await loaded;
  };
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    await loadApp();
    frame.contentWindow.resetLocalSave();
    await loadApp();
    const w=frame.contentWindow;
    const now=w.simNow();
    assert(!w.eval('INCIDENT_TYPE_ORDER.includes("baggage_loading_issue")'),'baggage loading should not be in the automatic/training OCC incident order');
    assert(!w.eval('PRE_DEPARTURE_INCIDENT_GENERATORS.some(item=>item.type==="baggage_loading_issue")'),'baggage loading should not be a random top-level OCC incident');
    for(const airport of ['FRA','AMS','CDG','LGW']){
      w.changeStaff(airport,'captains',20);
      w.changeStaff(airport,'firstOfficers',20);
      w.changeStaff(airport,'cabinCrew',40);
      w.changeStaff(airport,'groundHandling',40);
      w.changeStaff(airport,'operations',15);
      w.changeStaff(airport,'customerService',15);
      w.changeQualification(airport,'captains','Airbus A320 family',20);
      w.changeQualification(airport,'firstOfficers','Airbus A320 family',20);
    }

    const completeWaits=()=>w.processOperationalWorkflows(Number.MAX_SAFE_INTEGER);

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const inbound=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'AMS',departure:now-2*60*60_000,fare:{economy:120,business:300,first:0}});
      inbound.departureLogged=true;
      inbound.settled=false;
      inbound.actualDeparture=now-2*60*60_000;
      inbound.actualArrival=now-60_000;
      inbound.weatherChecked=true; inbound.constraintChecked=true; inbound.opsChecked=true; inbound.enrouteChecked=true;
      const outbound=w.createFlightRecord({aircraftId:aircraft.id,from:'AMS',to:'FRA',departure:now+70*60_000,fare:{economy:120,business:300,first:0}});
      outbound.weatherChecked=true; outbound.constraintChecked=true; outbound.opsChecked=true; outbound.enrouteChecked=true;
      aircraft.location='FRA';
      w.eval(`state.clock={...state.clock,realBase:Date.now(),simBase:${now},speed:0,paused:true};`);
      w.processEvents();
      assert(inbound.settled,'arrived inbound was not settled before constraint scanning');
      assert(aircraft.location==='AMS','arrived inbound did not update aircraft location before outbound positioning check');
      assert(!outbound.positioningBlocked,'outbound from the arrived airport was falsely marked out of position');
      assert(!w.openIncidentsForFlight(outbound.id).some(item=>item.type==='aircraft_out_of_position'||item.type==='aircraft_misposition_after_diversion'),'false aircraft-positioning incident opened during arrival settlement tick');
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'LGW',departure:now-45*60_000,fare:{economy:120,business:300,first:0}});
      flight.manualDelayMin=120;
      flight.actualDeparture=now+75*60_000;
      flight.actualArrival=flight.actualDeparture+(flight.arrival-flight.departure);
      flight.departureLogged=false;
      flight.fueled=true;
      flight.fuelOnboardAtDeparture=Math.max(1,Math.round((flight.tripFuelGallons||1000)+(flight.fuelReserveGallons||500)*.45));
      w.recalculateOperations();
      assert(w.statusOfFlight(flight,now)==='delayed','delayed ground flight was shown as airborne');
      assert(w.currentAircraftPosition(aircraft,now).status==='ground','delayed ground aircraft was positioned airborne');
      const airborneTypes=['onboard_medical','inflight_technical_fault','fuel_margin_low','atc_holding_fuel_conflict','airborne_atc_reroute','unruly_passenger','destination_weather_deterioration','destination_below_minima','alternate_unsuitable','diversion_airport_unavailable','lightning_strike','pressurization_issue','crew_duty_extension'];
      for(const type of airborneTypes){
        assert(!w.createIncident(type,flight,{detectedAt:now,source:'test',sourceKey:`ground:${type}:${flight.id}`}),`${type} was allowed before actual departure`);
      }
      const originalRoute=w.AeroWeatherEngine.routeHazardSummary;
      w.AeroWeatherEngine.routeHazardSummary=()=>({
        hazards:[{id:'GROUND-WX',label:'Thunderstorm cells',severity:'severe',delayMin:32,distanceKm:45}],
        delayMin:32,severe:true,label:'Thunderstorm cells',level:'severe'
      });
      assert(!w.maybeApplyLiveWeatherImpact(flight,now),'live weather created an airborne effect while the flight was still on the ground');
      assert(!w.maybeGenerateEnrouteIssue(flight,now),'random en-route issue generated while the flight was still on the ground');
      w.processDerivedOperationalIncidents(now);
      assert(!w.openIncidentsForFlight(flight.id).some(item=>airborneTypes.includes(item.type)),'delayed ground flight has airborne incidents');
      w.AeroWeatherEngine.routeHazardSummary=originalRoute;
    }

    {
      const staleAirborneTypes=w.eval(`Object.entries(INCIDENT_DEFINITIONS)
        .filter(([type,definition])=>definition.airborneOnly&&!RETIRED_INCIDENT_TYPES.has(type))
        .map(([type])=>type)`);
      const staleFailures=[];
      for(const type of staleAirborneTypes){
        const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
        const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'LGW',departure:now-(50+staleAirborneTypes.indexOf(type))*60_000,fare:{economy:120,business:300,first:0}});
        flight.departureLogged=true;
        flight.actualDeparture=flight.departure;
        flight.actualArrival=now+90*60_000;
        flight.fueled=true;
        if(type==='diversion_airport_unavailable') flight.diversionAirport='AMS';
        w.recalculateOperations();
        const incident=w.createIncident(type,flight,{detectedAt:now,source:'fixture',sourceKey:`stale-${type}:${flight.id}`,context:{sourceId:flight.id,active:true,airport:flight.to,delayMin:25}});
        if(!incident){ staleFailures.push(`${type}: not creatable while airborne`); continue; }
        flight.manualDelayMin=120;
        w.recalculateOperations();
        if(w.flightIsAirborne(flight,now)){ staleFailures.push(`${type}: fixture flight did not move before takeoff`); continue; }
        if(!w.repairIncidentPhaseRealism(now)){ staleFailures.push(`${type}: phase repair did not report a change`); continue; }
        if(type==='destination_closure'){
          if(incident.type!=='destination_closure_ground') staleFailures.push(`${type}: did not re-route to ground destination closure`);
        }else if(type==='bird_strike'){
          if(incident.type!=='mel_defect') staleFailures.push(`${type}: did not re-route to ground technical defect`);
        }else if(incident.status!=='resolved'||!incident.outcome.includes('has not taken off')){
          staleFailures.push(`${type}: stale airborne-only case remained open or unexplained`);
        }
      }
      assert(!staleFailures.length,'stale airborne-only phase repairs failed: '+staleFailures.join('; '));
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'MCO');
      const inbound=w.createFlightRecord({aircraftId:aircraft.id,from:'MCO',to:'ATL',departure:now-2*60*60_000,fare:{economy:120,business:300,first:0}});
      inbound.manualDelayMin=120;
      inbound.departureLogged=true;
      const next=w.createFlightRecord({aircraftId:aircraft.id,from:'ATL',to:'DFW',departure:now+75*60_000,fare:{economy:120,business:300,first:0}});
      next.incidentChecks.operationalGeneration=true;
      next.opsChecked=true;
      w.recalculateOperations();
      next.actualDeparture=w.flightActualArrival(inbound)+30*60_000;
      next.actualArrival=next.actualDeparture+(next.arrival-next.departure);
      const warning=w.lateInboundStatusForFlight(next,now,{aircraft,previous:inbound});
      assert(warning.active,`late inbound warning was not derived from actual rotation state: ${JSON.stringify(warning)} dep=${w.hhmm(next.departure)} actual=${w.hhmm(w.flightActualDeparture(next))} prevArr=${w.hhmm(w.flightActualArrival(inbound))}`);
      assert(warning.previousFlightId===inbound.id,'late inbound warning did not keep source flight context');
      w.processDerivedOperationalIncidents(now);
      assert(!w.openIncidentsForFlight(next.id).some(item=>item.type==='aircraft_late_inbound'),'late inbound created a standalone incident');
      const slotContext=w.slotMissContextForFlight(next);
      assert(slotContext.causeBreakdown.some(item=>item.label==='Late inbound / turn readiness'),'slot context did not explain the late inbound cause');
      assert(slotContext.plannedSlot&&slotContext.graceUntil&&slotContext.readyAt&&slotContext.assignedSlot,'slot context is missing timing context');
      w.recalculateOperations();
      w.processDerivedOperationalIncidents(now+60_000);
      assert(!w.openIncidentsForFlight(next.id).some(item=>item.type==='aircraft_late_inbound'),'late inbound reopened while the same source risk remained active');
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'AMS',departure:now+50*60_000,fare:{economy:120,business:300,first:0}});
      flight.handlingDelayMin=55;
      flight.incidentChecks.operationalGeneration=true;
      flight.opsChecked=true;
      w.recalculateOperations();
      assert(flight.slotMissed,'fixture flight did not miss its slot');
      w.processDerivedOperationalIncidents(now);
      assert(!w.openIncidentsForFlight(flight.id).some(item=>item.type==='slot_miss_risk'),'standalone slot miss incident was created from recalculated slot state');
      const context=w.slotMissContextForFlight(flight);
      assert(context.causeBreakdown.some(item=>item.label==='Handling delay'),'slot miss context did not record the handling delay cause');
      assert(context.causeBreakdown.some(item=>item.label==='Handling delay'&&item.minutes===55),'slot miss context did not include cause breakdown');
      assert(context.readyAt>=context.graceUntil,'slot miss readiness timing is inconsistent');
      const marker=w.flightSlotImpactState(flight);
      assert(marker.impacted,'schedule slot marker did not expose the slot miss context');
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'LHR');
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'AMS',departure:now+90*60_000,fare:{economy:120,business:300,first:0}});
      const sourceKey=`fixture-transient-position:${flight.id}`;
      const incident=w.createIncident('aircraft_out_of_position',flight,{detectedAt:now,source:'derived',sourceKey,context:{
        sourceId:flight.id,aircraftId:aircraft.id,tail:aircraft.tail,expectedLocation:'LHR',requiredLocation:'FRA',delayMin:30,active:true
      }});
      assert(incident,'transient derived incident fixture did not open');
      incident.firstVisibleAt=now;
      assert(w.updateOpenDerivedIncident('aircraft_out_of_position',flight,false,null,now+60_000),'transient derived incident should record pending-clear when the condition first clears');
      assert(incident.status==='open','transient derived incident vanished before the player could see it');
      assert(incident.conditionClearedAt===now+60_000,'transient derived incident did not enter pending-clear state');
      assert(!w.updateOpenDerivedIncident('aircraft_out_of_position',flight,false,null,now+29*60_000),'transient derived incident cleared before the stability grace window');
      assert(incident.status==='open','transient derived incident vanished during the stability grace window');
      assert(w.updateOpenDerivedIncident('aircraft_out_of_position',flight,false,null,now+32*60_000),'transient derived incident did not clear after the stability grace window');
      assert(incident.status==='resolved'&&incident.selectedAction==='condition_cleared','transient derived incident did not close as condition-cleared');
      const transitions=w.recentIncidentTransitions(10);
      assert(transitions.some(item=>item.incidentId===incident.id&&item.event==='opened'),'incident transition trace did not record open');
      assert(transitions.some(item=>item.incidentId===incident.id&&item.event==='auto_closed'&&item.details?.reason==='condition_cleared'),'incident transition trace did not record condition-cleared auto close');
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'AMS',departure:now-20*60_000,fare:{economy:120,business:300,first:0}});
      flight.departureLogged=true;
      w.recalculateOperations();
      const incident=w.createIncident('onboard_medical',flight,{detectedAt:now,source:'test',sourceKey:`medical:${flight.id}`,context:{authorityDecision:'continue'}});
      assert(incident,'airborne medical incident was not created');
      assert(w.performOperationalTask(`${incident.id}:dispatch-medical-assess`),'medical assessment was rejected');
      completeWaits();
      assert(w.performOperationalTask(`${incident.id}:dispatch-medical-decision`),'medical flight-deck response was rejected');
      completeWaits();
      assert(w.performOperationalTask(`${incident.id}:dispatch-medical-continue`),'medical continuation coordination was rejected');
      completeWaits();
      assert(incident.status==='resolved','airborne medical workflow did not resolve');
      assert(flight.enrouteDelayMin>=20,'medical continuation did not record en-route impact');
    }

    {
      const inboundAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'HKG');
      const onwardAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'SIN');
      const inbound=w.createFlightRecord({aircraftId:inboundAc.id,from:'HKG',to:'SIN',departure:now-90*60_000,fare:{economy:120,business:300,first:0}});
      inbound.arrival=now+10*60_000;
      inbound.operationalDurationMs=inbound.arrival-inbound.departure;
      inbound.manualDelayMin=80;
      inbound.departureLogged=true;
      inbound.pax=180;
      const onward=w.createFlightRecord({aircraftId:onwardAc.id,from:'SIN',to:'BKK',departure:w.nextSlotTime(inbound.arrival+120*60_000,'SIN'),fare:{economy:120,business:300,first:0}});
      onward.incidentChecks.operationalGeneration=true;
      onward.opsChecked=true;
      w.recalculateOperations();
      {
        const onwardDeparture=Math.max(w.flightActualDeparture(onward),now+120*60_000);
        onward.actualDeparture=onwardDeparture;
        inbound.actualArrival=onwardDeparture-40*60_000;
      }
      w.updatePassengerConnections();
      assert(inbound.connectionCriticalPax>=10,'fixture did not create own-network critical connection passengers');
      w.processDerivedOperationalIncidents(now);
      assert(!w.openIncidentsForFlight(inbound.id).some(item=>item.type==='connection_risk'),'connection risk should not create a standalone incident');
      assert(w.eval(`!state.incidents.some(item=>item.type==='connection_risk'||(item.impacts||[]).some(impact=>impact.type==='connection_risk'))`),'connection risk should not remain as an incident impact');
      const manifest=w.connectionStatusForFlight(inbound);
      assert(manifest.connections.some(item=>item.flightId===onward.id&&item.ownNetwork),'connection manifest does not list the affected own onward flight');
      w.settleSelectedFlight(inbound.id);
      w.refreshAll();
      await wait(120);
      const widgetText=frame.contentDocument.querySelector('[data-desk-widget="warnings"]')?.textContent||'';
      const liveConnection=w.connectionStatusForFlight(inbound).connections.find(item=>item.flightId===onward.id);
      const liveStatus=liveConnection?.status==='at-risk'?'at risk':liveConnection?.status==='protected'?'ok':liveConnection?.status;
      if(['critical','at-risk'].includes(liveConnection?.status)){
        assert(widgetText.includes(onward.id)&&widgetText.includes(liveStatus),`warnings widget does not show the current own-network connection state: selected=${w.eval('selectedFlightId')} beforeRefresh=${JSON.stringify(manifest)} live=${JSON.stringify(liveConnection)} widget=${widgetText}`);
        assert(!frame.contentDocument.querySelector('[data-desk-widget="connections"]'),'connections widget should be removed from the right rail');
        frame.contentDocument.querySelector(`[data-warning-flight="${inbound.id}"]`)?.click();
        await wait(120);
        assert(w.eval(`selectedFlightId==='${inbound.id}'`),'clicking a connection warning did not select the inbound flight');
      }else{
        assert(!widgetText.includes(onward.id),'warnings widget should hide protected own-network connections');
      }
      assert(!widgetText.includes('ok'),'warnings widget should not show protected/ok connections');
      assert(!frame.contentDocument.querySelector('[data-protect-connections]'),'connection warning should not expose a hold-onward action');
    }

    {
      const inboundAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'HKG');
      const onwardAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'SIN');
      const inbound=w.createFlightRecord({aircraftId:inboundAc.id,from:'HKG',to:'SIN',departure:now-190*60_000,fare:{economy:120,business:300,first:0}});
      inbound.arrival=now-90*60_000;
      inbound.operationalDurationMs=inbound.arrival-inbound.departure;
      inbound.manualDelayMin=120;
      inbound.departureLogged=true;
      inbound.pax=160;
      const onward=w.createFlightRecord({aircraftId:onwardAc.id,from:'SIN',to:'BKK',departure:inbound.arrival+65*60_000,fare:{economy:120,business:300,first:0}});
      onward.departureLogged=true;
      onward.actualDeparture=onward.departure;
      onward.actualArrival=onward.arrival;
      w.recalculateOperations();
      w.updatePassengerConnections();
      const missed=w.connectionStatusForFlight(inbound).connections.find(item=>item.flightId===onward.id);
      assert(missed?.status==='missed','fixture did not create a missed own-network connection');
      w.settleSelectedFlight(inbound.id);
      w.refreshAll();
      await wait(120);
      const widgetText=frame.contentDocument.querySelector('[data-desk-widget="warnings"]')?.textContent||'';
      assert(!widgetText.includes(onward.id),'warnings widget should hide missed onward connections');
      assert(!widgetText.includes('missed'),'warnings widget should not show missed connection copy');
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'LGW',departure:now-90*60_000,fare:{economy:120,business:300,first:0}});
      flight.departureLogged=true;
      flight.fueled=true;
      flight.actualDeparture=flight.departure;
      flight.actualArrival=now+60*60_000;
      flight.operationalDurationMs=flight.actualArrival-flight.actualDeparture;
      flight.fuelOnboardAtDeparture=Math.max(1,Math.round((flight.tripFuelGallons||1000)+(flight.fuelReserveGallons||500)*.45));
      w.recalculateOperations();
      assert(w.processDerivedOperationalIncidents(now),'fuel margin scanner did not report a change');
      const incident=w.openIncidentsForFlight(flight.id).find(item=>item.type==='fuel_margin_low');
      assert(incident,'fuel margin incident was not created from projected fuel state');
      assert(incident.context.projectedLandingFuelGal<incident.context.reserveGal,'fuel margin context is not below reserve');
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const outbound=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'MAD',departure:now-2*60*60_000,fare:{economy:160,business:420,first:0},serviceId:'SVC-DUTY-EXT',serviceLeg:'outbound'});
      outbound.departureLogged=true;
      outbound.actualDeparture=outbound.departure+30*60_000;
      outbound.manualDelayMin=45;
      outbound.enrouteDelayMin=8*60;
      outbound.operationalDurationMs=2*60*60_000;
      outbound.actualArrival=outbound.actualDeparture+outbound.operationalDurationMs+outbound.enrouteDelayMin*60_000;
      const ret=w.createFlightRecord({aircraftId:aircraft.id,from:'MAD',to:'FRA',departure:outbound.arrival+90*60_000,fare:{economy:160,business:420,first:0},serviceId:'SVC-DUTY-EXT',serviceLeg:'return'});
      ret.operationalDurationMs=2*60*60_000;
      ret.arrival=ret.departure+ret.operationalDurationMs;
      ret.actualArrival=ret.arrival;
      w.recalculateOperations();
      assert(w.flightIsAirborne(outbound,now),'crew-duty extension fixture flight is not airborne');
      assert(w.processDerivedOperationalIncidents(now),'crew duty extension scanner did not report a change');
      const incident=w.openIncidentsForFlight(outbound.id).find(item=>item.type==='crew_duty_extension');
      assert(incident,'crew duty extension incident was not created from airborne duty projection');
      assert(incident.context.overrunMin>=10,'crew duty extension context is missing overrun minutes');
      assert(incident.context.causeBreakdown.some(item=>item.label==='Enroute delay'||item.label==='Manual OCC hold'),'crew duty extension context did not explain the delay source');
      assert(incident.context.nextFlightId===ret.id,'crew duty extension did not identify the downstream sector');
      const strategy=w.incidentTasks(incident.id).find(item=>item.key==='crew-extension-strategy');
      assert(!strategy.strategyOptions.some(option=>option.id==='cancel'),'airborne crew duty extension should not offer cancellation');
      assert(w.operationalOptionConsequence(strategy,incident,'record_extension').includes('duty extension'),'crew extension consequence should explain the duty-extension record');
      assert(w.performOperationalTask(strategy.id,'record_extension'),'crew extension record strategy was rejected');
      const recordTask=w.incidentTasks(incident.id).find(item=>item.key==='crew-extension-record');
      assert(recordTask?.status==='available','crew extension record task did not unlock after choosing the record path');
      assert(w.performOperationalTask(recordTask.id),'crew extension record task was rejected');
      completeWaits();
      assert(incident.status==='resolved','crew duty extension record path did not resolve');
      assert(outbound.crewDutyExtensionRecordedAt,'crew duty extension was not recorded on the flight');
    }

    {
      const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'LHR');
      const flight=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'AMS',departure:now+3*60*60_000,fare:{economy:120,business:300,first:0}});
      flight.positioningBlocked=true;
      flight.positioningDelayMin=30;
      flight.incidentChecks.operationalGeneration=true;
      flight.opsChecked=true;
      w.recalculateOperations();
      assert(w.processDerivedOperationalIncidents(now),'positioning scanner did not report a change');
      const incident=w.openIncidentsForFlight(flight.id).find(item=>item.type==='aircraft_out_of_position');
      assert(incident,'aircraft out-of-position incident was not created from positioning state');
      assert(incident.context.expectedLocation==='LHR'&&incident.context.requiredLocation==='FRA','positioning context did not explain aircraft location');
      w.ensureIncidentWorkflow(incident);
      const strategy=w.incidentTasks(incident.id).find(item=>item.key==='dispatch-position-strategy');
      assert(strategy.strategyOptions.some(option=>option.id==='position_ferry'),'positioning incident does not offer manual ferry recovery');
      assert(!strategy.strategyOptions.some(option=>option.id==='wait_position'),'positioning incident still offers wait-position recovery');
      assert(!w.performOperationalTask(w.incidentTasks(incident.id).find(item=>item.kind==='manual_ferry_required')?.id),'manual ferry task completed before a ferry existed');
      assert(incident.status==='open','positioning incident closed before manual ferry was created');
      assert(w.performOperationalTask(strategy.id,'position_ferry'),'could not choose manual ferry recovery');
      const ferry=w.createFlightRecord({aircraftId:aircraft.id,from:'LHR',to:'FRA',departure:now+5*60_000,fare:0,flightType:'ferry'});
      ferry.weatherChecked=true; ferry.constraintChecked=true; ferry.opsChecked=true; ferry.enrouteChecked=true;
      w.recalculateOperations();
      const ferryTask=w.incidentTasks(incident.id).find(item=>item.kind==='manual_ferry_required');
      assert(w.positioningFerryPlanState(incident).ready,'created ferry does not solve aircraft projection');
      assert(w.performOperationalTask(ferryTask.id),'manual ferry task did not complete after ferry creation');
      assert(incident.status==='resolved','positioning incident did not resolve after manual ferry confirmation');
    }

    {
      const aircraft=w.assignRequestedAircraft('E190',w.defaultCabin('E190'),'VIE');
      const first=w.createFlightRecord({aircraftId:aircraft.id,from:'VIE',to:'LHR',departure:now+70*60_000,fare:{economy:120,business:300,first:0}});
      const broken=w.createFlightRecord({aircraftId:aircraft.id,from:'FRA',to:'VIE',departure:w.flightActualArrival(first)+75*60_000,fare:{economy:120,business:300,first:0}});
      first.weatherChecked=true; first.constraintChecked=true; first.opsChecked=true; first.enrouteChecked=true;
      broken.weatherChecked=true; broken.constraintChecked=true; broken.opsChecked=true; broken.enrouteChecked=true;
      w.recalculateOperations();
      assert(w.updatePositioningConstraints(now),'future positioning scanner did not detect a broken later leg');
      w.recalculateOperations();
      assert(broken.positioningBlocked,'later broken aircraft chain leg was not marked out of position');
      const context=w.aircraftOutOfPositionContextForFlight(broken,now);
      assert(context.expectedLocation==='LHR'&&context.requiredLocation==='FRA','future positioning context did not use the projected previous arrival airport');
      assert(w.processDerivedOperationalIncidents(now),'future positioning issue did not open an incident');
      assert(w.openIncidentsForFlight(broken.id).some(item=>item.type==='aircraft_out_of_position'),'later broken aircraft chain did not create an out-of-position incident');
    }

    result.textContent='PASS derived incidents validated';
  }catch(error){
    result.textContent='FAIL '+(error.stack||error);
  }
})();
</script>
