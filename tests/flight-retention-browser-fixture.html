<!doctype html>
<meta charset="utf-8">
<title>AOC flight retention browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=flight-retention&cache='+Date.now();
    await loaded;
    if(typeof frame.contentWindow.resetLocalSave==='function') frame.contentWindow.resetLocalSave();
    const cleanLoaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=flight-retention&cache='+Date.now();
    await cleanLoaded;
    const w=frame.contentWindow;
    const MIN=60_000,HOUR=60*MIN,DAY=24*HOUR;
    const base=w.simNow();
    w.eval(`
      state.ops.automaticDisruptions=false;
      state.aircraft=[];
      state.flights=[];
      state.services=[];
      state.problems=[];
      state.personnelTransfers=[];
      state.passengerRecoveries=[];
      state.crewRecoveries=[];
      state.crewDuties=[];
      state.flightHistory=[];
      state.warningRegistry={};
      state.clock={...state.clock,simBase:${Math.round(base)},realBase:Date.now(),speed:0,paused:true,previousSpeed:10};
      save();
    `);

    const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'ATL');
    const oldSettled=w.createFlightRecord({
      aircraftId:ac.id,from:'ATL',to:'MCO',departure:base-28*HOUR,
      fare:{economy:140,business:360,first:700}
    });
    oldSettled.departureLogged=true;
    oldSettled.settled=true;
    oldSettled.actualDeparture=oldSettled.departure;
    oldSettled.actualArrival=base-26*HOUR;
    oldSettled.arrival=base-26*HOUR-20*MIN;
    oldSettled.pax=128;
    oldSettled.revenue=18_000;
    oldSettled.costs=9_000;
    const oldCancelled=w.createFlightRecord({
      aircraftId:ac.id,from:'MCO',to:'ATL',departure:base-30*HOUR,
      fare:{economy:140,business:360,first:700}
    });
    oldCancelled.cancelled=true;
    oldCancelled.cancelledAt=base-29*HOUR;

    const recent=w.createFlightRecord({
      aircraftId:ac.id,from:'ATL',to:'DFW',departure:base-5*HOUR,
      fare:{economy:140,business:360,first:700}
    });
    recent.departureLogged=true;
    recent.settled=true;
    recent.actualDeparture=recent.departure;
    recent.arrival=base-3*HOUR;
    recent.actualArrival=base-150*MIN;

    const svc={
      id:'SCH_RETENTION',
      aircraftId:ac.id,
      from:'ATL',
      to:'JFK',
      fare:140,
      fares:{economy:140,business:360,first:700},
      rule:'daily',
      turnaroundMin:90,
      firstDeparture:base+2*DAY,
      firstReturnDeparture:0,
      nextDeparture:base+10*DAY,
      originSlotRightId:'',
      destinationSlotRightId:'',
      lastGeneratedDeparture:base+4*DAY,
      active:true,
      createdAt:base
    };
    w.eval(`state.services.push(${JSON.stringify(svc)});`);
    const keptOut=w.createFlightRecord({aircraftId:ac.id,from:'ATL',to:'JFK',departure:base+2*DAY+20*HOUR,fare:svc.fares,serviceId:svc.id,serviceLeg:'outbound'});
    const keptReturn=w.createFlightRecord({aircraftId:ac.id,from:'JFK',to:'ATL',departure:base+3*DAY+3*HOUR,fare:svc.fares,serviceId:svc.id,serviceLeg:'return'});
    const prunedOut=w.createFlightRecord({aircraftId:ac.id,from:'ATL',to:'JFK',departure:base+4*DAY,fare:svc.fares,serviceId:svc.id,serviceLeg:'outbound'});
    const prunedReturn=w.createFlightRecord({aircraftId:ac.id,from:'JFK',to:'ATL',departure:base+4*DAY+5*HOUR,fare:svc.fares,serviceId:svc.id,serviceLeg:'return'});
    w.processEvents();
    await wait(80);

    const ids=w.eval('state.flights.map(f=>f.id)');
    assert(!ids.includes(oldSettled.id),'settled flight older than 24h stayed in operational flights');
    assert(!ids.includes(oldCancelled.id),'cancelled flight older than 24h stayed in operational flights');
    assert(ids.includes(recent.id),'recent completed flight was pruned too early');
    assert(ids.includes(keptOut.id),'outbound inside the 3-day horizon was pruned');
    assert(ids.includes(keptReturn.id),'return paired to an in-horizon outbound was pruned');
    assert(!ids.includes(prunedOut.id),'future outbound beyond 3 days stayed in operational flights');
    assert(!ids.includes(prunedReturn.id),'future return beyond 3 days stayed in operational flights');
    assert(w.eval(`state.services.find(service=>service.id==='${svc.id}')?.nextDeparture`)===prunedOut.departure,'recurring nextDeparture was not rewound to the first pruned outbound');
    assert(w.eval(`state.flightHistory.some(item=>item.id==='${oldSettled.id}'&&item.settled&&item.pax===128)`),'old settled flight was not compacted into history');
    assert(w.eval(`state.flightHistory.some(item=>item.id==='${oldCancelled.id}'&&item.cancelled)`),'old cancelled flight was not compacted into history');
    const kpis=w.AeroManagement.operationalKpis(w.eval('state'),base,7,base-7*DAY,base);
    assert(kpis.completed>=2,`management KPIs did not include retained history and recent completed flights: ${JSON.stringify(kpis)} history=${JSON.stringify(w.eval('state.flightHistory'))} flights=${JSON.stringify(w.eval('state.flights.map(f=>({id:f.id,settled:f.settled,cancelled:f.cancelled,arrival:f.arrival,actualArrival:f.actualArrival}))'))}`);
    assert(kpis.cancelled>=1,`management KPIs did not include compact cancelled history: ${JSON.stringify(kpis)}`);

    result.textContent=`PASS flight retention validated
flights=${ids.length}
history=${w.eval('state.flightHistory.length')}
nextDeparture=${w.shortClock(w.eval(`state.services.find(service=>service.id==='${svc.id}')?.nextDeparture`))}`;
  }catch(error){
    result.textContent='FAIL '+(error.stack||error);
  }
})();
</script>
