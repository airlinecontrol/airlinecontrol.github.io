<!doctype html>
<meta charset="utf-8">
<title>AeroSim weather engine browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=weather-engine&cache='+Date.now();
    await loaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.resetLocalSave();
    await wait(150);

    assert(w.AeroWeatherEngine?.weatherAt,'weather engine was not exposed');
    const now=w.simNow();
    const station=w.AeroManagement.weatherAt('FRA',now);
    assert(Number.isFinite(station.windKph)&&Number.isFinite(station.visibilityKm)&&Number.isFinite(station.ceilingFt),'airport weather is missing dispatch details');
    assert(['normal','caution','severe'].includes(station.level),'airport weather level is invalid');
    assert(station.impactRadiusKm>=30,'airport weather impact radius is missing');
    const sampleCell=Array.from({length:12},(_,index)=>w.AeroWeatherEngine.weatherCells(now+index*3*60*60_000)).flat().find(cell=>cell.polygon?.length>=8);
    assert(sampleCell,'weather cells do not expose real polygon geometry');
    assert(d.querySelector('#map.maplibregl-map canvas'),'MapLibre map canvas was not rendered');

    const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const flight=w.createFlightRecord({
      aircraftId:aircraft.id,
      from:'FRA',
      to:'JFK',
      departure:now-45*60_000,
      fare:{economy:180,business:480,first:900}
    });
    flight.departureLogged=true;
    flight.actualDeparture=flight.departure;
    flight.actualArrival=now+5*60*60_000;
    flight.operationalDurationMs=flight.actualArrival-flight.actualDeparture;
    const originalRoute=w.AeroWeatherEngine.routeHazardSummary;
    const originalWeather=w.AeroWeatherEngine.weatherAt;
    const forecastAircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const forecastFlight=w.createFlightRecord({
      aircraftId:forecastAircraft.id,
      from:'FRA',
      to:'AMS',
      departure:now+60*60_000,
      fare:{economy:180,business:480,first:900}
    });
    w.AeroWeatherEngine.weatherAt=(code,t)=>({
      airport:code,
      level:code==='AMS'?'caution':'normal',
      label:code==='AMS'?'Caution':'Normal',
      type:code==='AMS'?'rain':'clear',
      icon:code==='AMS'?'RA':'CLR',
      conditions:code==='AMS'?'Rain showers':'Normal operations',
      windKph:18,
      windDirection:240,
      gustKph:26,
      visibilityKm:code==='AMS'?5:20,
      ceilingFt:code==='AMS'?1500:7000,
      delayMin:code==='AMS'?18:0,
      capacityFactor:(code==='AMS' ? .78 : 1),
      validFrom:t,
      validUntil:t+3*60*60_000
    });
    w.AeroWeatherEngine.routeHazardSummary=()=>({
      hazards:[{id:'DEP-WX',label:'Thunderstorm cells',severity:'caution',delayMin:24,distanceKm:80}],
      delayMin:24,
      severe:false,
      label:'Thunderstorm cells',
      level:'caution'
    });
    assert(w.maybeApplyWeatherDelay(forecastFlight,now+10*60_000),'pre-departure weather delay was not applied');
    assert(forecastFlight.weatherCause?.sources?.some(item=>item.kind==='route_forecast'&&item.hazards.some(hazard=>hazard.id==='DEP-WX')),'pre-departure weather provenance did not store route forecast details');
    assert(w.slotMissContextForFlight(forecastFlight).causeBreakdown.some(item=>item.label==='Weather delay'&&item.detail.includes('Route forecast')&&item.detail.includes('DEP-WX')),'slot/weather cause detail does not explain weather source and timestamp');
    w.AeroWeatherEngine.weatherAt=originalWeather;
    w.AeroWeatherEngine.routeHazardSummary=originalRoute;

    w.AeroWeatherEngine.routeHazardSummary=()=>({
      hazards:[{id:'TEST-WX',label:'Thunderstorm cells',severity:'severe',delayMin:28,lat:47,lon:-12,radiusKm:250}],
      delayMin:28,
      severe:true,
      label:'Thunderstorm cells',
      level:'severe'
    });
    assert(w.maybeApplyLiveWeatherImpact(flight,now+31*60_000),'route weather impact was not applied');
    assert(flight.enrouteDelayMin>=28,'route weather did not add enroute delay');
    assert(flight.weatherRouteHazard.includes('Thunderstorm'),'route weather hazard label was not saved');
    assert(flight.weatherCause?.sources?.some(item=>item.kind==='live_route'&&item.hazards.some(hazard=>hazard.id==='TEST-WX')),'live route weather provenance did not store the triggering cell');
    assert(w.openIncidentsForFlight(flight.id).some(item=>item.type==='airborne_atc_reroute'&&item.context.hazards.some(hazard=>hazard.id==='TEST-WX')),'route weather did not open a derived airborne reroute incident');

    w.AeroWeatherEngine.routeHazardSummary=()=>({hazards:[],delayMin:0,severe:false,label:'',level:'normal'});
    w.AeroWeatherEngine.weatherAt=(code,t)=>({
      airport:code,
      level:'caution',
      label:'Caution',
      type:'rain',
      icon:'RA',
      conditions:'Rain showers',
      windKph:18,
      windDirection:240,
      gustKph:28,
      visibilityKm:4,
      ceilingFt:1100,
      delayMin:22,
      capacityFactor:.76,
      validFrom:t,
      validUntil:t+3*60*60_000
    });
    flight.weatherLiveChecks={period:-1,routeApplied:true};
    w.maybeApplyLiveWeatherImpact(flight,now+62*60_000);
    assert(!w.openIncidentsForFlight(flight.id).some(item=>item.type==='destination_weather_deterioration'),'destination weather deterioration should no longer open a derived incident');
    const destinationWeatherWarning=w.operationWarnings(now+62*60_000).find(item=>item.type==='destination_weather'&&item.flightId===flight.id);
    assert(destinationWeatherWarning&&destinationWeatherWarning.detail.includes('Rain showers')&&destinationWeatherWarning.detail.includes('possible +22 min'),'destination weather deterioration was not shown as a warning with forecast context');

    w.AeroWeatherEngine.weatherAt=(code,t)=>({
      airport:code,
      level:'caution',
      label:'Caution',
      type:'fog',
      icon:'FG',
      conditions:'Low visibility',
      windKph:10,
      windDirection:210,
      gustKph:16,
      visibilityKm:1.2,
      ceilingFt:400,
      delayMin:28,
      capacityFactor:.72,
      validFrom:t,
      validUntil:t+3*60*60_000
    });
    flight.weatherLiveChecks={period:-1,routeApplied:true};
    assert(w.maybeApplyLiveWeatherImpact(flight,now+75*60_000),'destination minima impact was not applied');
    const minimaContext=w.destinationBelowMinimaContextForFlight(flight,now+75*60_000);
    const openWeatherIncidents=w.openIncidentsForFlight(flight.id).map(item=>`${item.type}:${item.context?.minima||item.context?.conditions||''}`);
    assert(w.openIncidentsForFlight(flight.id).some(item=>item.type==='destination_below_minima'&&item.context.minima.includes('1.2')),`destination below minima did not open from low visibility/ceiling forecast; context=${JSON.stringify(minimaContext)} open=${openWeatherIncidents.join(', ')}`);
    assert(!w.operationWarnings(now+75*60_000).some(item=>item.type==='destination_weather'&&item.flightId===flight.id),'destination weather warning should be suppressed while below-minima incident is active');
    const taxiAc=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const taxiFlight=w.createFlightRecord({aircraftId:taxiAc.id,from:'FRA',to:'LHR',departure:now+2*60*60_000,fare:{economy:120,business:300,first:600}});
    w.recalculateOperations();
    assert(taxiFlight.taxiOutDelayMin>=6&&taxiFlight.taxiInDelayMin>=6,'low visibility weather did not derive taxi delay');
    assert(w.slotMissContextForFlight(taxiFlight).causeBreakdown.some(item=>item.label==='Taxi-out delay'&&item.detail.includes('Low visibility taxi procedures')),'taxi delay cause is missing from delay breakdown');

    w.AeroWeatherEngine.weatherAt=(code,t)=>({
      airport:code,
      level:'severe',
      label:'Severe',
      type:'fog',
      icon:'FG',
      conditions:'Low visibility',
      windKph:12,
      windDirection:240,
      gustKph:18,
      visibilityKm:.5,
      ceilingFt:200,
      delayMin:55,
      capacityFactor:.52,
      validFrom:t,
      validUntil:t+3*60*60_000
    });
    flight.weatherLiveChecks={period:-1,routeApplied:true};
    assert(w.maybeApplyLiveWeatherImpact(flight,now+93*60_000),'destination weather impact was not applied');
    const closure=w.openIncidentsForFlight(flight.id).find(item=>item.type==='destination_closure');
    assert(closure,'severe destination weather did not open an airborne closure case');
    flight.weatherLiveChecks={period:-1,routeApplied:true};
    w.maybeApplyLiveWeatherImpact(flight,now+4*60*60_000);
    const closuresAfterBucket=w.openIncidentsForFlight(flight.id).filter(item=>item.type==='destination_closure');
    assert(closuresAfterBucket.length===1&&closuresAfterBucket[0].id===closure.id,'continuous destination closure opened a duplicate case after the weather bucket changed');
    const duplicateAttempt=w.createIncident('destination_closure',flight,{detectedAt:now+4*60*60_000,source:'weather',sourceKey:`legacy-weather-destination:${flight.id}:next`,context:{airport:flight.to,reason:'fixture duplicate'}});
    assert(duplicateAttempt.id===closure.id,'same-flight destination closure did not reuse the existing open case');
    w.eval(`
      const keeper=state.incidents.find(item=>item.id==='${closure.id}');
      const duplicate={...keeper,id:'INC_DUP_DEST_FIXTURE',sourceKey:'legacy-weather-destination:${flight.id}:old-bucket',detectedAt:keeper.detectedAt+60000,lastDetectedAt:keeper.detectedAt+60000,selectedStrategy:'',context:{...(keeper.context||{}),reason:'fixture duplicate'}};
      state.incidents.push(duplicate);
      state.coordinationTasks.push(...OperationalWorkflows.tasksForIncident(duplicate));
    `);
    assert(w.openIncidentsForFlight(flight.id).filter(item=>item.type==='destination_closure').length===2,'fixture failed to create an old duplicate destination closure');
    assert(w.repairDuplicateOpenIncidents(now+4*60*60_000),'duplicate destination closure repair did not report a change');
    assert(w.openIncidentsForFlight(flight.id).filter(item=>item.type==='destination_closure').length===1,'duplicate destination closure repair left multiple open cases');
    assert(w.eval(`state.incidents.find(item=>item.id==='INC_DUP_DEST_FIXTURE')?.selectedAction==='duplicate_case_merged'`),'duplicate destination closure was not marked as merged');

    const lightningAircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'AMS');
    const lightningFlight=w.createFlightRecord({
      aircraftId:lightningAircraft.id,
      from:'AMS',
      to:'CDG',
      departure:now-90*60_000,
      fare:{economy:180,business:480,first:900}
    });
    lightningFlight.departureLogged=true;
    lightningFlight.actualDeparture=lightningFlight.departure;
    lightningFlight.actualArrival=now+90*60_000;
    lightningFlight.operationalDurationMs=lightningFlight.actualArrival-lightningFlight.actualDeparture;
    const originalCellsAtPoint=w.AeroWeatherEngine.cellsAtPoint;
    const originalStable=w.AeroWeatherEngine.stableUnit;
    w.AeroWeatherEngine.weatherAt=originalWeather;
    w.AeroWeatherEngine.cellsAtPoint=()=>[{id:'TEST-CB',type:'storm',label:'Thunderstorm cells',severity:'severe',delayMin:35,polygon:[{lat:0,lon:0},{lat:0,lon:1},{lat:1,lon:1},{lat:1,lon:0}]}];
    w.AeroWeatherEngine.stableUnit=()=>0;
    lightningFlight.weatherLiveChecks={period:-1};
    assert(w.maybeApplyLiveWeatherImpact(lightningFlight,now+31*60_000),'lightning weather crossing did not report a change');
    assert(w.openIncidentsForFlight(lightningFlight.id).some(item=>item.type==='lightning_strike'&&item.context.cellId==='TEST-CB'),'lightning strike was not derived from crossing a thunderstorm cell');

    w.AeroWeatherEngine.routeHazardSummary=originalRoute;
    w.AeroWeatherEngine.weatherAt=originalWeather;
    w.AeroWeatherEngine.cellsAtPoint=originalCellsAtPoint;
    w.AeroWeatherEngine.stableUnit=originalStable;
    result.textContent='PASS\nweather=airport+route+destination+reroute+lightning';
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
