<!doctype html>
<meta charset="utf-8">
<title>AOC unattended problem defaults browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=problem-defaults&cache='+Date.now();
    await loaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.resetLocalSave?.();
    const initial=w.simNow();
    const setNow=value=>w.eval(`state.clock={realBase:Date.now(),simBase:${value},speed:0,paused:true,previousSpeed:1}`);
    setNow(initial);
    w.eval('state.ops.automaticDisruptions=false; state.flights=[]; state.aircraft=[]; state.problems=[]; state.crewDuties=[]; state.services=[]; state.crewAssignments=[]; state.stationServiceRequests=[];');

    const aircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const departure=initial+30*60_000;
    const flight=w.createFlightRecord({
      aircraftId:aircraft.id,from:'FRA',to:'LHR',departure,
      fare:{economy:140,business:360,first:700}
    });
    const groundProblem=w.createProblem('security_screening',flight,{training:true,detectedAt:initial,sourceKey:'fixture:ground-default'});
    assert(groundProblem?.unattended?.flights?.[flight.id],'ground problem did not create a per-flight default record');
    assert(groundProblem.unattended.flights[flight.id].mode==='cancel_at_departure','ground problem has the wrong default mode');
    assert(groundProblem.unattended.flights[flight.id].deadline===departure,'ground cancellation is not aligned with departure');
    w.refreshAll();
    await wait(150);
    let card=d.querySelector(`[data-critical-incident="${groundProblem.caseId}"]`);
    assert(card?.querySelector('[data-problem-default-countdown]'),'problem card does not show the unattended-action countdown');
    assert(card.textContent.includes(`Auto-cancel ${flight.id}`),'ground countdown does not identify the affected flight');

    flight.handlingDelayMin=20;
    w.recalculateOperations();
    const revisedDeparture=w.flightActualDeparture(flight);
    setNow(departure+60_000);
    w.processProblems(w.simNow());
    assert(!flight.cancelled,'revised actual departure did not move the automatic cancellation deadline');
    assert(groundProblem.unattended.flights[flight.id].deadline===revisedDeparture,'stored deadline did not follow the actual departure');
    setNow(revisedDeparture+60_000);
    w.processProblems(w.simNow());
    assert(flight.cancelled,'unresolved ground problem was not cancelled after its actual departure deadline');
    assert(groundProblem.status==='resolved'&&groundProblem.automaticResolution,'ground problem did not record its automatic outcome');

    const responseBase=w.simNow()+10*60_000;
    setNow(responseBase);
    const responseAircraft=w.assignRequestedAircraft('E190',w.defaultCabin('E190'),'FRA');
    const responseDeparture=responseBase+30*60_000;
    const responseFlight=w.createFlightRecord({aircraftId:responseAircraft.id,from:'FRA',to:'AMS',departure:responseDeparture,fare:{economy:120,business:290,first:550}});
    const responseProblem=w.createProblem('security_screening',responseFlight,{training:true,detectedAt:responseBase,sourceKey:'fixture:pending-response'});
    responseFlight.dispatchRouteRequest={status:'pending',label:'ATC route response',requestedAt:responseBase,respondsAt:responseDeparture+20*60_000};
    setNow(responseDeparture+60_000);
    w.processProblems(w.simNow());
    const responseEntry=responseProblem.unattended.flights[responseFlight.id];
    assert(!responseFlight.cancelled,'flight was cancelled while a requested response was pending');
    assert(responseEntry.status==='waiting_response','pending request is not reflected in the default state');
    assert(responseEntry.deadline===responseDeparture+30*60_000,'pending response did not add the review window');
    responseFlight.dispatchRouteRequest={...responseFlight.dispatchRouteRequest,status:'denied',completedAt:responseDeparture+20*60_000};
    setNow(responseDeparture+29*60_000);
    w.processProblems(w.simNow());
    assert(!responseFlight.cancelled,'flight was cancelled before the post-response review window ended');
    setNow(responseDeparture+31*60_000);
    w.processProblems(w.simNow());
    assert(responseFlight.cancelled,'flight was not cancelled after an unsuccessful response and review window');

    const sharedBase=w.simNow()+10*60_000;
    setNow(sharedBase);
    const sharedAircraftA=w.assignRequestedAircraft('E190',w.defaultCabin('E190'),'FRA');
    const sharedAircraftB=w.assignRequestedAircraft('E190',w.defaultCabin('E190'),'FRA');
    const sharedFlightA=w.createFlightRecord({aircraftId:sharedAircraftA.id,from:'FRA',to:'CDG',departure:sharedBase+20*60_000,fare:{economy:100,business:250,first:500}});
    const sharedFlightB=w.createFlightRecord({aircraftId:sharedAircraftB.id,from:'FRA',to:'AMS',departure:sharedBase+40*60_000,fare:{economy:100,business:250,first:500}});
    const sharedProblemA=w.createProblem('fuel_supplier_outage',sharedFlightA,{training:true,detectedAt:sharedBase,sourceKey:'fixture:shared-default',context:{airport:'FRA',active:true,reason:'Fixture fuel outage'}});
    const sharedProblemB=w.createProblem('fuel_supplier_outage',sharedFlightB,{training:true,detectedAt:sharedBase+60_000,sourceKey:'fixture:shared-default',context:{airport:'FRA',active:true,reason:'Fixture fuel outage'}});
    assert(sharedProblemA.id===sharedProblemB.id,'airport problem did not remain shared across affected flights');
    w.processProblems(w.simNow());
    setNow(sharedFlightA.departure+60_000);
    w.processProblems(w.simNow());
    assert(sharedFlightA.cancelled,'first flight in shared airport problem did not reach its own default');
    assert(!sharedFlightB.cancelled,'first shared deadline cancelled a later affected flight');
    assert(sharedProblemA.status==='open','shared airport problem closed when only its primary flight was cancelled');
    setNow(sharedFlightB.departure+60_000);
    w.processProblems(w.simNow());
    assert(sharedFlightB.cancelled&&sharedProblemA.status==='resolved','shared airport problem did not finish after all affected flights reached their defaults');

    const airborneBase=w.simNow()+10*60_000;
    setNow(airborneBase);
    const airborneAircraft=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
    const airborneFlight=w.createFlightRecord({aircraftId:airborneAircraft.id,from:'FRA',to:'LHR',departure:airborneBase-30*60_000,fare:{economy:140,business:360,first:700}});
    airborneFlight.departureLogged=true;
    airborneFlight.actualDeparture=airborneBase-30*60_000;
    airborneFlight.actualArrival=airborneBase+90*60_000;
    airborneFlight.arrival=airborneFlight.actualArrival;
    airborneFlight.operationalDurationMs=airborneFlight.actualArrival-airborneFlight.actualDeparture;
    const airborneProblem=w.createProblem('destination_below_minima',airborneFlight,{training:true,detectedAt:airborneBase,sourceKey:'fixture:airborne-default'});
    assert(airborneProblem.unattended.flights[airborneFlight.id].mode==='divert','airborne problem has the wrong safety default');
    setNow(airborneBase+16*60_000);
    w.processProblems(w.simNow());
    assert(Boolean(airborneFlight.diversionAirport),'airborne safety default did not select an operational alternate');
    assert(airborneProblem.status==='resolved'&&airborneProblem.automaticResolution,'airborne default outcome was not recorded');

    result.textContent=`PASS\nground=${flight.id}\nresponse=${responseFlight.id}\nshared=${sharedFlightA.id}+${sharedFlightB.id}\nairborne=${airborneFlight.id}->${airborneFlight.diversionAirport}`;
  }catch(error){result.textContent='FAIL\n'+(error.stack||error);}
})();
</script>
