<!doctype html>
<meta charset="utf-8">
<title>Recurring flight removal</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result'),frame=document.getElementById('game');
  const assert=(ok,message)=>{if(!ok)throw new Error(message);};
  const MIN=60000,HOUR=60*MIN,DAY=24*HOUR,now=Date.UTC(2026,8,21,12);
  let w,ac;
  const failures=[];
  async function load(){
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=recurring-flight-removal&cache='+Date.now();
    await loaded;w=frame.contentWindow;
  }
  function reset(){
    w.eval(`state=newState();state.clock={simBase:${now},realBase:Date.now(),speed:0,paused:true};state.ops.automaticDisruptions=false;selectedFlightId=null;selectedAircraftId=null;invalidateOperationalIndex();`);
    ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'ATL');
  }
  function schedule(rule='weekly'){
    const departure=now+2*HOUR;
    const duration=w.estimateFlight('ATL','MCO',ac,140,{departure}).duration;
    const service={id:'SCH_TEST',aircraftId:ac.id,from:'ATL',to:'MCO',fare:140,rule,
      turnaroundMin:90,firstDeparture:departure,firstReturnDeparture:departure+duration+90*MIN,
      nextDeparture:departure,lastGeneratedDeparture:null,active:true,createdAt:now};
    w.eval(`state.services.push(${JSON.stringify(service)})`);
    w.ensureRecurringFlights();
    return w.eval('state.services[0]');
  }
  function flights(){return w.eval('state.flights');}
  function matching(flight){
    return flights().filter(item=>item.serviceId===flight.serviceId&&item.serviceLeg===flight.serviceLeg&&item.departure===flight.departure);
  }
  function deleteByKey(flight,key='Delete'){
    w.applyFlightCancellation(flight,'Fixture cancellation');
    w.recalculateOperations();
    w.eval(`selectedFlightId=${JSON.stringify(flight.id)}`);
    w.refreshScheduleTimeline(true);
    assert(frame.contentDocument.querySelector(`.flight-block.cancelled[data-flight-id="${flight.id}"]`),'Cancelled flight not visible before deletion');
    frame.contentDocument.activeElement?.blur();
    w.dispatchEvent(new w.KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));
    assert(!flights().some(item=>item.id===flight.id),key+' did not remove the selected cancelled flight');
    w.refreshScheduleTimeline(true);
    assert(!frame.contentDocument.querySelector(`.flight-block[data-flight-id="${flight.id}"]`),'Deleted flight remains on the schedule');
  }
  function check(name,run){reset();try{run();}catch(error){failures.push(name+': '+error.message);}}
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    await load();
    for(const key of ['Delete','Backspace']){
      check(key+' keeps a recurring return removed',()=>{
        const service=schedule();
        const outbound=flights().find(item=>item.serviceLeg==='outbound');
        const returning=flights().find(item=>item.serviceLeg==='return');
        returning.manualDelayMin=35;
        deleteByKey(returning,key);
        for(let i=0;i<3;i++)w.ensureRecurringFlights();
        assert(!matching(returning).length,'Scheduler recreated the deleted return with a new ID');
        assert(matching(outbound).length===1,'Deleting the return changed its outbound');
        assert(service.active,'Deleting one occurrence stopped the recurring schedule');
        w.processEvents();
        assert(!matching(returning).length,'Simulation tick recreated the deleted return');
      });
    }
    check('Regeneration does not restore a deleted turnaround',()=>{
      const service=schedule();
      const pair=flights().slice();
      for(const flight of pair)w.applyFlightCancellation(flight,'Fixture turnaround cancellation');
      for(const flight of pair)deleteByKey(flight);
      service.nextDeparture=service.firstDeparture;
      w.ensureRecurringFlights();
      assert(pair.every(flight=>!matching(flight).length),'Rewinding the service restored a deleted turnaround');
      assert(service.active&&service.nextDeparture>service.firstDeparture,'Service did not advance past the omitted rotation');
    });
    check('Regeneration preserves an outbound deletion without duplicating its return',()=>{
      const service=schedule();
      const outbound=flights().find(item=>item.serviceLeg==='outbound');
      const returning=flights().find(item=>item.serviceLeg==='return');
      deleteByKey(outbound);
      service.nextDeparture=service.firstDeparture;
      w.ensureRecurringFlights();
      assert(!matching(outbound).length,'Regeneration restored a deleted outbound');
      assert(matching(returning).length===1&&!returning.cancelled,'Deleting outbound changed or duplicated its return');
    });
    check('Genuinely missing returns still regenerate',()=>{
      schedule();
      const returning=flights().find(item=>item.serviceLeg==='return');
      w.eval(`state.flights=state.flights.filter(item=>item.id!==${JSON.stringify(returning.id)});invalidateOperationalIndex();`);
      w.ensureRecurringFlights();
      assert(matching(returning).length===1,'Ordinary missing return was not repaired');
    });
    check('Visible cancellations remain cancelled during generation',()=>{
      const service=schedule();
      const pair=flights().slice();
      for(const flight of pair)w.applyFlightCancellation(flight,'Fixture cancellation');
      service.nextDeparture=service.firstDeparture;
      w.ensureRecurringFlights();
      assert(pair.every(flight=>matching(flight).length===1&&matching(flight)[0].cancelled),'Regeneration duplicated or revived visible cancelled flights');
    });
    check('Later rotations remain active after deleting an occurrence',()=>{
      const service=schedule();
      const returning=flights().find(item=>item.serviceLeg==='return');
      deleteByKey(returning);
      w.eval(`state.clock.simBase=${now+5*DAY}`);
      w.ensureRecurringFlights();
      assert(!matching(returning).length,'Extending horizon restored the removed return');
      const next=flights().filter(item=>item.departure>=now+7*DAY);
      assert(next.length===2&&next.every(item=>!item.cancelled),'Next weekly turnaround was not generated normally');
      assert(service.active,'Service was stopped');
    });
    check('Standalone removal remains independent of recurrence',()=>{
      const flight=w.createFlightRecord({aircraftId:ac.id,from:'ATL',to:'MCO',departure:now+2*HOUR,fare:140});
      deleteByKey(flight);
      w.ensureRecurringFlights();
      assert(!flights().length&&!w.eval('state.services.length'),'Standalone deletion created recurring state');
    });
    reset();
    const service=schedule();
    const returning=flights().find(item=>item.serviceLeg==='return');
    deleteByKey(returning);
    w.save();
    await load();
    w.ensureRecurringFlights();
    assert(!matching(returning).length,'Reload recreated the removed recurring flight');
    assert(w.eval(`state.services.find(item=>item.id===${JSON.stringify(service.id)}).active`),'Reload deactivated the service');
    assert(!failures.length,failures.join('\n'));
    result.textContent='PASS recurring flight removal: keyboard, generation, cancellations, horizon extension and reload';
  }catch(error){result.textContent='FAIL\n'+[...failures,error.stack||error].join('\n');}
})();
</script>
