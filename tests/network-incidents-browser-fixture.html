<!doctype html>
<meta charset="utf-8">
<title>AOC network incidents browser fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{ if(!condition) throw new Error(message); };
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=network-incidents&cache='+Date.now();
    await loaded;
    const w=frame.contentWindow,d=frame.contentDocument;
    w.resetLocalSave?.();
    w.eval(`
      state.ops.automaticDisruptions=false;
      state.aircraft=[];
      state.flights=[];
      state.incidents=[];
      state.coordinationTasks=[];
      state.externalRequests=[];
      state.networkEvents=[];
      selectedFlightId=null;
      selectedAircraftId=null;
      workspaceUi.operationFilter={airports:[],activeIncidents:false,delayed:false,weatherCell:null};
    `);

    const now=w.simNow();
    w.changeStaff('ATL','operations',4);
    const firstAircraft=w.assignRequestedAircraft('A220-300',w.defaultCabin('A220-300'),'ATL');
    const secondAircraft=w.assignRequestedAircraft('A220-300',w.defaultCabin('A220-300'),'ATL');
    const first=w.createFlightRecord({
      aircraftId:firstAircraft.id,
      from:'ATL',
      to:'JFK',
      departure:now+45*60_000,
      fare:{economy:170,business:460,first:0}
    });
    const second=w.createFlightRecord({
      aircraftId:secondAircraft.id,
      from:'ATL',
      to:'JFK',
      departure:now+95*60_000,
      fare:{economy:170,business:460,first:0}
    });
    w.recalculateOperations();

    const filedPoints=w.AeroRoutePlanning.routeCoordinatesForFlight(first).map(([lon,lat])=>({lat,lon}));
    const mid=filedPoints[Math.floor(filedPoints.length/2)];
    assert(mid,'fixture could not sample the filed route');
    const polygon=[
      {lat:mid.lat+2.0,lon:mid.lon-2.8},
      {lat:mid.lat+2.0,lon:mid.lon+2.8},
      {lat:mid.lat-2.0,lon:mid.lon+2.8},
      {lat:mid.lat-2.0,lon:mid.lon-2.8}
    ];
    w.eval(`state.networkEvents.push(${JSON.stringify({
      id:'NET-FIXTURE-AIRSPACE',
      manual:true,
      source:'fixture',
      eventType:'airspace_closure',
      incidentType:'network_airspace_closure',
      networkId:'fixture-airspace-closure',
      label:'Fixture restricted airspace',
      reason:'Regression fixture restricted area',
      severity:'critical',
      activeFrom:now-10*60_000,
      activeUntil:now+5*60*60_000,
      delayMin:44,
      rerouteDelayMin:26,
      minAffected:2,
      polygon
    })})`);

    assert(w.AeroNetworkEvents?.processNetworkOperationalIncidents,'network-event processor is not exposed');
    const candidate=w.AeroNetworkEvents.candidateNetworkEvents(now).find(event=>event.id==='NET-FIXTURE-AIRSPACE');
    assert(w.AeroNetworkEvents.affectedFlightsForNetworkEvent(candidate,now).length===2,'manual network event does not cover both fixture flights');
    assert(w.processNetworkOperationalIncidents(now),'network processor did not open or update the shared case');
    const incidents=w.eval(`state.incidents.filter(incident=>incident.status==='open'&&incident.type==='network_airspace_closure')`);
    assert(incidents.length===1,`expected one shared network incident, got ${incidents.length}`);
    const incident=incidents[0];
    assert(incident.scope?.kind==='network','network airspace closure did not store network scope');
    assert(incident.scope.subjectId==='fixture-airspace-closure','network scope subject is not the shared event id');
    const affected=w.incidentAffectedFlightIds(incident).sort();
    assert(JSON.stringify(affected)===JSON.stringify([first.id,second.id].sort()),`network incident did not retain exactly the affected flights: ${affected.join(',')}`);
    assert(w.openIncidentsForFlight(first.id).some(item=>item.id===incident.id),'first flight does not see the shared network incident');
    assert(w.openIncidentsForFlight(second.id).some(item=>item.id===incident.id),'second flight does not see the shared network incident');

    w.refreshAll();
    await wait(120);
    const caseText=d.querySelector(`[data-incident-case="${incident.id}"]`)?.textContent||'';
    assert(caseText.includes('Affected flights')&&caseText.includes(first.id)&&caseText.includes(second.id),'incident card does not show affected network flights');

    for(let i=0;i<80&&!w.__aeroMapReady;i++) await wait(100);
    assert(w.__aeroMapReady,'map did not finish initializing before network fixture checks');
    w.updateMapData();
    await wait(80);
    const feature=w.eval(`map.getSource('network-events')?.data?.features?.find(feature=>feature.properties.id==='NET-FIXTURE-AIRSPACE')`);
    assert(feature?.geometry?.type==='Polygon','network event polygon was not rendered into the map source');
    assert(feature.properties.tooltip.includes('2 affected flights'),'network event map tooltip does not summarize affected flights');

    assert(w.performOperationalTask(`${incident.id}:dispatch-network-airspace-strategy`,'reroute_around'),'network airspace strategy selection was rejected');
    const routeTask=w.incidentTasks(incident.id).find(task=>task.key==='dispatch-network-airspace-reroute');
    assert(routeTask?.status==='available','network route-revision task did not unlock after selecting reroute');
    assert(w.performOperationalTask(routeTask.id),'network route-revision task was rejected');
    assert(routeTask.status==='waiting_external','network route-revision task should wait for external coordination');
    assert(first.networkConstraintIds.includes('fixture-airspace-closure')&&second.networkConstraintIds.includes('fixture-airspace-closure'),'network constraint tag was not applied to all affected flights');
    assert(w.AeroRoutePlanning.activeRevision(first.routePlan)?.mode==='network_avoidance','first flight did not receive a network avoidance route revision');
    assert(w.AeroRoutePlanning.activeRevision(second.routePlan)?.mode==='network_avoidance','second flight did not receive a network avoidance route revision');
    w.processOperationalWorkflows(Number.MAX_SAFE_INTEGER);
    assert(incident.status==='resolved','network incident did not resolve after coordination response');

    result.textContent=`PASS network incidents validated\nincident=${incident.id}\naffected=${affected.join(',')}`;
    await wait(10);
  }catch(error){
    result.textContent='FAIL\n'+(error.stack||error);
  }
})();
</script>
