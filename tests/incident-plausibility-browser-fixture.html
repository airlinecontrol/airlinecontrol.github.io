<!doctype html>
<meta charset="utf-8">
<title>Airline OCC incident plausibility fixture</title>
<pre id="result">RUNNING</pre>
<iframe id="game" style="width:1440px;height:900px"></iframe>
<script>
(async()=>{
  const result=document.getElementById('result');
  const frame=document.getElementById('game');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const assert=(condition,message)=>{ if(!condition) throw new Error(message); };
  const loadApp=async()=>{
    const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
    frame.src='../index.html?fixture=incident-plausibility&cache='+Date.now();
    await loaded;
  };
  try{
    localStorage.removeItem('aerosim_mvp_v6');
    localStorage.removeItem('aerosim_occ_ui_v1');
    await loadApp();
    const w=frame.contentWindow;
    w.resetLocalSave?.();
    await wait(150);
    w.eval(`
      state.ops.automaticDisruptions=false;
      state.aircraft=[];
      state.flights=[];
      state.incidents=[];
      state.coordinationTasks=[];
      state.resourceRequests=[];
      state.personnelTransfers=[];
    `);
    for(const airport of ['FRA','LHR','AMS','CDG','MAD','VIE']){
      w.changeStaff(airport,'captains',30);
      w.changeStaff(airport,'firstOfficers',30);
      w.changeStaff(airport,'cabinCrew',60);
      w.changeStaff(airport,'groundHandling',60);
      w.changeStaff(airport,'operations',20);
      w.changeStaff(airport,'customerService',20);
      w.changeQualification(airport,'captains','Airbus A320 family',30);
      w.changeQualification(airport,'firstOfficers','Airbus A320 family',30);
    }

    const definitions=w.eval('INCIDENT_DEFINITIONS');
    const workflows=w.eval('OperationalWorkflows.WORKFLOWS');
    const retired=w.eval('Array.from(RETIRED_INCIDENT_TYPES)');
    const activeTypes=Object.keys(definitions).filter(type=>!retired.includes(type));
    const missingWorkflows=activeTypes.filter(type=>!workflows[type]);
    assert(!missingWorkflows.length,'active incident definitions missing workflows: '+missingWorkflows.join(', '));
    const missingDefaults=w.eval('Object.keys(INCIDENT_DEFINITIONS).filter(type=>!RETIRED_INCIDENT_TYPES.has(type)&&!INCIDENT_DEFAULT_POLICIES[type])');
    assert(!missingDefaults.length,'active incident definitions missing no-action default policies: '+missingDefaults.join(', '));
    const orphanWorkflows=Object.keys(workflows).filter(type=>!definitions[type]&&!retired.includes(type));
    assert(!orphanWorkflows.length,'workflow exists without an incident definition: '+orphanWorkflows.join(', '));

    const badLabels=[];
    for(const [type,workflow] of Object.entries(workflows)){
      for(const step of workflow.steps||[]){
        const label=`${type}:${step.key}:${step.label||''}`;
        if(/\b(resolve issue|issue release|dispatch release)\b/i.test(`${step.kind} ${step.label} ${step.detail}`)) badLabels.push(label);
        for(const option of step.options||[]){
          if(/\b(resolve issue|issue release|dispatch release)\b/i.test(`${option.id} ${option.label} ${option.detail}`)) badLabels.push(`${label}:${option.id}`);
          assert(option.label&&option.detail,`incident option ${type}:${step.key}:${option.id} is missing label/detail`);
        }
      }
    }
    assert(!badLabels.length,'old magic-resolution wording leaked into workflows: '+badLabels.join(', '));

    const now=w.simNow();
    const makeGround=type=>{
      const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      return w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'AMS',departure:now+(4+activeTypes.indexOf(type)%20)*60*60_000,fare:{economy:120,business:300,first:600}});
    };
    const makeAirborne=type=>{
      const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure:now-(45+activeTypes.indexOf(type))*60_000,fare:{economy:140,business:360,first:700}});
      flight.departureLogged=true;
      flight.actualDeparture=flight.departure;
      flight.actualArrival=now+120*60_000;
      flight.fueled=true;
      return flight;
    };
    const retiredCreated=retired.filter(type=>Boolean(w.createIncident(type,makeGround(type),{training:true,detectedAt:now})));
    assert(!retiredCreated.length,'retired incident types are still creatable: '+retiredCreated.join(', '));

    const groundFailures=[];
    const airborneFailures=[];
    for(const type of activeTypes){
      const definition=definitions[type];
      if(definition.airborneOnly&&type!=='destination_closure'){
        const created=w.createIncident(type,makeGround(type),{training:true,detectedAt:now});
        if(created) groundFailures.push(`${type}->${created.type}`);
      }
      if(!definition.airborneOnly&&!definition.allowAirborne){
        const created=w.createIncident(type,makeAirborne(type),{training:true,detectedAt:now});
        if(created) airborneFailures.push(`${type}->${created.type}`);
      }
    }
    assert(!groundFailures.length,'airborne-only incidents can be created on ground flights: '+groundFailures.join(', '));
    assert(!airborneFailures.length,'ground-only incidents can be created on airborne flights: '+airborneFailures.join(', '));

    const groundClosure=w.createIncident('destination_closure',makeGround('destination_closure'),{training:true,detectedAt:now});
    const airborneClosure=w.createIncident('destination_closure',makeAirborne('destination_closure'),{training:true,detectedAt:now});
    assert(groundClosure?.type==='destination_closure_ground','ground destination closure did not route to the ground OCC flow');
    assert(airborneClosure?.type==='destination_closure','airborne destination closure did not remain a flight-watch flow');

    const workflowProblems=[];
    for(const type of activeTypes){
      const flight=definitions[type].airborneOnly?makeAirborne(type):makeGround(type);
      const context=type==='destination_below_minima'
        ? {sourceId:flight.id,airport:flight.to,conditions:'Low visibility',level:'caution',visibilityKm:1.2,ceilingFt:400,minima:'visibility 1.2 km / ceiling 400 ft',active:true}
        : type==='aircraft_out_of_position'
          ? {sourceId:flight.id,aircraftId:flight.aircraftId,expectedLocation:'LHR',requiredLocation:flight.from,active:true}
          : {sourceId:flight.id,active:true,delayMin:25};
      const incident=w.createIncident(type,flight,{training:true,detectedAt:now,source:'fixture',sourceKey:`plausibility:${type}`,context});
      if(!incident){ workflowProblems.push(`${type}: not creatable in expected phase`); continue; }
      const tasks=w.incidentTasks(incident.id);
      if(!tasks.length) workflowProblems.push(`${type}: no tasks`);
      const initial=tasks.filter(task=>task.status==='available');
      if(!initial.length) workflowProblems.push(`${type}: no initial available task`);
      for(const task of tasks){
        if(['technical_strategy','recovery_strategy','authority_decision'].includes(task.kind)){
          const options=task.strategyOptions||[];
          if(!options.length) workflowProblems.push(`${type}:${task.key}: no strategy options`);
          for(const option of options){
            const consequence=w.operationalOptionConsequence(task,incident,option.id);
            if(option.id!=='cancel'&&!option.detail&&!consequence) workflowProblems.push(`${type}:${task.key}:${option.id}: no consequence/detail`);
          }
        }
      }
    }
    assert(!workflowProblems.length,'workflow plausibility problems: '+workflowProblems.join('; '));

    {
      const staffBefore=w.staffAt('FRA','captains');
      const aircraftBefore=w.eval('state.aircraft.length');
      const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'AMS',departure:now+60*60_000,fare:{economy:120,business:300,first:600}});
      const incident=w.createIncident('crew_sick',flight,{training:true,detectedAt:now-30*60_000,source:'fixture',sourceKey:`default-cancel:${flight.id}`});
      incident.deadline=now-60_000;
      assert(w.processIncidentDeadlines(now),'crew sick default deadline did not report a change');
      assert(incident.status==='resolved'&&incident.defaultApplied,'crew sick default did not close the case');
      assert(flight.cancelled,'crew sick default did not cancel the affected flight');
      assert(w.staffAt('FRA','captains')===staffBefore,'default cancellation changed personnel resources');
      assert(w.eval('state.aircraft.length')===aircraftBefore+1,'default cancellation created or removed aircraft resources');
    }

    {
      const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'AMS',departure:now+70*60_000,fare:{economy:120,business:300,first:600}});
      const incident=w.createIncident('crew_report_delayed',flight,{training:true,detectedAt:now-30*60_000,source:'fixture',sourceKey:`default-delay:${flight.id}`,context:{sourceId:flight.id,delayMin:40,reason:'Crew transport delay'}});
      incident.deadline=now-60_000;
      assert(w.processIncidentDeadlines(now),'crew-report default deadline did not report a change');
      assert(incident.status==='resolved'&&incident.defaultApplied,'crew-report default did not close the case');
      assert(!flight.cancelled,'crew-report accept-delay default cancelled the flight');
      assert(flight.incidentDelayMin>=40,'crew-report accept-delay default did not apply the expected delay');
    }

    {
      const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'AMS',departure:now+80*60_000,fare:{economy:120,business:300,first:600}});
      const incident=w.createIncident('atc_ground_stop',flight,{training:true,detectedAt:now-30*60_000,source:'fixture',sourceKey:`default-hold:${flight.id}`,context:{sourceId:flight.id,delayMin:70}});
      incident.deadline=now-60_000;
      assert(w.processIncidentDeadlines(now),'ground-stop default deadline did not report a change');
      assert(incident.status==='open'&&incident.defaultApplied,'ground-stop default should keep the incident open');
      assert(!flight.cancelled,'ground-stop hold default cancelled the flight');
      assert(flight.incidentDelayMin>=15,'ground-stop hold default did not hold the flight');
    }

    {
      const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure:now-45*60_000,fare:{economy:120,business:300,first:600}});
      flight.departureLogged=true;
      flight.actualDeparture=flight.departure;
      flight.actualArrival=now+120*60_000;
      flight.fueled=true;
      const incident=w.createIncident('onboard_medical',flight,{training:true,detectedAt:now-20*60_000,source:'fixture',sourceKey:`default-flightdeck:${flight.id}`,context:{sourceId:flight.id,authorityDecision:'continue'}});
      incident.deadline=now-60_000;
      assert(w.processIncidentDeadlines(now),'airborne flight-deck default deadline did not report a change');
      assert(incident.status==='resolved'&&incident.defaultApplied,'airborne flight-deck default did not close the case');
      assert(!flight.cancelled,'airborne default cancelled a departed flight');
      assert(flight.enrouteDelayMin>=10,'airborne flight-deck default did not record an operational consequence');
    }

    {
      const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'JFK',departure:now-90*60_000,fare:{economy:220,business:520,first:1100}});
      flight.departureLogged=true;
      flight.actualDeparture=flight.departure;
      flight.actualArrival=now+5*60*60_000;
      flight.fueled=true;
      const incident=w.createIncident('onboard_medical',flight,{training:true,detectedAt:now-30*60_000,source:'fixture',sourceKey:`default-divert-followup:${flight.id}`,context:{sourceId:flight.id,authorityDecision:'divert'}});
      incident.deadline=now-60_000;
      assert(w.processIncidentDeadlines(now),'flight-deck diversion default did not report a change');
      assert(incident.status==='open'&&incident.defaultApplied,'flight-deck diversion default should keep the case open');
      assert(incident.selectedStrategy==='divert','flight-deck diversion default did not record the requested strategy');
      assert(!flight.diversionAirport,'flight-deck diversion default silently selected a diversion airport');
      const alternateTask=w.incidentTasks(incident.id).find(item=>item.kind==='alternate_selection');
      assert(alternateTask?.status==='available','flight-deck diversion default did not leave OCC alternate selection available');
    }

    {
      const ac=w.assignRequestedAircraft('A320neo',w.defaultCabin('A320neo'),'FRA');
      const flight=w.createFlightRecord({aircraftId:ac.id,from:'FRA',to:'LHR',departure:now-2*60*60_000,fare:{economy:120,business:300,first:600}});
      flight.departureLogged=true;
      flight.actualDeparture=flight.departure;
      flight.actualArrival=now+90*60_000;
      flight.fueled=true;
      flight.diversionAirport='AMS';
      const incident=w.createIncident('onboard_medical',flight,{training:true,detectedAt:now-45*60_000,source:'fixture',sourceKey:`old-silent-diversion:${flight.id}`,context:{sourceId:flight.id}});
      assert(incident,'old silent diversion fixture incident did not open');
      incident.status='resolved';
      incident.blocking=false;
      incident.resolvedAt=now-5*60_000;
      incident.defaultApplied=true;
      incident.defaultPolicy='flightdeck_default';
      incident.selectedAction='default_policy';
      incident.selectedStrategy='divert';
      incident.selectedAlternate='AMS';
      incident.automaticResolution=true;
      for(const task of w.incidentTasks(incident.id)) task.status='cancelled';
      assert(w.reopenSilentDefaultFlightdeckFollowups(now),'old silent flight-deck diversion was not repaired');
      assert(incident.status==='open'&&!incident.automaticResolution,'old silent flight-deck diversion was not reopened for OCC work');
      assert(flight.diversionAirport==='AMS','repair should not silently undo an already-active diversion');
      const alternateTask=w.incidentTasks(incident.id).find(item=>item.kind==='alternate_selection');
      assert(alternateTask?.status==='available','reopened silent diversion did not restore the OCC follow-up task');
    }

    result.textContent=`PASS incident plausibility matrix validated\nincidents=${activeTypes.length}\nretired=${retired.join(',')}`;
  }catch(error){
    console.error(error);
    result.textContent='FAIL\n'+(error?.stack||error);
  }
})();
</script>
